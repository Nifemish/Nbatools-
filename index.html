  const IT_STREETS = ['Roma','Garibaldi','Dante Alighieri','Giuseppe Verdi','Mazzini','della Libertà','San Francesco','Vittorio Emanuele','Marconi','delle Rose','Cavour','Michelangelo'];
  const IT_TYPES   = ['Via','Viale','Corso','Piazza','Vicolo'];
  const PT_STREETS = ['das Flores','do Comércio','Dom Pedro II','Santos Dumont','da Liberdade','São João','Sete de Setembro','das Palmeiras','Getúlio Vargas','da Paz','Brasil','Amazonas'];
  const PT_TYPES   = ['Rua','Avenida','Travessa','Praça','Alameda'];
  const NL_STREETS = ['Dorps','Kerk','School','Molen','Beuken','Wilgen','Juliana','Oranje','Markt','Nieuw','Zonne','Linde'];
  const NL_SUFFIX  = ['straat','laan','weg','plein','pad','gracht'];
  const NORDIC     = ['Storgatan','Kungsgatan','Sveavägen','Björkvägen','Skolgatan','Havnegade','Nørregade','Strandvejen','Kirkeveien','Storgata','Mannerheimintie','Aleksanterinkatu'];
  const SLAV       = ['Kwiatowa','Słoneczna','Polna','Lipowa','Krakowska','Sadová','Hlavní','Nádražní','Lenina','Sovetskaya','Pushkina','Shevchenka','Nezalezhnosti'];
  const AR_STREETS = ['Al Wahda','Al Nahda','King Fahd','Sheikh Zayed','Al Salam','Al Corniche','Al Falah','Omar Bin Khattab','Al Andalus','Al Rawdah','Tahrir','Al Maarifa'];
  const AR_TYPES   = ['Street','Road'];
  const IN_STREETS = ['MG','Nehru','Gandhi','Station','Ring','Anna Salai','Brigade','Linking','Park','Temple','Bazaar','Civil Lines','Jinnah','Shahrah-e-Faisal','Dhanmondi'];
  const IN_TYPES   = ['Road','Street','Marg','Nagar','Cross','Lane'];
  const AF_STREETS = ['Independence','Unity','Adeola Odeku','Awolowo','Herbert Macaulay','Ring','Liberation','Oxford','Kenyatta','Moi','Nelson Mandela','Kwame Nkrumah','Ahmadu Bello','Marine','Victoria'];
  const AF_TYPES   = ['Street','Road','Avenue','Close','Crescent','Way'];
  const CJK_STREETS= ['Zhongshan','Renmin','Nanjing','Jianguo','Sakura','Chuo','Ginza','Hikari','Sejong','Teheran','Gangnam','Orchard','Bukit Timah','Jalan Merdeka','Sukhumvit','Nguyen Hue','Le Loi','Ayala','Rizal'];
  const CJK_TYPES  = ['Road','Street','Avenue','Boulevard'];

  const UNITS = ['Apt', 'Suite', 'Flat', 'Unit', 'No.'];

  /* ---------- country profiles ----------
     order: 'house-first' | 'street-first'
     line2: template for the locality line
     postal: pattern (null = no postal code)                                */
  const P = {};
  function def(names, cfg){ names.forEach(n => P[n.toLowerCase()] = cfg); }

  const EN_HOUSE = {streets:EN_STREETS, types:EN_TYPES, order:'house-first'};

  def(['united states','usa','us','united states of america'], {...EN_HOUSE, postal:'#####', line2:'{city}, {region} {postal}'});
  def(['canada','ca'], {...EN_HOUSE, postal:'@#@ #@#', line2:'{city}, {region} {postal}'});
  def(['united kingdom','uk','great britain','england','scotland','wales','northern ireland','gb'], {...EN_HOUSE, postal:'@@# #@@', line2:'{city}, {region}\n{postal}'});
  def(['ireland','ie'], {...EN_HOUSE, postal:'@## @@##', line2:'{city}, Co. {region}\n{postal}'});
  def(['australia','au'], {...EN_HOUSE, postal:'####', line2:'{city} {region} {postal}'});
  def(['new zealand','nz'], {...EN_HOUSE, postal:'####', line2:'{city} {postal}, {region}'});
  def(['india','in'], {streets:IN_STREETS, types:IN_TYPES, order:'house-first', postal:'######', line2:'{city}, {region} {postal}'});
  def(['pakistan','pk'], {streets:IN_STREETS, types:IN_TYPES, order:'house-first', postal:'#####', line2:'{city}, {region} {postal}'});
  def(['bangladesh','bd'], {streets:IN_STREETS, types:IN_TYPES, order:'house-first', postal:'####', line2:'{city} {postal}, {region}'});
  def(['nigeria','ng'], {streets:AF_STREETS, types:AF_TYPES, order:'house-first', postal:'######', line2:'{city}, {region} {postal}'});
  def(['ghana','gh','kenya','ke','uganda','tanzania','zambia','zimbabwe','cameroon','ethiopia','rwanda','senegal','ivory coast',"côte d'ivoire"], {streets:AF_STREETS, types:AF_TYPES, order:'house-first', postal:null, line2:'{city}, {region}'});
  def(['south africa','za'], {streets:AF_STREETS, types:AF_TYPES, order:'house-first', postal:'####', line2:'{city}, {region}, {postal}'});
  def(['germany','de','austria','at','switzerland','ch'], {streets:DE_STREETS, suffix:DE_SUFFIX, order:'street-first', postal:'####0', line2:'{postal} {city}'});
  def(['france','fr','belgium','be','luxembourg'], {streets:FR_STREETS, types:FR_TYPES, order:'house-first', postal:'#####', line2:'{postal} {city}'});
  def(['spain','es','argentina','ar','chile','cl','colombia','co','peru','venezuela','ecuador','uruguay','bolivia','costa rica','panama','guatemala','cuba','dominican republic'], {streets:ES_STREETS, types:ES_TYPES, order:'street-first', postal:'#####', line2:'{postal} {city}, {region}'});
  def(['mexico','mx'], {streets:ES_STREETS, types:ES_TYPES, order:'street-first', postal:'#####', line2:'Col. Centro, {postal} {city}, {region}'});
  def(['italy','it'], {streets:IT_STREETS, types:IT_TYPES, order:'street-first', postal:'#####', line2:'{postal} {city} {region}'});
  def(['portugal','pt'], {streets:PT_STREETS, types:PT_TYPES, order:'street-first', postal:'####-###', line2:'{postal} {city}'});
  def(['brazil','br'], {streets:PT_STREETS, types:PT_TYPES, order:'street-first', postal:'#####-###', line2:'{city} - {region}, {postal}'});
  def(['netherlands','nl','holland'], {streets:NL_STREETS, suffix:NL_SUFFIX, order:'street-first', postal:'#### @@', line2:'{postal} {city}'});
  def(['sweden','se','norway','no','denmark','dk','finland','fi','iceland'], {streets:NORDIC, order:'street-first', postal:'### ##', line2:'{postal} {city}'});
  def(['poland','pl','czechia','czech republic','slovakia','hungary','romania','bulgaria','croatia','serbia','ukraine','ua','russia','ru','belarus','lithuania','latvia','estonia'], {streets:SLAV, order:'street-first', postal:'##-###', line2:'{postal} {city}, {region}'});
  def(['united arab emirates','uae','ae','saudi arabia','sa','qatar','kuwait','bahrain','oman','jordan','lebanon','iraq','egypt','eg','morocco','ma','tunisia','algeria','libya'], {streets:AR_STREETS, types:AR_TYPES, order:'house-first', postal:null, line2:'{city}, {region}'});
  def(['china','cn','hong kong','taiwan'], {streets:CJK_STREETS, types:CJK_TYPES, order:'house-first', postal:'######', line2:'{city}, {region} {postal}'});
  def(['japan','jp'], {streets:CJK_STREETS, types:CJK_TYPES, order:'house-first', postal:'###-####', line2:'{city}, {region} {postal}'});
  def(['south korea','korea','kr'], {streets:CJK_STREETS, types:CJK_TYPES, order:'house-first', postal:'#####', line2:'{city}, {region} {postal}'});
  def(['singapore','sg'], {streets:CJK_STREETS, types:CJK_TYPES, order:'house-first', postal:'######', line2:'Singapore {postal}'});
  def(['malaysia','my','indonesia','id','thailand','th','vietnam','vn','philippines','ph'], {streets:CJK_STREETS, types:CJK_TYPES, order:'house-first', postal:'#####', line2:'{city}, {region} {postal}'});
  def(['turkey','türkiye','tr','greece','gr'], {streets:SLAV.concat(EN_STREETS), order:'street-first', postal:'#####', line2:'{postal} {city}/{region}'});

  const GENERIC = {streets:EN_STREETS, types:EN_TYPES, order:'house-first', postal:'#####', line2:'{city}, {region} {postal}'};

  function profileFor(country){
    const key = String(country||'').trim().toLowerCase().replace(/\.$/,'');
    if(!key) return GENERIC;
    if(P[key]) return P[key];
    // partial match ("republic of ireland", "the netherlands", ...)
    const hit = Object.keys(P).find(k => k.length>3 && (key.includes(k) || k.includes(key)));
    return hit ? P[hit] : GENERIC;
  }

  const US_STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];

  function streetName(prof){
    if(prof.suffix) return pick(prof.streets) + pick(prof.suffix);
    const base = pick(prof.streets);
    return prof.types ? (prof.order==='street-first' ? pick(prof.types)+' '+base : base+' '+pick(prof.types)) : base;
  }

  /* ---------- public generator ---------- */
  function generateAddress(opts){
    opts = opts || {};
    const country = (opts.country||'').trim();
    const prof = profileFor(country);
    let city = (opts.city||'').trim();
    let region = (opts.region||'').trim();
    if(!city) city = pick(['Springfield','Riverton','Fairview','Georgetown','Newport','Kingston','Ashford','Milton']);
    if(!region && profileFor(country)===P['united states']) region = pick(US_STATES);

    const house = String(num(1, 480) + (Math.random()<0.35 ? num(0,9)*100 : 0)) || '12';
    const street = streetName(prof);
    let line1 = prof.order==='street-first' ? `${street} ${house}` : `${house} ${street}`;
    if(Math.random() < 0.3) line1 += `, ${pick(UNITS)} ${num(1,45)}${Math.random()<.4?pick(['A','B','C']):''}`;

    const postal = prof.postal ? pattern(prof.postal) : '';
    let rest = prof.line2
      .replace(/{city}/g, city)
      .replace(/{region}/g, region)
      .replace(/{postal}/g, postal)
      .replace(/\s{2,}/g,' ')
      .replace(/,\s*,/g, ',')
      .replace(/(^|\n)[,\s]+/g, '$1')
      .replace(/[,\s]+(\n|$)/g, '$1')
      .trim();

    const lines = (line1 + '\n' + rest).split('\n').map(s=>s.trim()).filter(Boolean);
    return {
      lines,
      multiline: lines.join('\n'),
      oneline: lines.join(', '),
      postal, city, region, country, street: line1
    };
  }
  window.generateRandomAddress = generateAddress;

  /* ---------- field wiring ---------- */
  const ADDRESS_RE = /address|addr(?:ess)?_?line|street/i;
  function isAddressField(el){
    if(!el || !(el.tagName==='INPUT' || el.tagName==='TEXTAREA')) return false;
    if(el.type && ['checkbox','radio','file','hidden','email','password','number','date'].includes(el.type)) return false;
    const bag = [el.id, el.name, el.getAttribute('placeholder')||''].join(' ');
    if(/email/i.test(bag)) return false;
    return ADDRESS_RE.test(bag) || el.dataset.addressField==='true';
  }

  // find related city / region / country inputs for a given address field
  function relatives(el){
    const scope = el.closest('form, .wizard-body, .license-form, .modal-box, section, body') || document;
    const id = el.id || '';
    const prefix = id.replace(/address.*$/i, '');
    const byPrefix = suffixes => {
      if(!prefix) return null;
      for(const s of suffixes){
        const f = scope.querySelector(`#${CSS.escape(prefix+s)}`) || document.getElementById(prefix+s);
        if(f) return f;
      }
      return null;
    };
    const byLoose = re => {
      const all = Array.from(scope.querySelectorAll('input, select'));
      return all.find(f => re.test(f.id||'') || re.test(f.name||'')) || null;
    };
    return {
      city:    byPrefix(['city','town','City']) || byLoose(/city|town/i),
      region:  byPrefix(['state','region','province','State']) || byLoose(/state|region|province/i),
      country: byPrefix(['country','Country']) || byLoose(/country/i)
    };
  }

  function ctxOf(el){
    const r = relatives(el);
    // no dedicated city field? reuse the city already shown in the address
    let fallbackCity = '';
    if(!r.city && el.value){
      const l = el.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
      if(l.length>1) fallbackCity = l[1].replace(/[0-9]+/g,'').replace(/\s{2,}/g,' ').trim();
    }
    return {
      city: r.city ? r.city.value.trim() : fallbackCity,
      region: r.region ? r.region.value.trim() : '',
      country: r.country ? r.country.value.trim() : (el.dataset.defaultCountry || ''),
      rel: r
    };
  }

  function setValue(el, text){
    el.value = text;
    el.dataset.autoGenerated = 'true';
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.dispatchEvent(new Event('change', {bubbles:true}));
  }

  function fill(el){
    const c = ctxOf(el);
    const res = generateAddress(c);
    const multi = el.tagName === 'TEXTAREA';
    // keep it compact for 2-row textareas / single-line inputs
    setValue(el, multi ? res.lines.slice(0,2).join('\n') : res.oneline);
    return res;
  }

  function attach(el){
    if(el.dataset.addrGenReady) return;
    el.dataset.addrGenReady = '1';

    el.addEventListener('input', e => {
      if(e.isTrusted) { el.dataset.userEdited = 'true'; el.dataset.autoGenerated = 'false'; }
    });

    const bar = document.createElement('div');
    bar.className = 'addr-gen-bar';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'addr-gen-btn';
    btn.innerHTML = '<span aria-hidden="true" style="font-size:13px;line-height:1">&#8635;</span> Generate random address';
    btn.title = 'Create a realistic random address from the country, city and region you entered';
    const hint = document.createElement('span');
    hint.className = 'addr-gen-hint';
    hint.textContent = 'or type your own address';
    bar.appendChild(btn); bar.appendChild(hint);
    el.insertAdjacentElement('afterend', bar);

    btn.addEventListener('click', () => {
      const res = fill(el);
      el.dataset.userEdited = 'false';
      hint.textContent = res.country ? `Generated for ${res.country}` : 'Generated (add a country for local formatting)';
      if(typeof window.showToast === 'function') window.showToast('Random address generated');
    });

    // auto-fill once the user provides country/city, if address is still empty
    const {rel} = ctxOf(el);
    ['city','region','country'].forEach(k=>{
      const f = rel[k];
      if(!f) return;
      const auto = () => {
        if(el.dataset.userEdited === 'true') return;
        if(el.value.trim() && el.dataset.autoGenerated !== 'true') return;
        const c = ctxOf(el);
        if(!c.country && !c.city) return;
        if(!el.value.trim() || el.dataset.autoGenerated === 'true') fill(el);
      };
      f.addEventListener('change', auto);
      f.addEventListener('blur', auto);
    });
  }

  function scan(root){
    (root || document).querySelectorAll('input, textarea').forEach(el => { if(isAddressField(el)) attach(el); });
  }

  // the app re-renders pages/wizard steps dynamically — keep watching
  const mo = new MutationObserver(muts => {
    for(const m of muts){
      m.addedNodes.forEach(n => { if(n.nodeType === 1) scan(n); });
    }
  });

  function boot(){
    scan(document);
    mo.observe(document.body, {childList:true, subtree:true});
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<!-- ==========================================================
     TRACKPORT — PREMIUM EXPERIENCE LAYER (design + motion + perf)
     Self-contained: only additive CSS/JS, no app logic touched.
     ========================================================== -->
<style id="tp-premium-layer">
  :root{
    --ease-lux: cubic-bezier(.16,1,.3,1);
    --ease-soft: cubic-bezier(.33,1,.68,1);
    --dur-fast: .28s;
    --dur-mid: .55s;
    --dur-slow: .9s;
    --glass-glow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 1px 0 rgba(255,255,255,.10) inset,
                  0 18px 50px rgba(0,0,0,.45), 0 0 60px -18px var(--primary-glow);
  }

  /* ---------- 1. Luxury soft scrolling ---------- */
  html{scroll-behavior:smooth; scroll-padding-top:104px;}
  html.tp-smooth, html.tp-smooth body{overscroll-behavior-y:none;}
  html, body{width:100%; max-width:100%; overflow-x:hidden;}
  body{scrollbar-gutter:auto;}
  @media (min-width:721px){ body{scrollbar-gutter:stable;} }
  ::-webkit-scrollbar-thumb{transition:background .4s var(--ease-lux);}

  /* Ambient scroll progress ribbon */
  #tp-progress{
    position:fixed; top:0; left:0; height:2px; width:100%; z-index:9999;
    transform:scaleX(0); transform-origin:0 50%;
    background:linear-gradient(90deg, rgba(212,175,90,0), var(--primary), #8f7ce8, rgba(212,175,90,0));
    box-shadow:0 0 18px var(--primary-glow);
    pointer-events:none; will-change:transform;
  }

  /* ---------- 2. Glowing glass background ---------- */
  #tp-aura{position:fixed; inset:0; z-index:-3; pointer-events:none; overflow:hidden;}
  #tp-aura .orb{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:.55;
    will-change:transform; mix-blend-mode:screen;
    animation:tpDrift 26s var(--ease-soft) infinite alternate;
  }
  #tp-aura .orb.a{width:46vw; height:46vw; left:-8vw; top:-10vh;
    background:radial-gradient(circle at 30% 30%, rgba(212,175,90,.55), transparent 70%); animation-duration:24s;}
  #tp-aura .orb.b{width:52vw; height:52vw; right:-12vw; top:12vh;
    background:radial-gradient(circle at 60% 40%, rgba(110,96,235,.48), transparent 70%); animation-duration:31s; animation-delay:-6s;}
  #tp-aura .orb.c{width:44vw; height:44vw; left:26vw; bottom:-18vh;
    background:radial-gradient(circle at 50% 50%, rgba(36,174,168,.40), transparent 70%); animation-duration:37s; animation-delay:-13s;}
  #tp-aura .veil{
    position:absolute; inset:-10%;
    background:
      radial-gradient(1200px 700px at var(--mx,50%) var(--my,30%), rgba(255,255,255,.07), transparent 62%),
      linear-gradient(180deg, rgba(6,7,12,.35), rgba(6,7,12,.72));
    transition:background-position .6s var(--ease-lux);
  }
  #tp-grain{
    position:fixed; inset:0; z-index:-2; pointer-events:none; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  }
  @keyframes tpDrift{
    0%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(4vw,-3vh,0) scale(1.12);}
    100%{transform:translate3d(-3vw,4vh,0) scale(1.05);}
  }

  /* ---------- 3. Premium glass surfaces ---------- */
  .glass, .card, .panel, .modal, .sheet, .navbar, .stat, .tile, .box{
    transition:transform var(--dur-mid) var(--ease-lux),
               box-shadow var(--dur-mid) var(--ease-lux),
               border-color var(--dur-mid) var(--ease-lux),
               background var(--dur-mid) var(--ease-lux);
  }
  .glass, .card, .panel{
    -webkit-backdrop-filter:blur(26px) saturate(165%);
    backdrop-filter:blur(26px) saturate(165%);
    box-shadow:var(--glass-glow);
  }
  .glass:hover, .card:hover, .panel:hover{
    border-color:rgba(255,255,255,.22);
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 26px 70px rgba(0,0,0,.5), 0 0 80px -18px var(--primary-glow);
  }
  /* Specular sheen that follows the pointer */
  .tp-sheen{position:relative; overflow:hidden;}
  .tp-sheen::after{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(320px circle at var(--px,50%) var(--py,50%), rgba(255,255,255,.14), transparent 60%);
    transition:opacity .45s var(--ease-lux);
  }
  .tp-sheen:hover::after{opacity:1;}

  /* ---------- 4. Touch / press micro-interactions ---------- */
  button, .btn, a.btn, .nav-link, [role="button"], .tab, .chip{
    -webkit-tap-highlight-color:transparent;
    transition:transform var(--dur-fast) var(--ease-lux), box-shadow var(--dur-fast) var(--ease-lux),
               background var(--dur-fast) var(--ease-lux), color var(--dur-fast) var(--ease-lux),
               opacity var(--dur-fast) var(--ease-lux);
  }
  .btn:hover, button:hover{transform:translateY(-1.5px);}
  .btn:active, button:active, [role="button"]:active{transform:translateY(0) scale(.975);}
  .tp-press{transform:scale(.97) !important;}
  .tp-ripple{
    position:absolute; border-radius:50%; transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle, rgba(255,255,255,.55), rgba(212,175,90,.25) 45%, transparent 70%);
    pointer-events:none; animation:tpRipple .65s var(--ease-lux) forwards; mix-blend-mode:screen;
  }
  @keyframes tpRipple{to{transform:translate(-50%,-50%) scale(1); opacity:0;}}
  input, select, textarea{transition:box-shadow var(--dur-fast) var(--ease-lux), border-color var(--dur-fast) var(--ease-lux), background var(--dur-fast) var(--ease-lux);}
  input:focus, select:focus, textarea:focus{
    box-shadow:0 0 0 3px var(--primary-light), 0 0 30px -8px var(--primary-glow); outline:none;
  }
  :focus-visible{outline:2px solid var(--primary); outline-offset:3px; border-radius:8px;}

  /* ---------- 5. Reveal-on-scroll choreography ---------- */
  .tp-reveal{opacity:0; transform:translate3d(0,22px,0) scale(.985); filter:blur(6px); will-change:opacity, transform;}
  .tp-reveal.tp-in{
    opacity:1 !important; transform:none !important; filter:blur(0) !important;
    transition:opacity var(--dur-slow) var(--ease-lux), transform var(--dur-slow) var(--ease-lux), filter var(--dur-slow) var(--ease-lux);
    transition-delay:var(--tp-delay, 0ms);
  }
  .tp-fade-page{animation:tpPageIn .7s var(--ease-lux) both;}
  @keyframes tpPageIn{from{opacity:0; transform:translate3d(0,14px,0) scale(.995); filter:blur(4px);} to{opacity:1; transform:none; filter:none;}}

  /* ---------- 6. Performance hints ---------- */
  img, video{content-visibility:auto;}
  .card, .panel, section{contain:paint;}
  #tp-aura, #tp-progress, .tp-reveal{backface-visibility:hidden;}

  /* Touch scrolling should stay visually anchored: keep the soft fade,
     but remove horizontal reveal motion and moving ambient layers. */
  @media (max-width:720px), (pointer:coarse){
    #tp-aura .orb{animation:none; transform:none; will-change:auto;}
    #tp-aura .veil{transition:none;}
    .reveal-left, .reveal-right{transform:none;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
    .tp-reveal{opacity:1; transform:none; filter:none;}
  }
</style>

<style id="trackport-version-update">

<div id="tp-progress"></div>
<div id="tp-aura" aria-hidden="true">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="veil"></div>
</div>
<div id="tp-grain" aria-hidden="true"></div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const raf = requestAnimationFrame;

  /* ---- Luxury inertia scrolling (wheel-driven, touch stays native) ---- */
  if(!reduce && matchMedia('(pointer:fine)').matches){
    document.documentElement.classList.add('tp-smooth');
    let target = window.scrollY, current = window.scrollY, running = false;
    const ease = 0.11;
    const max = () => document.documentElement.scrollHeight - window.innerHeight;
    const loop = () => {
      current += (target - current) * ease;
      if(Math.abs(target - current) < .4){ current = target; running = false; }
      window.scrollTo(0, current);
      if(running) raf(loop);
    };
    addEventListener('wheel', e => {
      if(e.ctrlKey) return;
      const path = e.composedPath?.() || [];
      for(const el of path){
        if(el instanceof HTMLElement){
          const st = getComputedStyle(el).overflowY;
          if((st === 'auto' || st === 'scroll') && el.scrollHeight > el.clientHeight + 2) return;
        }
      }
      e.preventDefault();
      target = Math.min(max(), Math.max(0, target + e.deltaY * 1.05));
      if(!running){ running = true; current = window.scrollY; raf(loop); }
    }, { passive:false });
    addEventListener('scroll', () => { if(!running) target = current = window.scrollY; }, { passive:true });
    addEventListener('resize', () => { target = current = window.scrollY; }, { passive:true });
  }

  /* ---- Scroll progress ribbon ---- */
  const bar = document.getElementById('tp-progress');
  let ticking = false;
  const drawProgress = () => {
    const h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`;
    ticking = false;
  };
  addEventListener('scroll', () => { if(!ticking){ ticking = true; raf(drawProgress); } }, { passive:true });
  drawProgress();

  /* ---- Aura follows the pointer (throttled to one frame) ---- */
  const veil = document.querySelector('#tp-aura .veil');
  let pending = false, px = 50, py = 30;
  const movePointer = (x, y) => {
    px = (x / innerWidth) * 100; py = (y / innerHeight) * 100;
    if(!pending){ pending = true; raf(() => { veil.style.setProperty('--mx', px + '%'); veil.style.setProperty('--my', py + '%'); pending = false; }); }
  };
  if(!reduce){
    addEventListener('pointermove', e => movePointer(e.clientX, e.clientY), { passive:true });
  }

  /* ---- Reveal on scroll (works with dynamically rendered views) ---- */
  const SELECTOR = '.card, .panel, .glass, section, .stat, .tile, .hero, .feature, .step, .row-item, table, .box';
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
    entries.forEach((en, i) => {
      if(en.isIntersecting){
        en.target.style.setProperty('--tp-delay', Math.min(i * 55, 260) + 'ms');
        en.target.classList.add('tp-in');
        io.unobserve(en.target);
      }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 }) : null;

  const enhance = (root) => {
    if(reduce || !io) return;
    const elements = [];
    if(root.matches?.(SELECTOR)) elements.push(root);
    root.querySelectorAll?.(SELECTOR).forEach(el => elements.push(el));
    elements.forEach(el => {
      if(el.dataset.tpSeen) return;
      el.dataset.tpSeen = '1';
      el.classList.add('tp-reveal');
      if(el.matches('.card, .panel, .glass, .tile, .stat')) el.classList.add('tp-sheen');
      io.observe(el);
    });
  };

  const app = document.getElementById('app') || document.body;
  enhance(document);
  let mo_t;
  const pendingEnhanceRoots = new Set();
  new MutationObserver(mutations => {
    mutations.forEach(mutation => mutation.addedNodes.forEach(node => {
      if(node.nodeType === 1) pendingEnhanceRoots.add(node);
    }));
    clearTimeout(mo_t); mo_t = setTimeout(() => {
      pendingEnhanceRoots.forEach(root => enhance(root));
      pendingEnhanceRoots.clear();
    app.firstElementChild?.classList.add('tp-fade-page');
    }, 60);
  }).observe(app, { childList:true, subtree:true });

  /* ---- Pointer sheen coordinates ---- */
  let sheenFrame = 0;
  let pendingSheen = null;
  document.addEventListener('pointermove', e => {
    const card = e.target.closest?.('.tp-sheen');
    if(!card) return;
    pendingSheen = { card, x:e.clientX, y:e.clientY };
    if(sheenFrame) return;
    sheenFrame = raf(() => {
      const next = pendingSheen;
      pendingSheen = null;
      sheenFrame = 0;
      if(!next) return;
      const r = next.card.getBoundingClientRect();
      if(!r.width || !r.height) return;
      next.card.style.setProperty('--px', ((next.x - r.left) / r.width * 100) + '%');
      next.card.style.setProperty('--py', ((next.y - r.top) / r.height * 100) + '%');
    });
  }, { passive:true });

  /* ---- Touch / click ripple + press feedback ---- */
  const RIPPLE_SEL = 'button, .btn, [role="button"], .nav-link, .chip, .tab, .addr-gen-btn';
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest?.(RIPPLE_SEL);
    if(!el || reduce) return;
    el.classList.add('tp-press');
    const cs = getComputedStyle(el);
    if(cs.position === 'static') el.style.position = 'relative';
    if(cs.overflow === 'visible') el.style.overflow = 'hidden';
    const r = el.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2.2;
    const s = document.createElement('span');
    s.className = 'tp-ripple';
    s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;`;
    el.appendChild(s);
    setTimeout(() => s.remove(), 680);
  }, { passive:true });
  const unpress = () => document.querySelectorAll('.tp-press').forEach(el => el.classList.remove('tp-press'));
  addEventListener('pointerup', unpress, { passive:true });
  addEventListener('pointercancel', unpress, { passive:true });

  /* ---- Haptic tap on supported touch devices ---- */
  addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch' && navigator.vibrate && e.target.closest?.(RIPPLE_SEL)) navigator.vibrate(8);
  }, { passive:true });

  /* ---- Performance: lazy-load + async decode every image ---- */
  const lazify = (root) => root.querySelectorAll?.('img').forEach(img => {
    if(!img.loading) img.loading = 'lazy';
    img.decoding = 'async';
  });
  lazify(document);
  new MutationObserver(mutations => {
    mutations.forEach(mutation => mutation.addedNodes.forEach(node => {
      if(node.nodeType === 1) lazify(node);
    }));
  }).observe(document.body, { childList:true, subtree:true });

  /* ---- Pause heavy background work when the tab is hidden ---- */
  document.addEventListener('visibilitychange', () => {
    const aura = document.getElementById('tp-aura');
    aura.style.animationPlayState = document.hidden ? 'paused' : 'running';
    aura.querySelectorAll('.orb').forEach(o => o.style.animationPlayState = document.hidden ? 'paused' : 'running');
  });
})();
</script>

<script id="trackport-pwa">
/* ---------- installable PWA experience ---------- */
(function(){
  'use strict';

  let deferredInstallPrompt = null;
  const VERSION_META = document.querySelector('meta[name="trackport-version"]');
  const APP_VERSION = (VERSION_META?.content || '0.0.0').trim();
  const INSTALLED_VERSION_KEY = 'trackport:installed-version';
  const DISMISSED_VERSION_PREFIX = 'trackport:update-dismissed:';
  let serviceWorkerRegistration = null;
  let updateTargetVersion = '';
  let updateReloadStarted = false;
  let versionCheckBusy = false;

  const storageGet = (storage, key) => {
    try{ return storage.getItem(key); }catch(_error){ return null; }
  };
  const storageSet = (storage, key, value) => {
    try{ storage.setItem(key, value); }catch(_error){}
  };
  const isDismissed = version => Boolean(storageGet(sessionStorage, DISMISSED_VERSION_PREFIX + (version || 'latest')));

  function hideUpdateBanner(){
    const banner = document.getElementById('tp-app-update');
    if(banner) banner.hidden = true;
  }

  function showUpdateBanner(version){
    const nextVersion = String(version || '').trim();
    if(nextVersion && nextVersion === APP_VERSION && !storageGet(localStorage, INSTALLED_VERSION_KEY)) return;
    if(isDismissed(nextVersion)) return;
    updateTargetVersion = nextVersion;

    let banner = document.getElementById('tp-app-update');
    if(!banner){
      banner = document.createElement('aside');
      banner.id = 'tp-app-update';
      banner.setAttribute('role', 'status');
      banner.setAttribute('aria-live', 'polite');
      banner.innerHTML = `
        <div class="tp-update-copy">
          <strong>TrackPort update available</strong>
          <span data-tp-update-copy>A newer version is ready. Update without losing your saved records.</span>
        </div>
        <div class="tp-update-actions">
          <button type="button" class="tp-update-later" data-tp-update="later">Later</button>
          <button type="button" class="tp-update-now" data-tp-update="now">Update now</button>
        </div>`;
      document.body.appendChild(banner);
      banner.addEventListener('click', event => {
        const action = event.target.closest?.('[data-tp-update]')?.dataset.tpUpdate;
        if(action === 'later'){
          storageSet(sessionStorage, DISMISSED_VERSION_PREFIX + (updateTargetVersion || 'latest'), '1');
          hideUpdateBanner();
        }
        if(action === 'now') applyAppUpdate();
      });
    }
    const copy = banner.querySelector('[data-tp-update-copy]');
    if(copy){
      copy.textContent = nextVersion
        ? `Version ${nextVersion} is ready. Update without losing your saved records.`
        : 'A newer version is ready. Update without losing your saved records.';
    }
    banner.hidden = false;
  }

  function currentVersionWasPreviouslyInstalled(){
    const installedVersion = storageGet(localStorage, INSTALLED_VERSION_KEY);
    if(!installedVersion){
      storageSet(localStorage, INSTALLED_VERSION_KEY, APP_VERSION);
      return;
    }
    if(installedVersion !== APP_VERSION) showUpdateBanner(APP_VERSION);
  }

  function versionProbeUrl(){
    const url = new URL(window.location.href);
    url.hash = '';
    url.searchParams.delete('tp_update');
    url.searchParams.set('tp_version_probe', String(Date.now()));
    return url.toString();
  }

  function versionFromHtml(html){
    try{
      const parsed = new DOMParser().parseFromString(html, 'text/html');
      return (parsed.querySelector('meta[name="trackport-version"]')?.content || '').trim();
    }catch(_error){
      return '';
    }
  }

  async function checkForNewVersion(){
    if(versionCheckBusy || !/^https?:$/.test(window.location.protocol)) return;
    versionCheckBusy = true;
    try{
      const response = await fetch(versionProbeUrl(), {
        cache:'no-store',
        credentials:'same-origin',
        headers:{'Cache-Control':'no-cache'}
      });
      if(!response.ok) return;
      const remoteVersion = versionFromHtml(await response.text());
      if(remoteVersion && remoteVersion !== APP_VERSION) showUpdateBanner(remoteVersion);
    }catch(error){
      console.warn('TrackPort version check could not be completed.', error);
    }finally{
      versionCheckBusy = false;
    }
  }

  function forceFreshReload(){
    const url = new URL(window.location.href);
    url.searchParams.set('tp_update', String(Date.now()));
    window.location.replace(url.toString());
  }

  async function applyAppUpdate(){
    if(updateReloadStarted) return;
    updateReloadStarted = true;
    const button = document.querySelector('[data-tp-update="now"]');
    if(button){
      button.disabled = true;
      button.textContent = 'Updating…';
    }
    if(updateTargetVersion) storageSet(localStorage, INSTALLED_VERSION_KEY, updateTargetVersion);
    try{
      if(serviceWorkerRegistration){
        await serviceWorkerRegistration.update();
        const waiting = serviceWorkerRegistration.waiting;
        if(waiting){
          waiting.postMessage({type:'SKIP_WAITING'});
          return;
        }
      }
    }catch(error){
      console.warn('TrackPort service worker update could not be completed.', error);
    }
    forceFreshReload();
  }

  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  function installButtons(){
    return Array.from(document.querySelectorAll('[data-action="install-app"]'));
  }

  function updateInstallButtons(){
    const installed = isStandalone();
    installButtons().forEach(button => {
      button.hidden = installed;
      button.setAttribute('aria-hidden', installed ? 'true' : 'false');
      if(deferredInstallPrompt){
        button.title = 'Install TrackPort on this device';
      }
    });
  }

  function explainInstall(){
    const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    const message = isIos
      ? 'To install TrackPort, tap Share in Safari, then choose “Add to Home Screen”.'
      : 'Use your browser menu and choose “Install app” or “Add to Home screen”.';
    if(typeof window.showToast === 'function') window.showToast(message);
    else window.alert(message);
  }

  async function requestInstall(){
    if(!deferredInstallPrompt){
      explainInstall();
      return;
    }
    const promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;
    updateInstallButtons();
    try{
      await promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      if(choice && choice.outcome === 'accepted'){
        if(typeof window.showToast === 'function') window.showToast('TrackPort is being installed');
      }
    }catch(error){
      console.warn('TrackPort install prompt was not completed.', error);
      explainInstall();
    }
  }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    updateInstallButtons();
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    updateInstallButtons();
    if(typeof window.showToast === 'function') window.showToast('TrackPort installed successfully');
  });

  document.addEventListener('click', event => {
    const button = event.target.closest?.('[data-action="install-app"]');
    if(button){
      event.preventDefault();
      requestInstall();
    }
  });

  function registerServiceWorker(){
    if(!('serviceWorker' in navigator) || !/^https?:$/.test(window.location.protocol)) return;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(updateReloadStarted) window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(registration => {
      serviceWorkerRegistration = registration;
      if(registration.waiting && navigator.serviceWorker.controller) showUpdateBanner('');
      registration.addEventListener('updatefound', () => {
        const installing = registration.installing;
        if(!installing) return;
        installing.addEventListener('statechange', () => {
          if(installing.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBanner('');
          }
        });
      });
      setTimeout(() => registration.update().catch(() => {}), 1200);
    }).catch(error => {
      console.warn('TrackPort offline support could not be enabled.', error);
    });
  }

  function startVersionUpdateChecks(){
    const openedFromUpdate = new URL(window.location.href);
    if(openedFromUpdate.searchParams.has('tp_update')){
      openedFromUpdate.searchParams.delete('tp_update');
      window.history.replaceState(null, '', openedFromUpdate.pathname + openedFromUpdate.search + openedFromUpdate.hash);
    }
    currentVersionWasPreviouslyInstalled();
    checkForNewVersion();
    window.addEventListener('online', checkForNewVersion, {passive:true});
    document.addEventListener('visibilitychange', () => {
      if(!document.hidden) checkForNewVersion();
    }, {passive:true});
    window.setInterval(checkForNewVersion, 15 * 60 * 1000);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => {
      updateInstallButtons();
      startVersionUpdateChecks();
      registerServiceWorker();
    }, {once:true});
  }else{
    updateInstallButtons();
    startVersionUpdateChecks();
    registerServiceWorker();
  }
})();
</script>

(function(){
  'use strict';
  const APP_ROUTES = new Set([
    'dashboard','history','tracking','profile','flight-history','shipment-history','license-history',
    'create','create-shipment','create-flight','create-license','create-id-card','create-document','create-receipt','license-output','edit','flight','admin'
  ]);
  const routeName = () => (location.hash.replace(/^#/,'').split('/').filter(Boolean)[0] || '');
  const isAppScreen = () => typeof currentUser !== 'undefined' && !!currentUser && APP_ROUTES.has(routeName());
  const isReadOnlyTracking = () => {
    const parts = location.hash.replace(/^#/,'').split('/').filter(Boolean);
    return parts[0] === 'track' && !!parts[1];
  };
  const activeTab = () => {
    const route = routeName();
    if(['history','flight-history','shipment-history','license-history'].includes(route)) return 'history';
    if(['create','create-shipment','create-flight','create-license','create-id-card','create-document','create-receipt','license-output'].includes(route)) return 'create';
    if(route === 'tracking' || route === 'flight') return 'tracking';
    if(route === 'profile') return 'profile';
    return 'home';
  };
  function tabsMarkup(){
    const active = activeTab();
    return `<nav class="tp-bottom-tabs" aria-label="TrackPort app navigation">
      <a class="tp-bottom-tab ${active==='home'?'active':''}" href="#/dashboard" ${active==='home'?'aria-current="page"':''}>${icon('home')}<span>Home</span></a>
      <a class="tp-bottom-tab ${active==='history'?'active':''}" href="#/history" ${active==='history'?'aria-current="page"':''}>${icon('clock')}<span>History</span></a>
      <a class="tp-bottom-tab tp-bottom-create ${active==='create'?'active':''}" href="#/create" ${active==='create'?'aria-current="page"':''} aria-label="Create"><span class="tp-create-icon">${icon('plus')}</span><span>Create</span></a>
      <a class="tp-bottom-tab ${active==='tracking'?'active':''}" href="#/tracking" ${active==='tracking'?'aria-current="page"':''}>${icon('search')}<span>Tracking</span></a>
      <a class="tp-bottom-tab ${active==='profile'?'active':''}" href="#/profile" ${active==='profile'?'aria-current="page"':''}>${icon('user')}<span>Profile</span></a>
    </nav>`;
  }
  function sync(){
    const enabled = isAppScreen();
    document.body.classList.toggle('tp-dashboard-mode', enabled);
    document.body.classList.toggle('tp-readonly-mode', isReadOnlyTracking());
    const existing = document.querySelector('.tp-bottom-tabs');
    if(enabled && !existing){
      document.body.insertAdjacentHTML('beforeend', tabsMarkup());
      if(typeof renderIcons === 'function') renderIcons(document.querySelector('.tp-bottom-tabs'));
    }else if(enabled && existing){
      const current = existing.querySelector('.active');
      const desired = activeTab();
      const currentKey = current?.getAttribute('href') || '';
       if((desired==='history' && !currentKey.includes('/history')) ||
          (desired==='create' && !currentKey.includes('/create')) ||
          (desired==='tracking' && !currentKey.includes('/tracking')) ||
          (desired==='profile' && !currentKey.includes('/profile')) ||
         (desired==='home' && !currentKey.includes('dashboard'))){
        existing.outerHTML = tabsMarkup();
         if(typeof renderIcons === 'function') renderIcons(document.querySelector('.tp-bottom-tabs'));
      }
    }else if(!enabled && existing){
      existing.remove();
    }
  }
  let queued = false;
  const schedule = () => {
    if(queued) return;
    queued = true;
    requestAnimationFrame(() => { queued=false; sync(); });
  };
  window.addEventListener('hashchange', schedule, {passive:true});
  document.addEventListener('DOMContentLoaded', () => {
    schedule();
    const app = document.getElementById('app');
    if(app) new MutationObserver(schedule).observe(app, {childList:true, subtree:true});
    // The main app loads persisted user data asynchronously before routing.
    // These small follow-up checks ensure the shell appears after that render.
    setTimeout(schedule, 250);
    setTimeout(schedule, 1000);
  }, {once:true});
  if(document.body) schedule();
})();
</script>

<script id="trackport-universal-carrier-tracking">
(() => {
  'use strict';

  const WATCHLIST_KEY = 'trackport:universal-carrier-watchlist';
  const BRIDGE_KEY = 'trackport:universal-carrier-bridge';
  const REFRESH_MS = 5 * 60 * 1000;

  const CARRIERS = [
    {id:'auto', name:'Auto-detect carrier', mark:'AUTO'},
    {id:'fedex', name:'FedEx', mark:'FX', pattern:/^\d{12,15}$/i, url:n=>`https://www.fedex.com/fedextrack/?trknbr=${encodeURIComponent(n)}`},
    {id:'ups', name:'UPS', mark:'UPS', pattern:/^1Z[0-9A-Z]{16}$/i, url:n=>`https://www.ups.com/track?loc=en_US&tracknum=${encodeURIComponent(n)}`},
    {id:'usps', name:'USPS', mark:'US', pattern:/^(?:94|93|92|94|70|14)\d{18,22}$/i, url:n=>`https://tools.usps.com/go/TrackConfirmAction?tRef=fullpage&tLc=2&tLabels=${encodeURIComponent(n)}`},
    {id:'dhl', name:'DHL', mark:'DHL', pattern:/^(?:\d{10}|JJD[A-Z0-9]{10,})$/i, url:n=>`https://www.dhl.com/global-en/home/tracking.html?tracking-id=${encodeURIComponent(n)}`},
    {id:'royal-mail', name:'Royal Mail', mark:'RM', pattern:/^[A-Z]{2}\d{9}GB$/i, url:n=>`https://www.royalmail.com/track-your-item#/tracking-results/${encodeURIComponent(n)}`},
    {id:'canada-post', name:'Canada Post', mark:'CA', pattern:/^(?:\d{16}|[A-Z]{2}\d{9}CA)$/i, url:n=>`https://www.canadapost-postescanada.ca/track-reperage/en#/details/${encodeURIComponent(n)}`},
    {id:'australia-post', name:'Australia Post', mark:'AU', pattern:/^(?:\d{13}|[A-Z]{2}\d{9}AU)$/i, url:n=>`https://auspost.com.au/mypost/track/#/search/${encodeURIComponent(n)}`},
    {id:'aramex', name:'Aramex', mark:'AR', pattern:/^\d{9,12}$/i, url:n=>`https://www.aramex.com/track/results?ShipmentNumber=${encodeURIComponent(n)}`},
    {id:'gls', name:'GLS', mark:'GLS', pattern:/^\d{8,14}$/i, url:n=>`https://gls-group.com/GROUP/en/parcel-tracking?match=${encodeURIComponent(n)}`},
    {id:'evri', name:'Evri', mark:'EV', pattern:/^\d{16}$/i, url:n=>`https://www.evri.com/track-a-parcel?parcel=${encodeURIComponent(n)}`},
    {id:'ontrac', name:'OnTrac', mark:'OT', pattern:/^\d{10,14}$/i, url:n=>`https://www.ontrac.com/tracking/?number=${encodeURIComponent(n)}`},
    {id:'delhivery', name:'Delhivery', mark:'DL', pattern:/^[A-Z0-9]{10,20}$/i, url:n=>`https://www.delhivery.com/track/package/${encodeURIComponent(n)}`},
    {id:'blue-dart', name:'Blue Dart', mark:'BD', pattern:/^\d{8,12}$/i, url:n=>`https://www.bluedart.com/tracking?trackFor=0&trackNo=${encodeURIComponent(n)}`},
    {id:'cainiao', name:'Cainiao', mark:'CN', pattern:/^[A-Z0-9]{10,25}$/i, url:n=>`https://global.cainiao.com/detail.htm?mailNoList=${encodeURIComponent(n)}`},
    {id:'sf-express', name:'SF Express', mark:'SF', pattern:/^\d{10,15}$/i, url:n=>`https://www.sf-express.com/chn/en/dynamic_functions/waybill/#search/bill-number/${encodeURIComponent(n)}`},
    {id:'other', name:'Other / universal lookup', mark:'?', url:n=>`https://www.17track.net/en?nums=${encodeURIComponent(n)}`}
  ];

  const escText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const normalizeNumber = value => String(value || '').trim().replace(/\s+/g,'').toUpperCase();
  const carrierById = id => CARRIERS.find(carrier => carrier.id === id) || CARRIERS[CARRIERS.length - 1];
  const carrierOptions = () => CARRIERS.map(carrier => `<option value="${carrier.id}">${escText(carrier.name)}</option>`).join('');

  function readStorage(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(_error){ return fallback; }
  }
  function writeStorage(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(_error){}
  }
  function getWatchlist(){
    const value = readStorage(WATCHLIST_KEY, []);
    return Array.isArray(value) ? value.filter(item => item && item.number) : [];
  }
  function getBridge(){
    try{ return localStorage.getItem(BRIDGE_KEY) || String(window.TRACKPORT_LIVE_TRACKING_ENDPOINT || '').trim(); }
    catch(_error){ return String(window.TRACKPORT_LIVE_TRACKING_ENDPOINT || '').trim(); }
  }
  function detectCarrier(number, selectedId){
    if(selectedId && selectedId !== 'auto') return carrierById(selectedId);
    const match = CARRIERS.find(carrier => carrier.pattern && carrier.pattern.test(number));
    return match || carrierById('other');
  }
  function displayDate(value){
    if(!value) return 'Not provided';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString([], {dateStyle:'medium', timeStyle:'short'});
  }
  function rootFor(element){
    return element?.closest?.('[data-uct-root]') ||
      Array.from(document.querySelectorAll('[data-uct-root]')).find(root => root.offsetParent !== null) ||
      document.querySelector('[data-uct-root]');
  }
  function ensureRoot(form){
    const existing = rootFor(form);
    if(existing) return existing;
    const wrapper = document.createElement('div');
    wrapper.innerHTML = window.universalCarrierTrackerMarkup();
    const root = wrapper.firstElementChild;
    form.insertAdjacentElement('afterend', root);
    return root;
  }

  function universalCarrierTrackerMarkup(){
    return `<section class="uct-card" data-uct-root>
      <span class="uct-kicker">Carrier network</span>
      <h3>Track from any shipping company</h3>
      <p>Use the carrier that shipped your product, or let TrackPort identify it from the tracking number. Official carrier tracking opens in a new tab; optional API bridging can show live status here.</p>
      <form class="uct-form" data-uct-form>
        <div class="field">
          <label for="uct-carrier">Carrier</label>
          <select id="uct-carrier" data-uct-carrier>${carrierOptions()}</select>
        </div>
        <div class="field">
          <label for="uct-number">Tracking number</label>
          <input id="uct-number" data-uct-number class="mono" autocomplete="off" placeholder="1Z999AA10123456784 or 9400111899223856928491" required>
        </div>
        <button class="btn btn-accent" type="submit">Track shipment</button>
      </form>
      <div class="uct-meta"><span>Supported shortcuts include FedEx, UPS, USPS, DHL, Royal Mail, Canada Post, Australia Post, Aramex, GLS, Evri, OnTrac, Delhivery and more.</span><span data-uct-bridge-state></span></div>
      <details class="uct-details">
        <summary>Enable live in-app status refresh</summary>
        <div class="uct-bridge-row">
          <div><label for="uct-endpoint">Carrier API bridge URL</label><input id="uct-endpoint" data-uct-endpoint placeholder="https://your-domain.example/track?tracking_number={trackingNumber}&amp;carrier={carrier}"></div>
          <button type="button" class="btn btn-ghost" data-uct-action="save-endpoint">Save bridge</button>
        </div>
        <small>Your bridge should accept <code>tracking_number</code> and <code>carrier</code>, return JSON, and allow browser requests. Placeholders <code>{trackingNumber}</code> and <code>{carrier}</code> are replaced automatically. Do not paste API keys into this HTML file.</small>
      </details>
      <div class="uct-result" data-uct-result hidden></div>
      <div class="uct-watchlist" data-uct-watchlist></div>
    </section>`;
  }
  window.universalCarrierTrackerMarkup = universalCarrierTrackerMarkup;

  function entryFor(number, selectedId){
    const carrier = detectCarrier(number, selectedId);
    return {
      number,
      carrierId: carrier.id,
      carrierName: carrier.name,
      mark: carrier.mark,
      officialUrl: carrier.url(number),
      addedAt: new Date().toISOString(),
      checkedAt: null,
      liveStatus: '',
      location: '',
      eta: '',
      lastError: '',
      events: []
    };
  }
  function saveEntry(entry){
    const list = getWatchlist().filter(item => item.number !== entry.number);
    list.unshift(entry);
    writeStorage(WATCHLIST_KEY, list.slice(0, 12));
  }
  function updateEntry(entry){
    const list = getWatchlist().map(item => item.number === entry.number ? {...item, ...entry} : item);
    writeStorage(WATCHLIST_KEY, list);
  }
  function resultClass(entry){
    if(entry.lastError) return 'uct-status error';
    if(entry.liveStatus && entry.liveStatus !== 'Open carrier tracking') return 'uct-status live';
    return 'uct-status';
  }
  function resultMarkup(entry){
    const status = entry.lastError ? 'Live refresh unavailable' : (entry.liveStatus || 'Open carrier tracking');
    const note = entry.lastError
      ? `${entry.lastError} The official carrier link is still available below.`
      : (entry.liveStatus ? 'Status received from the configured live API bridge.' : 'This standalone HTML cannot read carrier systems directly without an authorized bridge. Use the official link below for the current carrier status.');
    const eventRows = (entry.events || []).slice(0,4).map(event => `<div><strong>${escText(event.status || event.description || 'Update')}</strong><span>${escText(event.location || 'Carrier update')} · ${escText(displayDate(event.timestamp || event.time))}</span></div>`).join('');
    return `<div class="uct-result-head">
      <div class="uct-result-title"><span class="uct-carrier-mark">${escText(entry.mark)}</span><div><h4>${escText(entry.carrierName)}</h4><div class="uct-number">${escText(entry.number)}</div></div></div>
      <span class="${resultClass(entry)}">${escText(status)}</span>
    </div>
    <div class="uct-result-grid">
      <div><span>Last checked</span><strong>${escText(entry.checkedAt ? displayDate(entry.checkedAt) : 'Not checked')}</strong></div>
      <div><span>Current location</span><strong>${escText(entry.location || 'Not provided')}</strong></div>
      <div><span>Estimated delivery</span><strong>${escText(entry.eta ? displayDate(entry.eta) : 'Not provided')}</strong></div>
    </div>
    <p class="uct-result-note">${escText(note)}</p>
    ${eventRows ? `<div class="uct-watchlist" style="margin-top:12px;">${eventRows}</div>` : ''}
    <div class="uct-actions">
      <button type="button" class="btn btn-accent" data-uct-action="open" data-uct-number="${escText(entry.number)}">Open official tracking</button>
      <button type="button" class="btn btn-ghost" data-uct-action="refresh" data-uct-number="${escText(entry.number)}">Refresh status</button>
      <button type="button" class="btn btn-ghost" data-uct-action="copy" data-uct-number="${escText(entry.number)}">Copy number</button>
    </div>`;
  }
  function renderBridgeState(root){
    const bridge = getBridge();
    const label = root.querySelector('[data-uct-bridge-state]');
    const input = root.querySelector('[data-uct-endpoint]');
    if(input && input.value !== bridge) input.value = bridge;
    if(label) label.textContent = bridge ? 'Live bridge configured' : 'Official links ready';
  }
  function renderWatchlist(root){
    const target = root.querySelector('[data-uct-watchlist]');
    if(!target) return;
    const list = getWatchlist();
    if(!list.length){ target.innerHTML = ''; return; }
    target.innerHTML = `<div class="uct-watchlist-title"><span>Saved tracking numbers</span><span>${list.length}/12</span></div>` +
      list.map(item => `<div class="uct-watch-row">
        <div><strong>${escText(item.number)}</strong><span>${escText(item.carrierName)} · ${escText(item.liveStatus || 'Official tracking available')}</span></div>
        <div class="uct-watch-actions">
          <button type="button" data-uct-action="load" data-uct-number="${escText(item.number)}">View</button>
          <button type="button" data-uct-action="remove" data-uct-number="${escText(item.number)}">Remove</button>
        </div>
      </div>`).join('');
  }
  function renderEntry(root, entry){
    const target = root.querySelector('[data-uct-result]');
    if(target){ target.hidden = false; target.innerHTML = resultMarkup(entry); }
    renderBridgeState(root);
    renderWatchlist(root);
  }
  function buildBridgeUrl(template, entry){
    let url = String(template || '').trim()
      .replace(/\{trackingNumber\}/g, encodeURIComponent(entry.number))
      .replace(/\{carrier\}/g, encodeURIComponent(entry.carrierId));
    if(!/[?&](?:tracking_number|trackingNumber|tracking|number)=/i.test(url)){
      url += `${url.includes('?') ? '&' : '?'}tracking_number=${encodeURIComponent(entry.number)}&carrier=${encodeURIComponent(entry.carrierId)}`;
    }
    return url;
  }
  function pickValue(object, keys){
    for(const key of keys){
      const value = object?.[key];
      if(value !== undefined && value !== null && String(value).trim() !== '') return value;
    }
    return '';
  }
  function normalizeLivePayload(raw){
    const data = raw?.data || raw?.tracking || raw?.result || raw || {};
    const rawEvents = data.events || data.checkpoints || data.history || [];
    const events = Array.isArray(rawEvents) ? rawEvents.map(event => ({
      status: pickValue(event, ['status','tag','description','message']),
      location: typeof event.location === 'object' ? pickValue(event.location, ['city','name','country']) : pickValue(event, ['location','city']),
      timestamp: pickValue(event, ['timestamp','time','datetime','created_at'])
    })).filter(event => event.status || event.location) : [];
    return {
      liveStatus: String(pickValue(data, ['status','current_status','status_description','tracking_status','state']) || '').trim(),
      location: typeof data.location === 'object' ? pickValue(data.location, ['city','name','country']) : String(pickValue(data, ['location','current_location','last_location']) || '').trim(),
      eta: pickValue(data, ['eta','estimated_delivery','estimatedDelivery','delivery_date']),
      events
    };
  }
  async function fetchLive(entry){
    const bridge = getBridge();
    entry.checkedAt = new Date().toISOString();
    entry.lastError = '';
    if(!bridge){
      entry.liveStatus = '';
      entry.events = [];
      return entry;
    }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    try{
      const response = await fetch(buildBridgeUrl(bridge, entry), {method:'GET', headers:{Accept:'application/json'}, signal:controller.signal, cache:'no-store'});
      if(!response.ok) throw new Error(`Bridge returned HTTP ${response.status}`);
      const payload = normalizeLivePayload(await response.json());
      if(!payload.liveStatus && !payload.location && !payload.eta && !payload.events.length) throw new Error('Bridge returned no tracking fields');
      Object.assign(entry, payload);
    }catch(error){
      entry.liveStatus = '';
      entry.events = [];
      entry.lastError = error?.name === 'AbortError' ? 'The live status request timed out.' : (error?.message || 'The live status request failed.');
    }finally{
      clearTimeout(timer);
    }
    return entry;
  }
  async function track(number, selectedId, root){
    const normalized = normalizeNumber(number);
    if(!normalized) return;
    const entry = entryFor(normalized, selectedId || 'auto');
    saveEntry(entry);
    renderEntry(root, entry);
    const button = root.querySelector('[data-uct-form] button[type="submit"]');
    if(button){ button.disabled = true; button.textContent = 'Checking…'; }
    await fetchLive(entry);
    updateEntry(entry);
    renderEntry(root, entry);
    if(button){ button.disabled = false; button.textContent = 'Track shipment'; }
  }
  function findEntry(number){
    return getWatchlist().find(item => item.number === normalizeNumber(number));
  }
  async function loadEntry(number, root){
    const entry = findEntry(number);
    if(!entry) return;
    const carrier = root.querySelector('[data-uct-carrier]');
    const input = root.querySelector('[data-uct-number]');
    if(carrier) carrier.value = entry.carrierId;
    if(input) input.value = entry.number;
    renderEntry(root, entry);
  }
  async function refresh(number, root){
    const entry = findEntry(number);
    if(!entry) return;
    renderEntry(root, entry);
    await fetchLive(entry);
    updateEntry(entry);
    renderEntry(root, entry);
  }
  function openOfficial(number){
    const entry = findEntry(number);
    if(entry?.officialUrl) window.open(entry.officialUrl, '_blank', 'noopener,noreferrer');
  }
  async function copyNumber(number){
    try{
      await navigator.clipboard.writeText(number);
      if(typeof window.showToast === 'function') window.showToast('Tracking number copied');
    }catch(_error){
      window.prompt('Copy tracking number', number);
    }
  }
  function initRoot(root){
    if(!root || root.dataset.uctReady) return;
    root.dataset.uctReady = '1';
    renderBridgeState(root);
    renderWatchlist(root);
  }

  document.addEventListener('submit', event => {
    const form = event.target;
    if(form.matches?.('[data-uct-form]')){
      event.preventDefault();
      event.stopImmediatePropagation();
      const root = rootFor(form);
      track(root.querySelector('[data-uct-number]')?.value, root.querySelector('[data-uct-carrier]')?.value, root);
      return;
    }
    if(!form.matches?.('#search-track-form, #standalone-track-form')) return;
    const input = form.querySelector('input');
    const value = input?.value?.trim();
    if(!value || (typeof window.trackingRouteFor === 'function' && window.trackingRouteFor(value))) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const root = ensureRoot(form);
    const numberInput = root.querySelector('[data-uct-number]');
    if(numberInput) numberInput.value = value;
    track(value, 'auto', root);
  }, true);

  document.addEventListener('click', event => {
    const button = event.target.closest?.('[data-uct-action]');
    if(!button) return;
    const action = button.dataset.uctAction;
    const root = rootFor(button);
    const number = normalizeNumber(button.dataset.uctNumber || root?.querySelector('[data-uct-number]')?.value);
    if(action === 'save-endpoint'){
      const value = root?.querySelector('[data-uct-endpoint]')?.value.trim() || '';
      if(value && !/^https?:\/\//i.test(value)){ if(typeof window.showToast === 'function') window.showToast('Use an http or https bridge URL', true); return; }
      try{ if(value) localStorage.setItem(BRIDGE_KEY, value); else localStorage.removeItem(BRIDGE_KEY); }catch(_error){}
      renderBridgeState(root);
      if(typeof window.showToast === 'function') window.showToast(value ? 'Live carrier bridge saved' : 'Live carrier bridge cleared');
      return;
    }
    if(action === 'open'){ openOfficial(number); return; }
    if(action === 'copy'){ copyNumber(number); return; }
    if(action === 'remove'){
      writeStorage(WATCHLIST_KEY, getWatchlist().filter(item => item.number !== number));
      renderWatchlist(root);
      return;
    }
    if(action === 'load'){ loadEntry(number, root); return; }
    if(action === 'refresh'){ refresh(number, root); return; }
  });

  const observer = new MutationObserver(() => document.querySelectorAll('[data-uct-root]').forEach(initRoot));
  observer.observe(document.body, {childList:true, subtree:true});
  document.querySelectorAll('[data-uct-root]').forEach(initRoot);

  window.setInterval(() => {
    if(document.hidden || !getBridge()) return;
    const root = Array.from(document.querySelectorAll('[data-uct-root]')).find(item => item.offsetParent !== null);
    const current = root?.querySelector('[data-uct-result] .uct-number')?.textContent;
    if(root && current) refresh(current, root);
  }, REFRESH_MS);
})();
</script>
