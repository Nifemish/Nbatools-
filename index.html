async function ensureDBReady(){
  if(dbReady) return;
  if(!dbLoadPromise){
    dbLoadPromise = loadDB().finally(()=>{ dbLoadPromise = null; });
  }
  await dbLoadPromise;
}
function persistAuthSession(user){
  if(!user || !user.email) return;
  try{
    localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({ email:user.email, savedAt:new Date().toISOString() }));
  }catch(error){
    console.warn('Login session could not be saved.', error);
  }
}
function restoreAuthSession(){
  try{
    const saved = JSON.parse(localStorage.getItem(AUTH_SESSION_KEY) || 'null');
    const email = typeof saved?.email==='string' ? saved.email.trim().toLowerCase() : '';
    const user = email ? usersDB[email] : null;
    if(!user){
      localStorage.removeItem(AUTH_SESSION_KEY);
      currentUser = null;
      return;
    }
    currentUser = { email:user.email, fullName:user.fullName, phone:user.phone, isAdmin:!!user.isAdmin };
  }catch(error){
    localStorage.removeItem(AUTH_SESSION_KEY);
    currentUser = null;
    console.warn('Saved login session was invalid and has been cleared.', error);
  }
}
async function completeSocialLogin(googleUser){
  const email = googleUser.email;
  let user = usersDB[email];
  if(!user){
    user = {
      fullName: googleUser.fullName,
      email,
      phone: '',
      password: null,
      authProvider: 'google',
      photoURL: googleUser.photoURL || '',
      isAdmin: false,
      createdAt: new Date().toISOString()
    };
    usersDB[email] = user;
  }else{
    user.authProvider = 'google';
    if(googleUser.photoURL) user.photoURL = googleUser.photoURL;
  }
  await saveUsers();
  currentUser = { email: user.email, fullName: user.fullName, phone: user.phone, isAdmin: !!user.isAdmin };
  persistAuthSession(currentUser);
  showToast(`Welcome, ${user.fullName.split(' ')[0]}`);
  navigate(user.isAdmin ? '#/admin' : '#/dashboard');
}
function clearAuthSession(){
  currentUser = null;
  try{
    localStorage.removeItem(AUTH_SESSION_KEY);
    localStorage.removeItem(LAST_ROUTE_KEY);
  }catch(error){
    console.warn('Login session could not be cleared.', error);
  }
}
function isRestorableRoute(route){
  return /^#\/(dashboard|history|tracking|profile|flight-history|shipment-history|license-history|admin)\/?$/.test(String(route||''));
}
function isProtectedRoute(route){
  return /^#\/(dashboard|history|tracking|profile|create-flight|create-shipment|create|create-license|create-id-card|create-document|create-receipt|flight-history|shipment-history|license-history|license-output|confirmation|edit|admin)(?:\/|$)/.test(String(route||''));
}
function rememberCurrentRoute(){
  const route = location.hash || '#/';
  // Only remember stable destinations. Forms, editors, confirmations, and
  // detail pages should not trap a returning user on stale or half-complete UI.
  if(!currentUser || !isRestorableRoute(route)) return;
  try{ localStorage.setItem(LAST_ROUTE_KEY, route); }
  catch(error){ console.warn('Current page could not be remembered.', error); }
}
function restoredRoute(){
  try{
    const route = localStorage.getItem(LAST_ROUTE_KEY);
    return isRestorableRoute(route) ? route : DEFAULT_AUTH_ROUTE;
  }catch(error){
    console.warn('Previous page could not be restored.', error);
    return DEFAULT_AUTH_ROUTE;
  }
}
function seedInitialRouteHistory(){
  if(initialRouteHistorySeeded) return;
  const requestedRoute = location.hash || '';
  let route = requestedRoute || (currentUser ? restoredRoute() : '#/');
  if(!currentUser && isProtectedRoute(route)) route = '#/login';
  if(currentUser && /^#\/(login|register)\/?$/.test(route)) route = DEFAULT_AUTH_ROUTE;
  // Give every authenticated deep link an in-app page behind it. This makes
  // the first Back press return to the dashboard instead of closing the PWA.
  const baseRoute = currentUser ? DEFAULT_AUTH_ROUTE : '#/';
  try{
    history.replaceState({ trackportRoot:true }, '', baseRoute);
    if(route !== baseRoute){
      history.pushState({ trackportRoute:true }, '', route);
    }
  }catch(error){
    console.warn('App navigation history could not be initialized.', error);
  }
  initialRouteHistorySeeded = true;
}
async function saveUsers(){
  try{ await storageAPI.set('nbatools-users', JSON.stringify(usersDB), true); }
  catch(e){ showToast('Could not save — try again', true); }
}
async function saveShipments(){
  try{
    if(window.firebaseCloud && window.firebaseCloud.isReady){
      for(const [trackingNumber, shipment] of Object.entries(shipmentsDB)){
        if(typeof shipment.imageUrl==='string' && shipment.imageUrl.startsWith('data:image/')){
          try{
            const upload = window.firebaseCloud.uploadDataUrl(
              `shipments/${encodeURIComponent(trackingNumber)}/product.jpg`,
              shipment.imageUrl
            );
            const timeout = new Promise((_, reject)=>setTimeout(()=>reject(new Error('image upload timed out')), 8000));
            shipment.imageUrl = await Promise.race([upload, timeout]);
          }catch(error){
            console.warn('Shipment image upload failed or timed out; keeping local image data.', error);
          }
        }
      }
    }
    await storageAPI.set('nbatools-shipments', JSON.stringify(shipmentsDB), true);
    return true;
  }
  catch(e){ showToast('Could not save — try again', true); return false; }
}

/* ---------- image upload ---------- */
function wireImageUpload(inputId, zoneId, previewId, onDataUrl){
  const input = $('#'+inputId);
  if(!input) return;
  input.addEventListener('change', ()=>{
    const file = input.files[0];
    if(!file) return;
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){
      showToast('Please upload a JPG, PNG or WEBP image', true); input.value=''; return;
    }
    if(file.size > 10*1024*1024){ showToast('Image is too large (max 10MB)', true); input.value=''; return; }
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg',0.75);
        onDataUrl(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function goToAbout(event){
  event.preventDefault();
  closeMobileNav();
  const scrollToAbout = () => document.getElementById('about')?.scrollIntoView({behavior:'smooth', block:'start'});
  const hash = location.hash.replace(/^#/,'');
  if(hash && hash !== '/' ){
    location.hash = '/';
    setTimeout(scrollToAbout, 150);
  } else {
    scrollToAbout();
  }
}

function thumb(imageUrl, size){
  size = size||42;
  if(imageUrl) return `<img src="${imageUrl}" class="prod-thumb" style="width:${size}px;height:${size}px;" alt="">`;
  return `<div class="prod-thumb-fallback" style="width:${size}px;height:${size}px;">${icon('image')}</div>`;
}
function badge(status){
  const c = statusColor(status);
  return `<span class="badge" style="background:${c.bg};color:${c.fg};">${icon(statusIcon(status))}${esc(status)}</span>`;
}

function computeStats(shipments){
  const s = { total:shipments.length, pending:0, transit:0, delivered:0 };
  shipments.forEach(sh=>{
    if(sh.status==='Delivered') s.delivered++;
    else if(['In Transit','Out for Delivery','Arrived at Facility'].includes(sh.status)) s.transit++;
    else s.pending++;
  });
  return s;
}

function licenseHistoryMarkup(items){
  if(!items.length) return `<div class="license-history-empty">No driver's licenses have been generated yet. Your saved cards will appear here.</div>`;
  return `<div class="license-history-list">${items.map(documentRecord=>{
    const payload = documentRecord.payload || documentRecord.data || {};
    const type = licenseTypeKey(documentRecord.licenseType || payload.licenseType);
    const label = documentRecord.licenseName || payload.licenseName || licensePreset(type).label;
    const holder = [payload.fname,payload.lname].filter(Boolean).join(' ') || 'Unnamed card';
    return `<a class="license-history-item" href="#/license-output/${type}/${encodeURIComponent(documentRecord.id)}">
      <span class="license-history-item-icon">${icon('credit-card')}</span>
      <span class="license-history-item-copy">
        <span class="license-history-item-title">${esc(label)} Driver's License — ${esc(holder)}</span>

      </span>

  }).join('')}</div>`;
}

function historySummaryCta({href, iconName, kicker, title, count, singular, plural, latestAt, className}){
  const savedText = count === 1 ? `1 ${singular}` : `${count} ${plural}`;
  const detail = count
    ? `${savedText} · Last saved ${fmtDate(latestAt)}`
    : `No ${plural} yet · Open to get started`;
  return `<a href="${href}" class="creation-cta history-cta ${className||''}">
    <span class="cta-icon">${icon(iconName)}</span>
    <span class="cta-copy">
      <span class="cta-kicker">${kicker}</span>
      <span class="cta-title">${title}</span>
      <span class="cta-count">${detail}</span>
    </span>
    <span class="cta-arrow">${icon('arrow')}</span>
  </a>`;
}

/* Draws each license card straight onto a <canvas> using the same offline
   download path as the Hawaii card. The canvas renderers mirror the state
   layouts used in the live preview, so the downloaded image does not depend
   on html2canvas reproducing CSS gradients, filters, or SVG layers. */
async function downloadLicenseImage(){
  const button = $('#license-download-image');
  const originalLabel = button ? button.innerHTML : '';
  if(button){
    button.disabled = true;
    button.textContent = 'Preparing image…';
  }
  try{
    const text = id=>{ const el = $('#'+id); return el ? el.textContent.trim() : ''; };
    const data = {
      state: text('output-state'),
      dln: text('output-dln'),
      dob: text('output-dob'),
      iss: text('output-iss'),
      exp: text('output-exp'),
      fname: text('output-fname'),
      lname: text('output-lname'),
      address: text('output-address'),
      signature: text('output-signature'),
      gender: text('output-gender'),
      hgt: text('output-hgt'),
      eyes: text('output-eyes'),
      wgt: text('output-wgt'),
      cls: text('output-class'),
      endorse: text('output-endorse'),
      rest: text('output-rest'),
      serial: text('output-serial')
    };
    const photoEl = $('#output-photo');
    const photoSrc = photoEl ? photoEl.src : '';

    if(document.fonts){
      await Promise.all([
        document.fonts.load('700 42px Caveat'),
        document.fonts.load('700 34px Caveat'),
        document.fonts.load('800 20px Inter'),
        document.fonts.load('800 18px Inter'),
        document.fonts.load('700 12px "Space Mono"')
      ]);
      await document.fonts.ready;
    }

    const licenseType = licenseTypeKey(location.hash.split('/')[2]);
    if(document.fonts){
      await Promise.all([
        document.fonts.load('400 44px Graduate'),
        document.fonts.load('700 26px Caveat'),
        document.fonts.load('700 11px "Space Mono"')
      ]);
      await document.fonts.ready;
    }

    const photoImg = await loadImageEl(photoSrc);
    const canvas = licenseType === 'texas'
      ? drawTexasLicenseCardCanvas(data, photoImg)
      : drawLicenseCardCanvas(data, photoImg);
    exportCanvas(canvas, `${licenseType}-driver-license.png`, 'License image downloaded');
  }catch(err){
    showToast('Could not download the license image — please try again', true);
  }finally{
    if(button){
      button.disabled = false;
      button.innerHTML = originalLabel;
    }
  }
}

function loadImageEl(src){
  return new Promise(resolve=>{
    if(!src){ resolve(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = src;
    if(img.complete && img.naturalWidth) resolve(img);
  });
}

function coverSourceRect(img, boxW, boxH){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const boxRatio = boxW/boxH, imgRatio = iw/ih;
  let sx,sy,sw,sh;
  if(imgRatio > boxRatio){ sh = ih; sw = ih*boxRatio; sy = 0; sx = (iw-sw)/2; }
  else { sw = iw; sh = iw/boxRatio; sx = 0; sy = (ih-sh)/2; }
  return {sx,sy,sw,sh};
}

/* Crops `img` to fill boxW x boxH (like CSS object-fit:cover) onto an
   offscreen canvas, replicating grayscale(1) contrast(1.1) brightness(1.05)
   via manual pixel math rather than ctx.filter, so it renders identically
   regardless of the browser/webview's canvas-filter support. */
function makeGrayscaleCanvas(img, boxW, boxH, options){
  const opts = Object.assign({contrast:1.1, brightness:1.05, objectPositionY:.5}, options||{});
  const off = document.createElement('canvas');
  off.width = Math.max(1, Math.round(boxW));
  off.height = Math.max(1, Math.round(boxH));
  const octx = off.getContext('2d');
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const boxRatio = boxW/boxH, imgRatio = iw/ih;
  let sx,sy,sw,sh;
  if(imgRatio > boxRatio){
    sh = ih; sw = ih*boxRatio; sy = 0; sx = (iw-sw)/2;
  }else{
    sw = iw; sh = iw/boxRatio; sx = 0;
    sy = Math.max(0, Math.min(1, opts.objectPositionY)) * (ih-sh);
  }
  octx.drawImage(img, sx, sy, sw, sh, 0, 0, off.width, off.height);
  try{
    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const px = imgData.data;
    for(let i=0;i<px.length;i+=4){
      let lum = 0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2];
      lum = (lum-128)*opts.contrast + 128;
      lum = lum*opts.brightness;
      lum = Math.max(0, Math.min(255, lum));
      px[i] = px[i+1] = px[i+2] = lum;
    }
    octx.putImageData(imgData, 0, 0);
  }catch(e){
    // Cross-origin image without CORS headers taints the canvas so pixels
    // can't be read back — fall back to the uncorrected color crop rather
    // than failing the whole download.
  }
  return off;
}

function drawRadialBlob(ctx, cxPct, cyPct, rgb, stopPct, boxW, boxH){
  const cx = boxW*cxPct, cy = boxH*cyPct;
  const corners = [[0,0],[boxW,0],[0,boxH],[boxW,boxH]];
  let maxDist = 0;
  corners.forEach(([x,y])=>{ const d = Math.hypot(x-cx, y-cy); if(d>maxDist) maxDist = d; });
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,maxDist);
  grad.addColorStop(0, `rgba(${rgb},0.6)`);
  grad.addColorStop(Math.min(stopPct,0.999), `rgba(${rgb},0)`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,boxW,boxH);
}

function drawLicenseWave(ctx, cardW, baseY, color, width){
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  const step = cardW/4;
  ctx.beginPath();
  ctx.moveTo(0, baseY+30);
  ctx.quadraticCurveTo(step*0.5, baseY-40, step, baseY+30);
  ctx.quadraticCurveTo(step*1.5, baseY+100, step*2, baseY+30);
  ctx.quadraticCurveTo(step*2.5, baseY-40, step*3, baseY+30);
  ctx.quadraticCurveTo(step*3.5, baseY+100, step*4, baseY+30);
  ctx.stroke();
}

function drawFieldLV(ctx, label, value, x, y, opts){
  const o = Object.assign({labelSize:16, valueSize:23, labelColor:'#334155', valueColor:'#0b1220', gap:66, valueFont:'900'}, opts||{});
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = o.labelColor;
  ctx.font = `900 ${o.labelSize}px Inter, sans-serif`;
  ctx.fillText(label, x, y+o.labelSize);
  ctx.fillStyle = o.valueColor;
  ctx.font = `${o.valueFont} ${o.valueSize}px Inter, sans-serif`;
  ctx.fillText(value, x+o.gap, y+o.labelSize);
}

function drawCanvasRadialEllipse(ctx, cx, cy, rx, ry, color, alpha){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(rx, ry);
  const grad = ctx.createRadialGradient(0,0,0,0,0,1);
  grad.addColorStop(0, `rgba(${color},${alpha})`);
  grad.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(-1,-1,2,2);
  ctx.restore();
}

function drawCanvasSpacedText(ctx, text, x, y, spacing){
  let cursor = x;
  String(text).split('').forEach(char=>{
    ctx.fillText(char, cursor, y);
    cursor += ctx.measureText(char).width + spacing;
  });
}

function drawTexasSealCanvas(ctx, x, y, size){
  const scale = size/300;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.globalAlpha = .25;
  ctx.strokeStyle = '#92400e';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(150,150,142,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth = 2; ctx.setLineDash([5,3]);
  ctx.beginPath(); ctx.arc(150,150,128,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#92400e';
  ctx.font = '900 13px Graduate, Cinzel, serif';
  ctx.textAlign = 'center';
  ctx.fillText('THE STATE OF TEXAS',150,36);
  ctx.strokeStyle = '#92400e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(60,185); ctx.bezierCurveTo(35,120,65,65,125,48);
  ctx.moveTo(240,185); ctx.bezierCurveTo(265,120,235,65,175,48);
  ctx.stroke();
  ctx.fillStyle = '#d97706';
  const star = [[150,50],[175,118],[245,120],[190,162],[210,230],[150,190],[90,230],[110,162],[55,120],[125,118]];
  ctx.beginPath(); star.forEach(([px,py],i)=>i ? ctx.lineTo(px,py) : ctx.moveTo(px,py)); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = .18;
  ctx.fillStyle = '#b45309';
  [[150,50,150,190,175,118],[150,190,210,230,190,162],[150,190,90,230,110,162]].forEach(points=>{
    ctx.beginPath(); ctx.moveTo(points[0],points[1]); ctx.lineTo(points[2],points[3]); ctx.lineTo(points[4],points[5]); ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}

function drawTexasMapCanvas(ctx, x, y, w, h, photoImg){
  const mapPath = 'M0.0,41.1 L0.9,42.2 L13.2,52.6 L15.0,58.8 L25.7,67.2 L29.1,65.1 L32.7,59.3 L39.9,60.2 L45.7,66.4 L54.3,80.0 L57.5,90.1 L70.8,95.0 L72.4,86.7 L76.6,73.3 L88.0,66.2 L96.4,61.0 L97.6,60.8 L98.7,57.7 L100.0,49.2 L96.1,40.3 L96.1,26.4 L87.7,22.9 L74.3,23.5 L65.2,21.8 L56.8,17.3 L50.7,17.3 L50.7,0.0 L27.5,0.0 L27.5,40.2 L0.2,40.2 Z';
  ctx.save();
  ctx.translate(x,y); ctx.scale(w/100,h/95);
  ctx.shadowColor = 'rgba(15,23,42,.25)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 3;
  try{
    const path = new Path2D(mapPath);
    ctx.fillStyle = '#7ea7bc'; ctx.fill(path);
    ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#5d8ba1'; ctx.lineWidth = 1.4; ctx.stroke(path);
  }catch(e){
    ctx.fillStyle = '#7ea7bc'; ctx.beginPath(); ctx.rect(0,0,100,95); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(x+47,y+83); ctx.rotate(-Math.PI/2);
  ctx.fillStyle = '#0f172a'; ctx.font = '700 9px "Space Mono",monospace'; ctx.letterSpacing = '.18em';
  ctx.fillText('001010',0,0); ctx.restore();

  const gw = 42, gh = 52, gx = x+w-26-gw, gy = y+33, gr = 3;
  ctx.save();
  roundRect(ctx,gx,gy,gw,gh,gr);
  ctx.fillStyle = '#6f9bb0'; ctx.fill();
  ctx.clip();
  if(photoImg){
    ctx.globalAlpha = .5;
    const ghost = makeGrayscaleCanvas(photoImg,gw,gh,{contrast:1.05,brightness:1.05,objectPositionY:.22});
    ctx.drawImage(ghost,gx,gy);
    ctx.globalAlpha = 1;
  }
  // recessed emboss inside the map
  const emboss = ctx.createLinearGradient(gx,gy,gx,gy+gh);
  emboss.addColorStop(0,'rgba(11,18,32,.4)');
  emboss.addColorStop(.45,'rgba(11,18,32,0)');
  emboss.addColorStop(1,'rgba(255,255,255,.25)');
  ctx.fillStyle = emboss; ctx.fillRect(gx,gy,gw,gh);
  ctx.restore();
  ctx.save();
  roundRect(ctx,gx+.5,gy+.5,gw-1,gh-1,gr);
  ctx.strokeStyle = 'rgba(11,18,32,.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
}

function drawTexasLicenseCardCanvas(d, photoImg){
  const DPR = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
  const WW = 736, WH = 469, pad = 8;
  const CW = WW-pad*2, CH = WH-pad*2;
  const canvas = document.createElement('canvas');
  canvas.width = WW*DPR; canvas.height = WH*DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR,DPR);

  ctx.fillStyle = '#fff'; roundRect(ctx,0,0,WW,WH,28); ctx.fill();
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; roundRect(ctx,.5,.5,WW-1,WH-1,27.5); ctx.stroke();
  ctx.save(); roundRect(ctx,pad,pad,CW,CH,22); ctx.clip(); ctx.translate(pad,pad);

  const bgGrad = ctx.createLinearGradient(0,CH,CW,0);
  bgGrad.addColorStop(0,'#ffffff'); bgGrad.addColorStop(.4,'#f8fafc'); bgGrad.addColorStop(1,'#f1f5f9');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,CW,CH);
  drawCanvasRadialEllipse(ctx,CW*.95,CH*.90,CW*.62,CH*.66,'244,114,182',.45);
  drawCanvasRadialEllipse(ctx,CW*.95,CH*.90,CW*.38,CH*.34,'251,146,60',.15);
  drawCanvasRadialEllipse(ctx,CW*.80,CH*.20,CW*.50,CH*.48,'186,230,253',.5);

  ctx.fillStyle = 'rgba(148,163,184,.25)';
  for(let y=3;y<CH;y+=6) for(let x=3;x<CW;x+=6){ ctx.beginPath(); ctx.arc(x,y,1,0,Math.PI*2); ctx.fill(); }
  drawTexasSealCanvas(ctx,CW-65-360,15,360);

  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const stateTxt = String(d.state||'').toUpperCase();
  ctx.font = '900 46px Graduate, Cinzel, serif';
  try{ ctx.letterSpacing = '.06em'; }catch(e){}
  [[1,1,'#cbd5e1'],[2,2,'#94a3b8'],[3,3,'#64748b']].reverse().forEach(o=>{
    ctx.fillStyle = o[2]; ctx.fillText(stateTxt,22+o[0],14+46+o[1]);
  });
  ctx.lineWidth = 2.2; ctx.strokeStyle = '#64748b'; ctx.lineJoin = 'round';
  ctx.strokeText(stateTxt,22,14+46);
  ctx.fillStyle = '#475569'; ctx.fillText(stateTxt,22,14+46);
  const stateW = ctx.measureText(stateTxt).width;
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  ctx.fillStyle = '#0b1220'; ctx.font = '900 13px Inter, sans-serif'; ctx.fillText('™',22+stateW+3,14+20);
  ctx.fillStyle = '#475569'; ctx.font = 'italic 600 9.5px "Playfair Display",serif'; ctx.fillText('Cabinet Secretary & Director',26,14+44+11);

  ctx.fillStyle = '#0f172a'; ctx.font = '900 19px Inter,sans-serif';
  drawCanvasSpacedText(ctx,'DRIVER LICENSE',325,28+19,3.4);
  ctx.fillStyle = '#1e293b'; ctx.font = '700 11px Inter,sans-serif'; ctx.fillText('9a Class',CW-75-56,28+11);

function drawLicenseCardCanvas(d, photoImg){
  const DPR = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
  const WW = 736, WH = 469, pad = 8;
  const CW = WW - pad*2, CH = WH - pad*2; // 720 x 453 card interior

  const canvas = document.createElement('canvas');
  canvas.width = WW*DPR; canvas.height = WH*DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  // Wrapper: white rounded card body
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, 0, 0, WW, WH, 28); ctx.fill();
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
  roundRect(ctx, 0.5, 0.5, WW-1, WH-1, 27.5); ctx.stroke();

  ctx.save();
  roundRect(ctx, pad, pad, CW, CH, 22);
  ctx.clip();
  ctx.translate(pad, pad);

  // Pastel rainbow band background (matches .license-holo-bg, 28deg)
  const angle = (90-28)*Math.PI/180;
  const diag = Math.abs(CW*Math.cos(angle)) + Math.abs(CH*Math.sin(angle));
  const bgGrad = ctx.createLinearGradient(
    CW/2 - Math.cos(angle)*diag/2, CH/2 + Math.sin(angle)*diag/2,
    CW/2 + Math.cos(angle)*diag/2, CH/2 - Math.sin(angle)*diag/2);
  [[0,'#f6b9c6'],[0.06,'#f9c6cf'],[0.11,'#fbd9c0'],[0.17,'#fdeeb6'],[0.22,'#f7f4d8'],
   [0.26,'#ffffff'],[0.31,'#e7f3e4'],[0.37,'#bfe4c9'],[0.45,'#b8cbef'],[0.51,'#dfe8fa'],
   [0.55,'#f4f7ee'],[0.61,'#fbeab3'],[0.66,'#f9d8bd'],[0.72,'#f7bfcb'],[0.78,'#fadde0'],
   [0.83,'#eef0f8'],[0.88,'#c6dcf0'],[0.93,'#cfe7d2'],[1,'#f7c3cd']]
    .forEach(([stop,color])=>bgGrad.addColorStop(stop,color));
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,CW,CH);

  // Soft frosted sheen
  ctx.save();
  ctx.globalAlpha = 0.22;
  drawLicenseWave(ctx, CW, 130, 'rgba(255,255,255,0.85)', 15);
  drawLicenseWave(ctx, CW, 150, 'rgba(255,255,255,0.45)', 5);
  ctx.restore();

  // Portrait
  const px=25, py=90, pw=165, ph=225;
  if(photoImg){
    ctx.save();
    roundRect(ctx, px, py, pw, ph, 8); ctx.clip();
    const gray = makeGrayscaleCanvas(photoImg, pw, ph);
    ctx.drawImage(gray, px, py);
    ctx.restore();
  } else {
    ctx.fillStyle = '#e2e8f0';
    roundRect(ctx, px, py, pw, ph, 8); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(148,163,184,.5)'; ctx.lineWidth = 1;
  roundRect(ctx, px+0.5, py+0.5, pw-1, ph-1, 8); ctx.stroke();

  // Ghost portrait (right side)
  if(photoImg){
    const gx = CW-25-100, gy = 280, gw = 100, gh = 135;
    ctx.save();
    ctx.globalAlpha = 0.38;
    ctx.translate(gx+gw/2, gy+gh/2);
    roundRect(ctx, -gw/2, -gh/2, gw, gh, 6);
    ctx.clip();
    const ghostGray = makeGrayscaleCanvas(photoImg, gw, gh);
    ctx.drawImage(ghostGray, -gw/2, -gh/2);
    ctx.restore();
  }

  ctx.textBaseline = 'alphabetic';

  // State script
  ctx.fillStyle = '#ec4899';
  ctx.font = "900 47px Caveat, cursive";
  ctx.textAlign = 'left';
  ctx.fillText(d.state, 25, 15+38);

  // Title
  ctx.fillStyle = '#1e293b';
  ctx.font = "900 25px Inter, sans-serif";
  ctx.textAlign = 'center';
  try{ ctx.letterSpacing = '4px'; }catch(e){}
  ctx.fillText('DRIVER LICENSE', CW/2, 28+16);
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  ctx.textAlign = 'left';

  // USA + seal
  const sealR = 15, sealCx = CW-25-sealR, sealCy = 20+sealR;
  ctx.fillStyle = '#1e293b';
  ctx.font = "900 18px Inter, sans-serif";
  ctx.textAlign = 'right';
  ctx.fillText('USA', sealCx-sealR-6, sealCy+4);
  ctx.textAlign = 'left';
  ctx.beginPath(); ctx.arc(sealCx, sealCy, sealR, 0, Math.PI*2);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '13px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', sealCx, sealCy+5);
  ctx.textAlign = 'left';

  // Signature
  ctx.save();
  // Keep the signature in a dedicated strip directly beneath the portrait.
  ctx.beginPath();
  ctx.rect(px, 325, pw, 43);
  ctx.clip();
  ctx.translate(px+pw/2, 325+27);
  ctx.rotate(-3*Math.PI/180);
  ctx.fillStyle = '#0f172a';
  const hawaiiSignature = String(d.signature||'');
  let hawaiiSignatureSize = 29;
  ctx.fillStyle = '#0f172a';
  ctx.textAlign = 'center';
  ctx.font = `700 ${hawaiiSignatureSize}px 'Edwardian Script ITC', 'Edwardian Script', Caveat, cursive`;
  while(ctx.measureText(hawaiiSignature).width > pw-8 && hawaiiSignatureSize > 14){
    hawaiiSignatureSize -= 1;
    ctx.font = `700 ${hawaiiSignatureSize}px 'Edwardian Script ITC', 'Edwardian Script', Caveat, cursive`;
  }
  ctx.fillText(hawaiiSignature, 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';

  // Field rows
  drawFieldLV(ctx, '4a DLN', d.dln, 215, 90, {});
  drawFieldLV(ctx, '3 DOB', d.dob, 458, 90, {});
  drawFieldLV(ctx, '4a ISS', d.iss, 215, 125, {valueSize:21});
  drawFieldLV(ctx, '4b EXP', d.exp, 458, 125, {valueSize:21});
  drawFieldLV(ctx, '1', d.fname, 215, 165, {valueSize:21});
  drawFieldLV(ctx, '2', d.lname, 215, 190, {valueSize:21});

  // Address (label + up to two lines)
  ctx.fillStyle = '#475569';
  ctx.font = '900 16px Inter, sans-serif';
  ctx.fillText('8', 215, 225+16);
  ctx.fillStyle = '#0f172a';
  ctx.font = '900 20px Inter, sans-serif';
  String(d.address).split('\n').forEach((line,i)=>{
    ctx.fillText(line, 243, 225+20+ i*23);
  });

  // Stats row
  const statLabels = [['15 GENDER', d.gender],['18 HGT', d.hgt],['18 EYES', d.eyes],['17 WGT', d.wgt]];
  statLabels.forEach(([label,value],i)=>{
    const cx = 215 + 84*i + 42;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#475569';
    ctx.font = '900 14px Inter, sans-serif';
    ctx.fillText(label, cx, 282+14);
    ctx.fillStyle = '#0f172a';
    ctx.font = '900 19px Inter, sans-serif';
    ctx.fillText(value, cx, 282+14+21);
  });
  ctx.textAlign = 'left';

  // Class + endorsements
  ctx.textAlign = 'center';
  ctx.fillStyle = '#475569'; ctx.font = '900 14px Inter, sans-serif';
  ctx.fillText('9 CLASS', 255, 332+14);
  ctx.fillStyle = '#0f172a'; ctx.font = '900 19px Inter, sans-serif';
  ctx.fillText(d.cls, 255, 332+14+21);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#475569'; ctx.font = '900 14px Inter, sans-serif';
  ctx.fillText('9a ENDORSEMENTS', 320, 332+14);
  ctx.fillStyle = '#0f172a'; ctx.font = '900 19px Inter, sans-serif';
  ctx.fillText(d.endorse, 320, 332+14+21);

  // Restrictions
  ctx.fillStyle = '#475569'; ctx.font = '900 14px Inter, sans-serif';
  ctx.fillText('12 RESTRICTIONS', 215, 378+14);
  ctx.fillStyle = '#0f172a'; ctx.font = '900 19px Inter, sans-serif';
  ctx.fillText(d.rest, 215, 378+14+21);

  // Serial
  ctx.fillStyle = '#475569'; ctx.font = '900 15px Inter, sans-serif';
  ctx.fillText('5', 215, 418+15);
  ctx.fillStyle = '#1e293b'; ctx.font = '700 17px "Space Mono", monospace';
  ctx.fillText(d.serial, 234, 418+15);

  // Serial caption
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(148,163,184,.7)';
  ctx.font = '900 10px Inter, sans-serif';
  ctx.fillText('SERIAL NUMBER', CW/2, CH-4);
  ctx.textAlign = 'left';

  ctx.restore(); // end card clip
  return canvas;
}



async function generateLicenseCard(){
  const button = $('#license-generate-btn');
  if(button){
    button.disabled = true;
    button.textContent = 'Saving to Cloud Firestore…';
  }
  const val = id=>{ const el = $('#'+id); return el ? el.value : ''; };
  const type = licenseTypeKey(location.hash.split('/')[2]);
  const photoEl = $('#output-photo');
  const data = {
    userId: currentUser ? currentUser.email : '',
    licenseType: type,
    licenseName: licensePreset(type).label,
    createdAt: new Date().toISOString(),
    state: val('input-state'),
    dln: val('input-dln'),
    fname: val('input-fname'),
    lname: val('input-lname'),
    signature: `${val('input-fname')} ${val('input-lname')}`.trim(),
    address: val('input-address'),
    dob: val('input-dob'),
    iss: val('input-iss'),
    exp: val('input-exp'),
    gender: val('input-gender'),
    hgt: val('input-hgt'),
    eyes: val('input-eyes'),
    wgt: val('input-wgt'),
    cls: val('input-class'),
    endorse: val('input-endorse'),
    rest: val('input-rest'),
    serial: val('input-serial'),
    photo: photoEl ? photoEl.src : ''
  };
  // Portraits arrive as very large data URLs; shrink before storing anywhere.
  if(typeof data.photo === 'string' && data.photo.startsWith('data:image/')){
    try{ data.photo = await window.compressDataUrlImage(data.photo, 720, 0.82); }catch(_e){}
  }

  const resetButton = ()=>{
    if(!button) return;
    button.disabled = false;
    button.innerHTML = `${icon('credit-card')} Generate ID CARD`;
      try{ renderIcons(button); }catch(_e){}
  };

  // localStorage throws QuotaExceededError on big photos — never let that block the card.
  const cacheLocally = ()=>{
    try{
      localStorage.setItem(`generatedLicenseCard:${type}`, JSON.stringify(data));
      localStorage.setItem('generatedLicenseCard', JSON.stringify(data));
    }catch(storageError){
      console.warn('Local cache skipped (storage full).', storageError);
      try{
        const light = { ...data, photo:'' };
        localStorage.setItem(`generatedLicenseCard:${type}`, JSON.stringify(light));
        localStorage.setItem('generatedLicenseCard', JSON.stringify(light));
      }catch(_e){}
    }
  };

  if(!currentUser || !window.firebaseCloud || !window.firebaseCloud.isReady){
    // Offline / signed out: still generate the card locally instead of stalling.
    cacheLocally();
    showToast('Cloud is unavailable — the card was generated locally', true);
    resetButton();
    navigate(`#/license-output/${type}`);
    return;
  }
  try{
    const saved = await window.firebaseCloud.saveLicenseDocument(currentUser.email, data);
    data.documentId = saved.id;
    if(saved.data && saved.data.photo) data.photo = saved.data.photo;
    licenseHistoryDB = [{
      id:saved.id,
      userId:currentUser.email,
      licenseType:type,
      licenseName:licensePreset(type).label,
      createdAt:data.createdAt,
      payload:data
    }, ...licenseHistoryDB];
    cacheLocally();
    showToast('Driver’s license saved to Cloud Firestore');
    navigate(`#/license-output/${type}`);
  }catch(err){
    console.warn('License document could not be saved to Firebase.', err);
    cacheLocally();
    showToast('Saved locally — the cloud save did not complete', true);
    navigate(`#/license-output/${type}`);
  }finally{
    resetButton();
  }
}

function licenseCardDefaults(type){
  const preset = licensePreset(type);

function timelineHtml(shipment){
  const events = (shipment.events||[]).slice().sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  const reachedNormal = events.map(e=>e.status).filter(s=>STATUS_FLOW.includes(s));
  let highestIdx = -1;
  reachedNormal.forEach(s=>{ const i=STATUS_FLOW.indexOf(s); if(i>highestIdx) highestIdx=i; });
  if(highestIdx<0) highestIdx=0;
  const isException = shipment.status==='Delivery Exception';
  const fillPct = Math.max(0, Math.min(100, (highestIdx/(STATUS_FLOW.length-1))*100));

  const steps = STATUS_FLOW.map((s,i)=>{
    let cls='';
    if(i<highestIdx || (i===highestIdx && shipment.status===s)) cls = i<=highestIdx ? (i<highestIdx || shipment.status===s ? (i===highestIdx?'active':'complete') : '') : '';
    if(i<highestIdx) cls='complete';
    else if(i===highestIdx) cls = (shipment.status===s && !isException) ? 'active' : (i<highestIdx?'complete':'active');
    if(isException) cls = i<=highestIdx ? 'complete':'';
    return `<div class="tstep ${cls}"><div class="dot">${cls==='complete'?icon('check'):(cls==='active'?'<span class=\"pulse\"></span>':'')}</div><span class="lbl">${s}</span></div>`;
  }).join('');

  const eventsHtml = events.slice().reverse().map(e=>{
    const c = statusColor(e.status);
    return `<div class="event-item">
      <div class="event-dot-col"><div class="event-dot" style="background:${c.fg};"></div></div>
      <div class="event-content">
        <div class="event-status" style="color:${c.fg};">${esc(e.status)}</div>
        ${e.location?`<div class="event-loc">${icon('pin')} ${esc(e.location)}</div>`:''}
        <div class="event-time">${fmtDateTime(e.timestamp)}</div>
        ${e.description?`<div class="event-note">"${esc(e.description)}"</div>`:''}
      </div>
    </div>`;
  }).join('') || `<div style="color:var(--muted);font-size:14px;padding:12px 0;">No tracking events yet.</div>`;

  return `
    <div class="timeline-rail"><div class="fill" style="width:${fillPct}%;"></div>${steps}</div>
    ${isException ? `<div class="exception-banner">${icon('alert')}<div><b>Delivery exception reported.</b> ${esc((shipment.events.slice().reverse().find(e=>e.status==='Delivery Exception')||{}).description || 'The carrier flagged an issue with this shipment.')}</div></div>` : ''}
    <div class="section-title-row" style="margin-top:26px;"><h3>Tracking history</h3></div>
    <div class="events-list">${eventsHtml}</div>`;
}

function getShipmentMapLocation(shipment){
  const events = (shipment.events||[]).slice().sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0));
  const eventLocation = events.find(event=>Number.isFinite(Number(event.latitude)) && Number.isFinite(Number(event.longitude)));
  if(eventLocation){
    return {
      latitude:Number(eventLocation.latitude),
      longitude:Number(eventLocation.longitude),
      label:eventLocation.location || 'Latest reported package location',
      timestamp:eventLocation.timestamp
    };
  }
  const latitude = Number(shipment.shipping&&shipment.shipping.latitude);
  const longitude = Number(shipment.shipping&&shipment.shipping.longitude);
  if(Number.isFinite(latitude) && Number.isFinite(longitude)){
    return {
      latitude,
      longitude,
      label:'Package location',
      timestamp:shipment.updatedAt || shipment.createdAt
    };
  }
  return null;
}

function routeMapCardHtml(mapId, routeStops, selectedId, mapLocation, title, subtitle){
  const stops = Array.isArray(routeStops) ? routeStops : [];
  const selectedStop = findRouteStop(stops, selectedId);
  const coordinateStops = stops.filter(stop=>Number.isFinite(Number(stop.latitude)) && Number.isFinite(Number(stop.longitude)));
  const hasCurrentCoordinates = mapLocation && Number.isFinite(Number(mapLocation.latitude)) && Number.isFinite(Number(mapLocation.longitude));
  const readOnlyMap = /^#\/track(?:\/|$)/.test(location.hash);
  const mapAppLocation = hasCurrentCoordinates
    ? {latitude:Number(mapLocation.latitude), longitude:Number(mapLocation.longitude), label:mapLocation.label || 'Latest reported location'}
    : (selectedStop && Number.isFinite(Number(selectedStop.latitude)) && Number.isFinite(Number(selectedStop.longitude))
      ? {latitude:Number(selectedStop.latitude), longitude:Number(selectedStop.longitude), label:selectedStop.name || 'Selected route location'}
      : null);
  const mapAppUrl = mapAppLocation
    ? `https://www.google.com/maps/search/?api=1&query=${mapAppLocation.latitude},${mapAppLocation.longitude}`
    : '';
  const currentLabel = mapLocation?.label || selectedStop?.name || 'Latest reported location';
  const currentIndex = stops.findIndex(stop=>stop.id===selectedId);
  const stopRows = stops.map((stop,index)=>{
    const isCurrent = stop.id===selectedId;
    const stage = isCurrent ? 'Current location' : (index===0 ? 'Origin' : (index===stops.length-1 ? 'Destination' : 'Stopover'));
    return `<div class="route-stop-row ${isCurrent?'current':''}">
      <span class="route-stop-marker">${isCurrent?'●':index+1}</span>
      <span><span class="route-stop-name">${esc(stop.name||'Route location')}</span><span class="route-stop-kind">${esc(stage)} · ${esc(stop.kind||'Location')}</span></span>
    </div>`;
  }).join('');
  const mapStops = [...coordinateStops];
  if(hasCurrentCoordinates && !coordinateStops.some(stop=>Number(stop.latitude)===Number(mapLocation.latitude) && Number(stop.longitude)===Number(mapLocation.longitude))){
    mapStops.push({id:'current-location', name:currentLabel, kind:'Current location', latitude:Number(mapLocation.latitude), longitude:Number(mapLocation.longitude)});
  }
  const canMap = mapStops.length>0;
  return `
    <div class="card card-pad tracking-map-card">
      <div class="section-title-row">
        <h3>${esc(title)}</h3>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;">
          <span style="font-size:12px;color:var(--muted);">${esc(subtitle||'Route and stopovers')}</span>
          ${readOnlyMap && mapAppLocation ? `<a class="btn btn-ghost btn-sm" href="${esc(mapAppUrl)}" target="_blank" rel="noopener noreferrer">${icon('map')} Open in Maps</a>` : ''}
        </div>
      </div>
      ${hasCurrentCoordinates ? `<div class="tracking-map-note"><span><strong>${esc(currentLabel)}</strong></span><span class="mono">Updated ${esc(fmtDateTime(mapLocation.timestamp))}</span></div>` : ''}
      <div class="route-map-layout">
        ${canMap ? `<div id="${esc(mapId)}" class="tracking-map route-map" data-route-map data-stops="${esc(JSON.stringify(mapStops))}" data-current-id="${esc(selectedId||'current-location')}" data-current-lat="${hasCurrentCoordinates?mapLocation.latitude:''}" data-current-lng="${hasCurrentCoordinates?mapLocation.longitude:''}" data-current-label="${esc(currentLabel)}" role="img" aria-label="${esc(title)}"></div>` : `<div class="tracking-map-empty">Route coordinates are not available yet. The latest progress updates are still shown below.</div>`}
        <div class="route-stop-list">${stopRows || `<div class="tracking-map-empty">No route stops have been published yet.</div>`}</div>
      </div>
    </div>`;
}

function wireTrackingMap(){
  if(typeof L==='undefined') return;
  $all('[data-route-map]').forEach(mapEl=>{
    if(mapEl.dataset.mapWired) return;
    let stops = [];
    try{ stops = JSON.parse(mapEl.dataset.stops||'[]'); }catch(error){ stops = []; }
    const points = stops
      .map(stop=>({ ...stop, latitude:Number(stop.latitude), longitude:Number(stop.longitude) }))
      .filter(stop=>Number.isFinite(stop.latitude) && Number.isFinite(stop.longitude));
    const currentLat = Number(mapEl.dataset.currentLat), currentLng = Number(mapEl.dataset.currentLng);
    if(Number.isFinite(currentLat) && Number.isFinite(currentLng) &&
      !points.some(stop=>stop.latitude===currentLat && stop.longitude===currentLng)){
      points.push({id:'current-location', name:mapEl.dataset.currentLabel||'Latest reported location', kind:'Current location', latitude:currentLat, longitude:currentLng});
    }
    if(!points.length) return;
    mapEl.dataset.mapWired='1';
    const map = L.map(mapEl, { scrollWheelZoom:false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);
    const line = points.map(stop=>[stop.latitude, stop.longitude]);
    if(line.length>1) L.polyline(line, {color:'#CDAE5A', weight:4, opacity:.85, dashArray:'8 8'}).addTo(map);
    const layers = [];
    points.forEach((stop,index)=>{
      const isCurrent = stop.id===mapEl.dataset.currentId ||
        (Number.isFinite(currentLat) && stop.latitude===currentLat && stop.longitude===currentLng);
      const marker = L.circleMarker([stop.latitude, stop.longitude], {
        radius:isCurrent?9:6,
        color:isCurrent?'#16120A':'#ffffff',
        weight:isCurrent?3:2,
        fillColor:isCurrent?'#CDAE5A':'#4C5E78',
        fillOpacity:1
      }).addTo(map);
      marker.bindPopup(`<strong>${esc(stop.name||'Route location')}</strong><br><span>${esc(stop.kind||'Location')}</span>`);
      if(isCurrent) marker.openPopup();
      layers.push(marker);
    });
    const bounds = L.featureGroup(layers).getBounds();
    if(bounds.isValid()) map.fitBounds(bounds.pad(.16), {maxZoom:12});
    else map.setView([points[0].latitude, points[0].longitude], 12);
    setTimeout(()=>map.invalidateSize(), 0);
  });
}

  }, error=>console.warn('Live shipment updates are unavailable.', error));
}

/* Shared by both the on-screen boarding pass (pageFlightDetail) and the
   canvas-drawn PNG export (downloadFlightTicketImage) so the two stay in
   sync and the date/airport-parsing logic only lives in one place. */
function buildTicketViewModel(f){
  const airport = raw => {
    const parts = String(raw||'').split(/\s*[·|—-]\s*/).filter(Boolean);
    if(parts.length > 1) return { code:parts.shift().trim().toUpperCase(), city:parts.join(' ').trim().toUpperCase() };
    const value = String(raw||'—').trim().toUpperCase();
    return { code:value, city:value };
  };
  const from = airport(f.origin), to = airport(f.destination);
  const departure = new Date(f.departure);
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const ticketDate = Number.isNaN(departure.getTime()) ? '—' : `${String(departure.getDate()).padStart(2,'0')}${months[departure.getMonth()]}${String(departure.getFullYear()).slice(-2)}`;
  const ticketTime = Number.isNaN(departure.getTime()) ? '—' : departure.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  const ticketClass = `${String(f.cabin||'Economy').toUpperCase()} CLASS`;
  const sequence = f.sequence || '00334';
  const etNo = f.etNo || f.trackingNumber;
  return { f, from, to, ticketDate, ticketTime, ticketClass, sequence, etNo };
}

/* ================= ROUTER ================= */
async function router(){
  const requestId = ++routerGeneration;
  await ensureDBReady();
  if(requestId !== routerGeneration) return;
  seedInitialRouteHistory();
  rememberCurrentRoute();
  const hash = location.hash.replace(/^#/,'') || '/';
  const parts = hash.split('/').filter(Boolean);
  const app = $('#app');
  let html = '';

  if(parts.length===0){ html = pageLanding(); }
  else if(parts[0]==='register'){ html = currentUser ? redirectTo('/dashboard') : pageRegister(); }
  else if(parts[0]==='login'){ html = currentUser ? redirectTo('/dashboard') : pageLogin(); }
  else if(parts[0]==='dashboard'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { await loadLicenseHistory(); html = pageDashboard(); }
  }
  else if(parts[0]==='history'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { await loadLicenseHistory(); html = pageHistory(); }
  }
  else if(parts[0]==='tracking'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageTracking(); }
  }
  else if(parts[0]==='profile'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageProfile(); }
  }
  else if(parts[0]==='create-flight'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageCreateFlight(); }
  }
  else if(parts[0]==='create'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageCreateHub(); }
  }
  else if(parts[0]==='create-id-card'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = parts[1] ? pageCreationPlaceholder(parts[1]) : pageIdCardCreationHub(); }
  }
  else if(parts[0]==='create-document'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageCreationPlaceholder('document'); }
  }
  else if(parts[0]==='create-receipt'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageCreationPlaceholder('receipt'); }
  }
  else if(parts[0]==='create-shipment'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageCreateShipment(); }
  }
  else if(parts[0]==='flight-history'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageFlightHistory(); }
  }
  else if(parts[0]==='shipment-history'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = pageShipmentHistory(); }
  }
  else if(parts[0]==='create-license'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { html = parts[1] ? pageCreateLicense(parts[1]) : pageCreateLicenseChooser(); }
  }
  else if(parts[0]==='license-history'){
    if(!currentUser){ html = redirectTo('/login'); }
    else { await loadLicenseHistory(); html = pageLicenseHistory(); }
  }
  else if(parts[0]==='license-output'){
    if(!currentUser){ html = redirectTo('/login'); }
    else if(parts[2]){
      try{
        const cloudDocument = await window.firebaseCloud.getLicenseDocument(parts[2], currentUser.email);
        if(!cloudDocument) html = redirectTo('/license-history');
        else html = pageLicenseOutput(parts[1] || 'hawaii', cloudDocument.payload || cloudDocument.data || {});
      }catch(error){
        console.warn('License document could not be loaded from Firebase.', error);
        showToast('Could not load that license from Cloud Firestore', true);
        html = redirectTo('/license-history');
      }
    }
    else { html = pageLicenseOutput(parts[1] || 'hawaii'); }
  }
  else if(parts[0]==='confirmation'){ html = currentUser ? pageConfirmation(parts[1]) : redirectTo('/login'); }
  else if(parts[0]==='edit'){ html = currentUser ? pageEditShipment(parts[1]) : redirectTo('/login'); }
  else if(parts[0]==='live-track'){
    const hostedCode = parts[1] ? decodeURIComponent(parts[1]) : '';
    html = pageHostedTrackingRedirect(hostedCode);
    setTimeout(()=>openHostedTracking(hostedCode), 400);
  }
  else if(parts[0]==='track'){
    const trackingCode = parts[1] ? decodeURIComponent(parts[1]) : '';
    html = trackingCode.toUpperCase().startsWith('FLT-') ? pageFlightDetail(trackingCode) : (trackingCode ? pageTrackingDetail(trackingCode) : (currentUser ? pageTracking() : pageTrackSearch()));
  }
  else if(parts[0]==='flight'){ html = parts[1] ? pageFlightDetail(decodeURIComponent(parts[1])) : redirectTo('/'); }
  else if(parts[0]==='admin'){ html = pageAdmin(); }
  else { html = pageLanding(); }

  if(requestId !== routerGeneration) return;
  if(html===null) return; // redirect happened
  app.innerHTML = html;
  renderIcons(app);
  wirePageEvents(parts);
  window.scrollTo(0,0);
  document.documentElement.scrollTop = 0;
}

function fitLicenseSignatures(){
  $all('.license-signature-output, .tx-signature').forEach(el=>{
    const baseSize = el.classList.contains('tx-signature') ? 26 : 29;
    const minSize = 14;
    const availableWidth = Math.max(1, el.clientWidth - 8);
    let size = baseSize;
    el.style.fontSize = `${size}px`;
    while(el.scrollWidth > availableWidth && size > minSize){
      size -= 1;
      el.style.fontSize = `${size}px`;
    }
    el.style.textAlign = 'center';
    el.style.justifyContent = 'center';
  });
}

/* Scales the fixed 1040px-wide boarding pass down so the whole ticket
   preview always fits the available screen width — the same fit-to-screen
   technique used by the driver's license live preview. */
const TICKET_DESIGN_WIDTH = 1040;
function fitBoardingPassPreview(){
  const wrap = document.getElementById('boardingPassScaleWrap');
  const pass = document.getElementById('boardingPassEl');
  if(!wrap || !pass) return;
  const scale = Math.min(1, Math.max(1, wrap.clientWidth) / TICKET_DESIGN_WIDTH);
  pass.style.transform = scale < 1 ? `scale(${scale})` : '';
  wrap.style.height = `${Math.ceil(pass.offsetHeight * scale)}px`;
}

function fitLicensePreviews(){
  $all('.license-card-scroll').forEach(scroll=>{
    const tabletop = scroll.querySelector('.license-tabletop');
    if(!tabletop) return;
    const scale = Math.min(1, Math.max(1, scroll.clientWidth) / 800);
    tabletop.style.setProperty('--license-preview-scale', String(scale));
  });
}

function wireLicenseGenerator(){
  const map = [
    { id:'input-state', out:'output-state' },
    { id:'input-dln', out:'output-dln' },
    { id:'input-dob', out:'output-dob' },
    { id:'input-iss', out:'output-iss' },
    { id:'input-exp', out:'output-exp' },
    { id:'input-fname', out:'output-fname' },
    { id:'input-lname', out:'output-lname' },
    { id:'input-address', out:'output-address' },
    { id:'input-gender', out:'output-gender' },
    { id:'input-hgt', out:'output-hgt' },
    { id:'input-eyes', out:'output-eyes' },
    { id:'input-wgt', out:'output-wgt' },
    { id:'input-class', out:'output-class' },
    { id:'input-endorse', out:'output-endorse' },
    { id:'input-rest', out:'output-rest' },
    { id:'input-serial', out:'output-serial' }
  ];

  map.forEach(item=>{
    const inputEl = $('#'+item.id);
    if(!inputEl) return;
    inputEl.addEventListener('input', e=>{
      const value = e.target.value;
      const targets = Array.isArray(item.out) ? item.out : [item.out];
      targets.forEach(target=>{
        const outputEl = $('#'+target);
        if(outputEl) outputEl.textContent = value;
      });
    });
  });

  const syncLicenseSignature = ()=>{
    const signatureEl = $('#output-signature');
    if(!signatureEl) return;
    const firstName = $('#input-fname')?.value.trim() || '';
    const lastName = $('#input-lname')?.value.trim() || '';
    signatureEl.textContent = [firstName, lastName].filter(Boolean).join(' ');
    fitLicenseSignatures();
  };
  ['input-fname','input-lname'].forEach(id=>{
    const inputEl = $('#'+id);
    if(inputEl) inputEl.addEventListener('input', syncLicenseSignature);
  });
  fitLicenseSignatures();
  if(document.fonts) document.fonts.ready.then(()=>fitLicenseSignatures());
  fitLicensePreviews();

  const photoInput = $('#input-photo-file');
  if(photoInput) photoInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      showToast('Please select an image file', true);
      photoInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = event=>{
      const photo = event.target.result;
      $('#output-photo').src = photo;
      $('#output-ghost-photo').src = photo;
    };
    reader.readAsDataURL(file);
  });
}

/* Draws the boarding pass straight onto a <canvas> using the 2D drawing
   API and exports that as a PNG. This intentionally avoids any external
   library (html2canvas, etc.) — those need to be fetched from a CDN at
   click time, which silently fails (and makes the button look "broken")
   whenever the page is opened somewhere without script/network access,
   e.g. a downloaded-file viewer. Everything below runs fully offline. */
function downloadFlightTicketImage(trackingNumber){
  const f = flightsDB[trackingNumber];
  if(!f){ showToast('Could not find that ticket to download', true); return; }
  const { from, to, ticketDate, ticketTime, ticketClass, sequence, etNo } = buildTicketViewModel(f);

  const DPR = 2; // draw at 2x for a crisp download regardless of device
  const W = 1040, H = 380, STUB_W = 230;
  const canvas = document.createElement('canvas');
  canvas.width = W * DPR; canvas.height = H * DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);

  const ink = '#2d231d', mutedInk = '#47372b', rule = '#3a2a20';
  const mainW = W - STUB_W;

  // Card background
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#f6eedf'); bgGrad.addColorStop(0.68,'#eee5d4'); bgGrad.addColorStop(1,'#e7dbc7');
  ctx.fillStyle = bgGrad;
  roundRect(ctx, 0, 0, W, H, [4,15,15,4]);
  ctx.fill();

  // Stub panel background + dashed divider
  ctx.save();
  roundRect(ctx, 0, 0, W, H, [4,15,15,4]);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,250,239,.5)';
  ctx.fillRect(mainW, 0, STUB_W, H);
  ctx.restore();
  ctx.strokeStyle = 'rgba(57,42,31,.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(mainW, 0); ctx.lineTo(mainW, H); ctx.stroke();
  ctx.setLineDash([]);

  // ---- Main section ----
  const mx = 30; let my = 42;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = ink;
  ctx.font = '700 12px Arial, sans-serif';
  ctx.fillText(String(f.airline||'SINGAPORE AIRLINES').toUpperCase(), mx, my);
  ctx.font = '700 25px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(ticketClass, mainW - 30, my);
  ctx.textAlign = 'left';

  my += 20;
  ctx.strokeStyle = rule; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mainW-30, my); ctx.stroke();

  my += 28;
  ctx.font = '700 21px "IBM Plex Mono", monospace';
  ctx.fillText(String(f.passenger||'').toUpperCase(), mx, my);

  // Route row
  const routeTop = my + 20, routeBottom = routeTop + 40;
  ctx.strokeStyle = 'rgba(57,42,31,.7)'; ctx.lineWidth = 1;
  line(ctx, mx, routeTop, mainW-30, routeTop);
  line(ctx, mx, routeBottom, mainW-30, routeBottom);
  const routeCols = [
    { label:'Flight', value: f.flightNo||'—' },
    { label:'From', value: from.code },
    { label:'To', value: to.code },
    { label:'Date', value: ticketDate },
  ];
  drawFieldRow(ctx, routeCols, mx, mainW-30, routeTop + 25, 9.5, 18);

  // Detail row
  const detailTop = routeBottom + 26;
  ctx.font = '700 9.5px Arial, sans-serif'; ctx.fillStyle = mutedInk;
  const detailCols = ['Terminal','Gate','Boarding time','Seat','Boarding group'];
  const detailVals = [f.terminal||'—', f.gate||'—', ticketTime, f.seat||'—', f.boardingGroup||'—'];
  const dColX = colPositions(mx, mainW-30, [0.75,0.75,1.25,0.75,0.9]);
  detailCols.forEach((label,i)=>{
    ctx.fillStyle = mutedInk; ctx.font = '700 9.5px Arial, sans-serif';
    ctx.fillText(label, dColX[i], detailTop);
    ctx.fillStyle = ink;
    ctx.font = i===2 ? '700 20px "IBM Plex Mono", monospace' : '700 24px "IBM Plex Mono", monospace';
    ctx.fillText(detailVals[i], dColX[i], detailTop + 24);
    if(i===2){
      ctx.font = '700 10px Arial, sans-serif'; ctx.fillStyle = mutedInk;
      ctx.fillText(ticketDate, dColX[i], detailTop + 38);
    }
  });

  // Footer
  const footTop = detailTop + 52;
  ctx.strokeStyle = rule; ctx.lineWidth = 2;
  line(ctx, mx, footTop, mainW-30, footTop);
  ctx.font = '700 10.5px Arial, sans-serif'; ctx.fillStyle = ink;
  ctx.fillText('GATE CLOSES 10 MINS BEFORE DEPARTURE', mx, footTop + 22);
  ctx.font = '700 10px Arial, sans-serif';
  ctx.fillText(`${sequence}   ETNo ${etNo}`, mx, footTop + 40);
  drawBarcode(ctx, mainW - 30 - 82, footTop + 4, 82, 40);

  // ---- Stub section ----
  const sx = mainW + 22; let sy = 40;
  ctx.textAlign = 'left';
  ctx.fillStyle = ink;
  ctx.font = '700 18px Georgia, serif';
  ctx.fillText(ticketClass, sx, sy);
  sy += 10;
  ctx.strokeStyle = rule; ctx.lineWidth = 2;
  line(ctx, sx, sy+2, W-20, sy+2);
  sy += 30;
  ctx.font = '700 15px "IBM Plex Mono", monospace';
  wrapText(ctx, String(f.passenger||'').toUpperCase(), sx, sy, W-20-sx, 17);
  sy += 40;
  ctx.font = '400 9px Arial, sans-serif'; ctx.fillStyle = mutedInk;
  ctx.fillText('From', sx, sy);
  ctx.font = '700 14px Arial, sans-serif'; ctx.fillStyle = ink;
  sy += 14;
  wrapText(ctx, from.city, sx, sy, W-20-sx, 15);
  sy += 22;
  ctx.font = '400 9px Arial, sans-serif'; ctx.fillStyle = mutedInk;
  ctx.fillText('To', sx, sy);
  ctx.font = '700 14px Arial, sans-serif'; ctx.fillStyle = ink;
  sy += 14;
  wrapText(ctx, to.city, sx, sy, W-20-sx, 15);

  sy += 24;
  ctx.strokeStyle = 'rgba(57,42,31,.7)'; ctx.lineWidth = 1;
  line(ctx, sx, sy, W-20, sy);
  sy += 20;
  ctx.font = '400 9.5px Arial, sans-serif'; ctx.fillStyle = mutedInk;
  ctx.fillText('Flight', sx, sy);
  ctx.fillText('Seat', sx + 100, sy);
  sy += 16;
  ctx.font = '700 15px Arial, sans-serif'; ctx.fillStyle = ink;
  ctx.fillText(f.flightNo||'—', sx, sy);
  ctx.font = '700 22px Arial, sans-serif';
  ctx.fillText(f.seat||'—', sx + 100, sy);
  sy += 14;
  ctx.strokeStyle = 'rgba(57,42,31,.7)';
  line(ctx, sx, sy, W-20, sy);

  sy += 24;
  ctx.font = '700 9px Arial, sans-serif'; ctx.fillStyle = mutedInk;
  ctx.fillText(ticketDate, sx, sy);

  sy += 22;
  ctx.strokeStyle = rule; ctx.lineWidth = 2;
  line(ctx, sx, sy, W-20, sy);
  sy += 14;
  ctx.font = '700 9px Arial, sans-serif'; ctx.fillStyle = mutedInk;
  ctx.fillText(`${sequence}   ETNo   ${etNo}`, sx, sy);
  ctx.textAlign = 'right';
  ctx.font = '700 8px Arial, sans-serif';
  ctx.fillText('A STAR ALLIANCE MEMBER ✦', W-20, sy + 16);
  ctx.textAlign = 'left';

  exportCanvas(canvas, `flight-ticket-${(f.trackingNumber||'ticket')}.png`);
}

function roundRect(ctx, x, y, w, h, r){
  const [r1,r2,r3,r4] = Array.isArray(r) ? r : [r,r,r,r];
  ctx.beginPath();
  ctx.moveTo(x+r1, y);
  ctx.lineTo(x+w-r2, y); ctx.arcTo(x+w, y, x+w, y+r2, r2);
  ctx.lineTo(x+w, y+h-r3); ctx.arcTo(x+w, y+h, x+w-r3, y+h, r3);
  ctx.lineTo(x+r4, y+h); ctx.arcTo(x, y+h, x, y+h-r4, r4);
  ctx.lineTo(x, y+r1); ctx.arcTo(x, y, x+r1, y, r1);
  ctx.closePath();
}
function line(ctx, x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function colPositions(startX, endX, weights){
  const total = weights.reduce((a,b)=>a+b,0);
  const gap = 14;
  const usable = (endX - startX) - gap*(weights.length-1);
  let x = startX; const out = [];
  weights.forEach(w=>{ out.push(x); x += usable*(w/total) + gap; });
  return out;
}
function drawFieldRow(ctx, cols, startX, endX, valueY, labelSize, valueSize){
  const weights = cols.length===4 ? [1,1,1,1.25] : cols.map(()=>1);
  const xs = colPositions(startX, endX, weights);
  cols.forEach((c,i)=>{
    ctx.fillStyle = '#423228'; ctx.font = `700 ${labelSize}px Arial, sans-serif`;
    ctx.fillText(c.label, xs[i], valueY - 18);
    ctx.fillStyle = '#2d231d'; ctx.font = `700 ${valueSize}px "IBM Plex Mono", monospace`;
    ctx.fillText(String(c.value), xs[i], valueY);
  });
}
function drawBarcode(ctx, x, y, w, h){
  ctx.save();
  ctx.strokeStyle = 'rgba(79,57,42,.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);
  ctx.fillStyle = 'rgba(79,57,42,.32)';
  let bx = x + 4; let seed = 7;
  while(bx < x + w - 4){
    seed = (seed * 9301 + 49297) % 233280;
    const barW = 1 + (seed % 233280)/233280 * 2.2;
    ctx.fillRect(bx, y+4, barW, h-8);
    bx += barW + 1.6;
  }
  ctx.restore();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(' ');
  let line = '', lineY = y;
  for(let i=0;i<words.length;i++){
    const test = line ? line + ' ' + words[i] : words[i];
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, lineY);
      line = words[i]; lineY += lineHeight;
    } else { line = test; }
  }
  if(line) ctx.fillText(line, x, lineY);
}
function exportCanvas(canvas, filename, successMessage='Ticket image downloaded'){
  canvas.toBlob(blob=>{
    if(!blob){ showToast('Could not create the ticket image', true); return; }
    const url = URL.createObjectURL(blob);
    try{
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast(successMessage);
    }catch(err){
      // Some mobile in-app browsers/WebViews block programmatic downloads.
      // Fall back to opening the image so it can be long-pressed and saved.
      const win = window.open(url, '_blank');
      if(!win){
        const dataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = filename;
        link.href = dataUrl;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }
      showToast('Opened the ticket image — press and hold it to save');
    }
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

async function createShipmentFromWizard(button){
  if(button?.dataset.busy==='1') return;
  if(!currentUser){
    showToast('Please sign in before creating a shipment', true);
    navigate('#/login');
    return;
  }
  const d = wizard.data||{};
  if(wizard.step!==5 || !d.productName || !d.sender || !d.recipient || !d.shipping){
    showToast('Please complete the shipment details before creating it', true);
    return;
  }
  if(button){
    button.dataset.busy='1';
    button.disabled=true;
    button.innerHTML=`${icon('clock')} Creating shipment…`;
    renderIcons(button);
  }
  const tn = generateTrackingNumber();
  const now = new Date().toISOString();
  const shipment = {
    trackingNumber: tn, userId: currentUser.email,
    productName: d.productName, description: d.description||'', category: d.category, quantity: d.quantity||1,
    value: d.value||'', currency: d.currency||'USD', imageUrl: d.imageUrl||null,
    sender: d.sender, recipient: d.recipient, shipping: d.shipping,
    status: d.status||'Order Created',
    createdAt: now, updatedAt: now,
    events: [{
      id:genId(),
      status:d.status||'Order Created',
      location:d.shipping.initialLocation || (d.sender&&d.sender.city)||'',
      routeStopId:d.shipping.initialLocationId || '',
      latitude:d.shipping.latitude,
      longitude:d.shipping.longitude,
      timestamp:now,
      description:'Shipment created'
    }]
  };
  shipmentsDB[tn] = shipment;
  try{
    const saved = await saveShipments();
    if(!saved){
      delete shipmentsDB[tn];
      return;
    }
    wizard = { step:1, data:{} };
    showToast('Shipment created');
    navigate('#/confirmation/'+encodeURIComponent(tn));
  }catch(error){
    delete shipmentsDB[tn];
    console.warn('Shipment creation failed.', error);
    showToast('Could not create the shipment — try again', true);
  }finally{
    if(button && document.body.contains(button)){
      button.dataset.busy='';
      button.disabled=false;
      button.innerHTML=`${icon('check')} Create Shipment`;
      renderIcons(button);
    }
  }
}

async function updateShipmentMovement(tn){
  const s = shipmentsDB[tn];
  if(!s) return;
  if(!currentUser || (s.userId && currentUser.email!==s.userId && !currentUser.isAdmin)){
    showToast('Only the creator can update this shipment', true);
    return;
  }
  const status = $('#shipment_progression')?.value || s.status || 'Order Created';
  const routeStops = shipmentRouteStops(s);
  const selectedStopId = $('#shipment_route_stop')?.value || routeStops[0]?.id || '';
  const selectedStop = findRouteStop(routeStops, selectedStopId);
  const customLocation = $('#shipment_custom_location')?.value.trim();
  const location = selectedStop?.name || customLocation || s.sender?.city || '';
  if(!location){
    showToast('Choose or enter a current movement location', true);
    return;
  }
  const previous = JSON.stringify(s);
  const previousStatus = s.status;
  const timestamp = new Date().toISOString();
  const event = {
    id:genId(),
    status,
    location,
    routeStopId:selectedStopId,
    timestamp,
    description:status!==previousStatus ? 'Shipping progression updated' : 'Shipping movement updated'
  };
  if(Number.isFinite(Number(selectedStop?.latitude)) && Number.isFinite(Number(selectedStop?.longitude))){
    event.latitude = Number(selectedStop.latitude);
    event.longitude = Number(selectedStop.longitude);
  }
  s.events = s.events||[];
  s.events.push(event);
  s.status = status;
  s.updatedAt = timestamp;
  const saved = await saveShipments();
  if(!saved){
    Object.assign(s, JSON.parse(previous));
    return;
  }
  showToast('Shipping movement updated');
  rerenderCurrentPage();
}

function collectWizardStep(){
  const d = wizard.data;
  if(wizard.step===1){
    const name = $('#w_productName').value.trim();
    if(!name){ showToast('Product name is required', true); return false; }
    d.productName = name;
    d.description = $('#w_description').value.trim();
    d.category = $('#w_category').value;
    d.quantity = Number($('#w_quantity').value)||1;
    d.value = $('#w_value').value;
    d.currency = $('#w_currency').value;
    return true;
  }
  if(wizard.step===2){
    const req = ['w_s_fullName','w_s_phone','w_s_email','w_s_address','w_s_city','w_s_country'];
    for(const id of req){ if(!$('#'+id).value.trim()){ showToast('Please complete all required sender fields', true); return false; } }
    d.sender = { fullName:$('#w_s_fullName').value.trim(), phone:$('#w_s_phone').value.trim(), email:$('#w_s_email').value.trim(),
      address:$('#w_s_address').value.trim(), city:$('#w_s_city').value.trim(), state:$('#w_s_state').value.trim(), country:$('#w_s_country').value.trim() };
    return true;
  }
  if(wizard.step===3){
    const req = ['w_r_fullName','w_r_phone','w_r_address','w_r_city','w_r_country'];
    for(const id of req){ if(!$('#'+id).value.trim()){ showToast('Please complete all required recipient fields', true); return false; } }
    d.recipient = { fullName:$('#w_r_fullName').value.trim(), phone:$('#w_r_phone').value.trim(), email:$('#w_r_email').value.trim(),
      address:$('#w_r_address').value.trim(), city:$('#w_r_city').value.trim(), state:$('#w_r_state').value.trim(), country:$('#w_r_country').value.trim() };
    return true;
  }
  if(wizard.step===4){
    const locationLabel = $('#w_sh_location').value.trim();
    if(!locationLabel){ showToast('Choose or enter a starting route location', true); return false; }
    const carrier = $('#w_sh_carrier').value;
    if(!carrier){ showToast('Please select a shipment carrier', true); return false; }
    const latitude = $('#w_sh_latitude').value.trim();
    const longitude = $('#w_sh_longitude').value.trim();
    if(latitude==='' || longitude==='' || Number.isNaN(Number(latitude)) || Number(latitude)<-90 || Number(latitude)>90 || Number.isNaN(Number(longitude)) || Number(longitude)<-180 || Number(longitude)>180){
      showToast('Enter a valid latitude and longitude for the package location', true);
      return false;
    }
    const routeStops = buildRouteStops(d.sender&&d.sender.city, d.recipient&&d.recipient.city);
    const initialLocationId = $('#w_sh_route_stop').value;
    d.shipping = { carrier, method:$('#w_sh_method').value, packageType:$('#w_sh_packageType').value.trim(), weight:$('#w_sh_weight').value,
      dimensions:$('#w_sh_dimensions').value.trim(), fee:$('#w_sh_fee').value, eta:$('#w_sh_eta').value,
      latitude:Number(latitude), longitude:Number(longitude), initialLocation:locationLabel,
      initialLocationId, routeStops };
    d.status = $('#w_status').value;
    return true;
  }
  return true;
}

function openUpdateModal(tn){
  const wrap = document.createElement('div');
  wrap.id='modal-root';
  wrap.innerHTML = updateModalHtml(tn);
  document.body.appendChild(wrap);
  renderIcons(wrap);
  wireRouteStopSelects();
  wireAutomationPanels();
  $('#update-form').dataset.tn = tn;
  $('#update-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const s = shipmentsDB[tn]; if(!s) return;
    const status = $('#u_status').value, location_ = $('#u_location').value.trim(), dt = $('#u_datetime').value, note = $('#u_note').value.trim();
    const latitudeRaw = $('#u_latitude').value.trim(), longitudeRaw = $('#u_longitude').value.trim();
    if(!location_){
      showToast('Choose or enter a current location', true);
      return;
    }
    if((latitudeRaw==='' && longitudeRaw!=='') || (latitudeRaw!=='' && longitudeRaw==='') ||
      (latitudeRaw!=='' && (Number.isNaN(Number(latitudeRaw)) || Number(latitudeRaw)<-90 || Number(latitudeRaw)>90)) ||
      (longitudeRaw!=='' && (Number.isNaN(Number(longitudeRaw)) || Number(longitudeRaw)<-180 || Number(longitudeRaw)>180))){
      showToast('Enter a valid latitude and longitude, or leave both blank', true);
      return;
    }
    const routeStopId = $('#u_route_stop').value;
    s.events = s.events||[];
    const event = { id:genId(), status, location:location_, routeStopId:routeStopId||'', timestamp:new Date(dt).toISOString(), description:note };
    if(latitudeRaw!=='' && longitudeRaw!==''){
      event.latitude = Number(latitudeRaw);
      event.longitude = Number(longitudeRaw);
      s.shipping = s.shipping||{};
      s.shipping.latitude = event.latitude;
      s.shipping.longitude = event.longitude;
    }
    s.shipping = s.shipping||{};
    s.shipping.routeStops = shipmentRouteStops(s);
    s.events.push(event);
    s.status = status;
    s.updatedAt = new Date().toISOString();
    await saveShipments();
    closeModal();
    showToast('Tracking updated');
    rerenderCurrentPage();
  });
}
