<script>
  (() => {
    const firebaseConfig = {
      apiKey: "AIzaSyD9HUq3XpfagPsGByZMbGG_E8T43hAjKFM",
      authDomain: "nbatools-38be3.firebaseapp.com",
      projectId: "nbatools-38be3",
      storageBucket: "nbatools-38be3.firebasestorage.app",
      messagingSenderId: "275083219856",
      appId: "1:275083219856:web:762d3127dd6370ded09915"
    };

    let firestore = null;
    let firebaseStorage = null;
    let firebaseAuth = null;
    let firebaseAppRef = null;
    try{
      firebaseAppRef = firebase.initializeApp(firebaseConfig);
      firestore = firebase.firestore(firebaseAppRef);
      firebaseStorage = firebase.storage(firebaseAppRef);
    }catch(error){
      console.warn('Firebase could not be initialized. The app will use local fallback storage.', error);
    }
    // Auth is set up independently — its persistence layer (IndexedDB/localStorage)
    // can fail under restricted origins (e.g. content:// / file://), and that
    // must never be allowed to block Firestore/Storage or the rest of the app.
    try{
      if(firebaseAppRef) firebaseAuth = firebase.auth(firebaseAppRef);
    }catch(error){
      firebaseAuth = null;
      console.warn('Firebase Auth is not available in this environment. Google sign-in will be disabled.', error);
    }

    // --- Real Google Sign-In via Firebase Auth ---
    window.firebaseAuthHelpers = {
      isReady: !!firebaseAuth,
      async signInWithGoogle(){
        if(!firebaseAuth) throw new Error('Firebase Auth is not initialized');
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        let result;
        try{
          result = await firebaseAuth.signInWithPopup(provider);
        }catch(error){
          // Popups can be blocked on some mobile browsers/webviews — fall back to redirect.
          if(error && (error.code==='auth/popup-blocked' || error.code==='auth/operation-not-supported-in-this-environment')){
            await firebaseAuth.signInWithRedirect(provider);
            return null; // page will reload; result picked up by getRedirectResult on load
          }
          throw error;
        }
        const user = result.user;
        if(!user || !user.email) throw new Error('Google account did not return an email address');
        return {
          email: user.email.trim().toLowerCase(),
          fullName: user.displayName || user.email.split('@')[0],
          photoURL: user.photoURL || '',
          uid: user.uid
        };
      },
      async getRedirectResult(){
        if(!firebaseAuth) return null;
        const result = await firebaseAuth.getRedirectResult();
        const user = result && result.user;
        if(!user || !user.email) return null;
        return {
          email: user.email.trim().toLowerCase(),
          fullName: user.displayName || user.email.split('@')[0],
          photoURL: user.photoURL || '',
          uid: user.uid
        };
      }
    };

    // --- Resilience helpers: never let a network call hang the UI ---
    window.withTimeout = function(promiseLike, ms, message){
      return new Promise((resolve, reject)=>{
        let settled = false;
        const timer = setTimeout(()=>{
          if(settled) return;
          settled = true;
          if(promiseLike && typeof promiseLike.cancel === 'function'){ try{ promiseLike.cancel(); }catch(_e){} }
          reject(new Error(message || 'Request timed out'));
        }, ms);
        Promise.resolve(promiseLike).then(value=>{
          if(settled) return;
          settled = true; clearTimeout(timer); resolve(value);
        }, error=>{
          if(settled) return;
          settled = true; clearTimeout(timer); reject(error);
        });
      });
    };

    // Downscale a data-URL image so uploads stay small and fast.
    window.compressDataUrlImage = function(dataUrl, maxSize, quality){
      return new Promise((resolve)=>{
        try{
          const image = new Image();
          image.onload = ()=>{
            try{
              const scale = Math.min(1, (maxSize||720) / Math.max(image.width, image.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.width * scale));
              canvas.height = Math.max(1, Math.round(image.height * scale));
              const context = canvas.getContext('2d');
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', quality || 0.82));
            }catch(_e){ resolve(dataUrl); }
          };
          image.onerror = ()=>resolve(dataUrl);
          image.src = dataUrl;
        }catch(_e){ resolve(dataUrl); }
      });
    };


    window.firebaseCloud = {
      isReady: !!firestore,
      async getState(key){
        if(!firestore) throw new Error('Firebase Firestore is not initialized');
        const snapshot = await firestore.collection('nbatoolsState').doc(key).get();
        return snapshot.exists && typeof snapshot.data().value === 'string'
          ? { value:snapshot.data().value }
          : null;
      },
      async setState(key, value){
        if(!firestore) throw new Error('Firebase Firestore is not initialized');
        await firestore.collection('nbatoolsState').doc(key).set({
          value,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge:true });
      },
      async saveLicenseDocument(userId, data){
        if(!firestore) throw new Error('Firebase Firestore is not initialized');
        const documentRef = firestore.collection('nbatoolsGeneratedDocuments').doc();
        const payload = { ...data };
        // Portraits are large data URLs. Shrink first, then upload with a hard
        // timeout so a blocked Storage request can never hang the Generate button.
        if(typeof payload.photo === 'string' && payload.photo.startsWith('data:image/')){
          try{ payload.photo = await window.compressDataUrlImage(payload.photo, 720, 0.82); }catch(_e){}
        }
        if(firebaseStorage && typeof payload.photo === 'string' && payload.photo.startsWith('data:image/')){
          const typeMatch = payload.photo.match(/^data:([^;,]+)[;,]/);
          const contentType = typeMatch ? typeMatch[1] : 'image/jpeg';
          const fileRef = firebaseStorage.ref(`nbatools/licenses/${encodeURIComponent(userId)}/${documentRef.id}.jpg`);
          try{
            const uploadTask = fileRef.putString(payload.photo, 'data_url', { contentType });
            const snapshot = await window.withTimeout(uploadTask, 20000, 'Portrait upload timed out');
            payload.photo = await window.withTimeout(snapshot.ref.getDownloadURL(), 15000, 'Portrait URL timed out');
          }catch(uploadError){
            console.warn('Portrait upload failed — saving the card without a hosted photo.', uploadError);
            // Firestore documents cap at ~1MB; drop oversized inline images.
            if(payload.photo.length > 700000) payload.photo = '';
          }
        }
        const createdAt = payload.createdAt || new Date().toISOString();
        await window.withTimeout(documentRef.set({
          userId: String(userId),
          licenseType: payload.licenseType || 'hawaii',
          licenseName: payload.licenseName || 'Hawaii',
          payload,
          createdAt,
          createdAtServer: firebase.firestore.FieldValue.serverTimestamp()
        }), 20000, 'Saving to Cloud Firestore timed out');
        return { id:documentRef.id, data:payload };
      },

      async listLicenseDocuments(userId){
        if(!firestore) throw new Error('Firebase Firestore is not initialized');
        const snapshot = await firestore.collection('nbatoolsGeneratedDocuments')
          .where('userId', '==', String(userId))
          .limit(100)
          .get();
        return snapshot.docs.map(documentSnapshot=>{
          const record = documentSnapshot.data() || {};
          return { id:documentSnapshot.id, ...record };
        }).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
      },
      async getLicenseDocument(documentId, userId){
        if(!firestore) throw new Error('Firebase Firestore is not initialized');
        const snapshot = await firestore.collection('nbatoolsGeneratedDocuments').doc(documentId).get();
        if(!snapshot.exists) return null;
        const record = snapshot.data() || {};
        if(String(record.userId)!==String(userId)) throw new Error('You do not have access to this document');
        return { id:snapshot.id, ...record };
      },
      subscribeShipments(onValue, onError){
        if(!firestore) return ()=>{};
        return firestore.collection('nbatoolsState').doc('shared:nbatools-shipments').onSnapshot(snapshot=>{
          if(!snapshot.exists || typeof snapshot.data().value!=='string') return;
          onValue(snapshot.data().value);
        }, onError);
      },
      async uploadDataUrl(path, dataUrl){
        if(!firebaseStorage) throw new Error('Firebase Storage is not initialized');
        const typeMatch = String(dataUrl).match(/^data:([^;,]+)[;,]/);
        const contentType = typeMatch ? typeMatch[1] : 'image/jpeg';
        const fileRef = firebaseStorage.ref(`nbatools/${path}`);
        const snapshot = await fileRef.putString(dataUrl, 'data_url', { contentType });
        return snapshot.ref.getDownloadURL();
      }
    };
  })();
</script>
<style>

    --warning-light:rgba(227,165,72,0.14);
    --error:#E2636B;
    --error-light:rgba(226,99,107,0.14);

     --app-top-space: 14px;

  html,body{margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{

      radial-gradient(820px 640px at 100% 4%, rgba(102,92,225,0.18), transparent 62%),
      radial-gradient(900px 700px at 48% 108%, rgba(36,174,168,0.13), transparent 64%),
      linear-gradient(135deg,#080A12 0%,#101322 48%,#090B13 100%);

    -moz-osx-font-smoothing:grayscale;

    letter-spacing:.005em;
  }

    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(560px 440px at 14% 18%, rgba(255,255,255,0.08), transparent 68%),
      radial-gradient(680px 520px at 86% 78%, rgba(92,82,226,0.14), transparent 70%);
    filter:blur(42px);
    opacity:.8;
  }
  body::after{
    content:''; position:fixed; inset:-15%; z-index:-2; pointer-events:none;
    background:
      linear-gradient(118deg, rgba(212,175,90,0.08), transparent 34%, rgba(92,82,226,0.10) 72%, transparent),
      radial-gradient(500px 320px at 52% 38%, rgba(255,255,255,0.045), transparent 72%);
    filter:blur(78px);
    opacity:.82;
  }
  h1,h2,h3,h4{font-family:'Playfair Display',serif; margin:0; letter-spacing:-0.012em; font-weight:700;}

  a{color:inherit; text-decoration:none;}

  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  ::selection{background:var(--primary); color:#1a1204;}

  /* Premium scrollbar */
  ::-webkit-scrollbar{width:10px; height:10px;}

  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg, rgba(212,175,90,.45), rgba(212,175,90,.2)); border-radius:99px; border:2px solid transparent; background-clip:padding-box;}

  @keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-14px,18px) scale(1.05);}}

  .hero::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,11,20,0.06) 0%, rgba(10,11,20,0.18) 50%, rgba(5,6,9,0.42) 100%); z-index:1;}
  .hero-grid, .hero-inner{position:relative; z-index:3;}
  .hero::before{
    content:''; position:absolute; inset:0; z-index:2;
    background:
      radial-gradient(560px 340px at 82% 8%, rgba(203,161,53,0.30), transparent 65%),
      radial-gradient(500px 320px at 8% 95%, rgba(203,161,53,0.14), transparent 60%);
    pointer-events:none;
  }
  .hero-grid{position:absolute; inset:0; opacity:0.05; background-image:linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg,#fff 1px, transparent 1px); background-size:52px 52px; mask-image:linear-gradient(to bottom, black, transparent 85%);}
  .hero-inner{position:relative; text-align:center; max-width:760px; margin:0 auto; animation:fadeUp .8s ease both;}
  .eyebrow-route{
    display:inline-flex; align-items:center; gap:10px; font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:#E7CE93;
    margin-bottom:28px; letter-spacing:.14em; text-transform:uppercase;
  }
  .route-dot{width:5px; height:5px; border-radius:50%; background:#E7CE93;}
  .hero h1{font-size:60px; line-height:1.08; font-weight:700; margin-bottom:20px;}
  .hero h1 .accent{color:#E7CE93; font-style:italic;}
  .hero p.sub{font-family:'Inter',sans-serif; font-size:17px; color:#B8BFCF; max-width:520px; margin:0 auto 36px; line-height:1.65; font-weight:300;}
  .hero-ctas{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:56px;}
  .hero-ctas .btn{padding:14px 28px; font-size:13.5px;}

  .track-box{
    max-width:520px; margin:0 auto; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16);
    border-radius:999px; padding:8px; display:flex; gap:8px;
    -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 8px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    transition:box-shadow .3s var(--ease), border-color .3s var(--ease);
  }
  .track-box:focus-within{border-color:var(--primary); box-shadow:0 8px 30px rgba(212,175,90,0.2), 0 0 0 3px var(--primary-light);}
  .track-box .btn{border-radius:999px;}
  .track-box input{
    flex:1; background:transparent; border:none; outline:none; color:#fff; padding:12px 16px;

  /* Brown wood setting from the supplied reference image */

  /* Narrow screens no longer restack the pass: the preview is rendered at a
     fixed 1040px design width and scaled down by fitBoardingPassPreview()
     (same technique as the driver's license live preview), so the horizontal
     boarding-pass layout always fits the screen with no sideways scrolling. */

  /* How it works */
  .section{padding:88px 0;}
  .section-head{text-align:center; max-width:560px; margin:0 auto 52px;}
  .section-head .kicker{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--primary); font-weight:600; letter-spacing:.1em; text-transform:uppercase; display:block; margin-bottom:14px;}
  .section-head h2{font-size:34px; margin-bottom:12px; font-style:italic;}
  .section-head p{color:var(--muted); font-size:15.5px; line-height:1.6; font-weight:300;}

  .steps-rail{position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  .steps-rail::before{content:''; position:absolute; top:27px; left:12%; right:12%; height:2px; background:repeating-linear-gradient(90deg, var(--border) 0 8px, transparent 8px 16px); z-index:0;}
  .step-card{position:relative; z-index:1; text-align:center;}
  .step-num{
    width:56px; height:56px; border-radius:16px; background:var(--card); border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:var(--shadow); color:var(--primary);
  }
  .step-num svg{width:24px; height:24px;}
  .step-card h4{font-size:16px; margin-bottom:6px; font-family:'Inter',sans-serif; font-weight:700;}
  .step-card p{font-size:13.5px; color:var(--muted); line-height:1.5; font-weight:300;}

  /* Cards / generic */
  .card{
    background:var(--card);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
    backdrop-filter:blur(var(--blur)) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
    position:relative;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
    animation:softPop .5s var(--ease) both;
  }
  .card::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(160deg, rgba(255,255,255,0.16), transparent 40%, transparent 70%, rgba(212,175,90,0.1));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    pointer-events:none;
  }
  .card-pad{padding:28px;}

  /* Auth pages */
  .auth-page{flex:1; display:flex; align-items:center; padding:60px 0;}
  .auth-card{padding:36px;}
  .auth-head{text-align:center; margin-bottom:28px;}
  .auth-head .logo-mark{margin:0 auto 16px;}
  .auth-head h2{font-size:25px; margin-bottom:6px; font-style:italic;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:7px; text-transform:uppercase; letter-spacing:.05em;}
  .field .hint{font-size:12px; color:var(--muted); font-weight:400; margin-left:4px; text-transform:none; letter-spacing:0;}
  .field input, .field select, .field textarea{
    width:100%; padding:13px 16px; border:1.5px solid var(--glass-border); border-radius:var(--radius-sm);
    font-size:14.5px; font-family:inherit; letter-spacing:.01em;
    background:rgba(255,255,255,0.04);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    color:var(--ink); outline:none;
    transition:border-color .28s var(--ease), box-shadow .28s var(--ease), background .28s var(--ease), transform .18s var(--ease);
  }
  .field input:hover, .field select:hover, .field textarea:hover{border-color:rgba(212,175,90,0.4);}
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--primary); background:rgba(212,175,90,0.05);
    box-shadow:0 0 0 4px var(--primary-light), 0 6px 20px rgba(212,175,90,0.12);
    transform:translateY(-1px);
  }
  .field input::placeholder, .field textarea::placeholder{color:rgba(154,161,180,0.65);}
  .field textarea{resize:vertical; min-height:80px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-check{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted);}

  .form-error.show{display:block;}
  .auth-foot{text-align:center; margin-top:20px; font-size:13.5px; color:var(--muted);}
  .auth-foot a{color:var(--primary); font-weight:600;}
  .social-login{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
  .social-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    padding:12px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--glass-border);
    background:rgba(255,255,255,0.04); color:var(--ink); font-size:14px; font-weight:600;
    cursor:pointer; transition:border-color .25s var(--ease), background .25s var(--ease), transform .2s var(--ease), box-shadow .25s var(--ease);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .social-btn svg{width:18px; height:18px; flex-shrink:0;}
  .social-btn:hover{border-color:rgba(212,175,90,0.45); background:rgba(212,175,90,0.06); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.18);}
  .social-btn:active{transform:translateY(0);}
  .auth-divider{display:flex; align-items:center; gap:14px; margin-bottom:22px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em;}
  .auth-divider::before, .auth-divider::after{content:''; flex:1; height:1px; background:var(--border);}
  .between{display:flex; justify-content:space-between; align-items:center;}

  /* Dashboard */
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; margin:40px 0 28px; flex-wrap:wrap; gap:16px;}
  .page-head h1{font-size:30px; font-style:italic;}
  .page-head .greet{color:var(--muted); font-size:14px; margin-top:4px; font-weight:300;}
  .creation-cta-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:32px;}
  .creation-cta{
    display:flex; align-items:center; gap:16px; min-height:118px; padding:22px 24px;
    border:1px solid var(--glass-border); border-radius:var(--radius-lg); color:var(--ink);
    -webkit-backdrop-filter:blur(var(--blur)); backdrop-filter:blur(var(--blur));
    box-shadow:var(--shadow); transition:transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
  }
  .creation-cta:hover{transform:translateY(-5px) scale(1.01); border-color:rgba(212,175,90,.6); box-shadow:var(--shadow-lift), var(--shadow-glow);}
  .creation-cta .cta-icon{width:46px; height:46px; flex:0 0 46px; display:flex; align-items:center; justify-content:center; border-radius:15px; color:#1a1204; background:linear-gradient(145deg,var(--primary),var(--primary-dark)); box-shadow:0 6px 16px rgba(212,175,90,0.3); transition:transform .35s var(--ease);}
  .creation-cta:hover .cta-icon{transform:rotate(-8deg) scale(1.08);}
  .creation-cta .cta-icon svg{width:22px; height:22px;}
  .creation-cta .cta-copy{min-width:0;}
  .creation-cta .cta-kicker{display:block; color:var(--muted); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:7px; font-weight:600;}
  .creation-cta .cta-title{display:block; font-family:'Inter',sans-serif; font-size:14px; line-height:1.35; font-weight:800; letter-spacing:.035em;}
  .creation-cta .cta-arrow{margin-left:auto; color:var(--primary); flex:0 0 auto;}
  .creation-cta .cta-arrow svg{width:18px; height:18px;}
  .creation-cta.flight-cta{background:linear-gradient(125deg,rgba(203,161,53,.16),rgba(22,25,35,.7));}
  .creation-cta.shipping-cta{background:linear-gradient(125deg,rgba(76,174,125,.13),rgba(22,25,35,.7));}
  .creation-cta.document-cta{background:linear-gradient(125deg,rgba(92,130,226,.16),rgba(22,25,35,.7));}
  .creation-cta.receipt-cta{background:linear-gradient(125deg,rgba(188,116,210,.16),rgba(22,25,35,.7));}
  .creation-cta.id-card-creation-cta{background:linear-gradient(125deg,rgba(210,116,174,.18),rgba(22,25,35,.7));}
  .creation-cta.id-card-creation-cta .cta-icon{background:#c86ca7;}
  .creation-cta .cta-meta{display:block; margin-top:8px; color:var(--muted); font-size:11.5px; line-height:1.45; font-weight:400;}
  .history-cta-grid{grid-template-columns:repeat(3,minmax(0,1fr)); margin-bottom:0;}
  .history-cta{min-height:128px;}
  .history-cta .cta-title{font-size:13px;}
  .history-cta .cta-count{display:block; margin-top:8px; color:var(--primary); font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.02em;}
  .history-cta.flight-history-cta{background:linear-gradient(125deg,rgba(203,161,53,.16),rgba(22,25,35,.7));}
  .history-cta.shipment-history-cta{background:linear-gradient(125deg,rgba(76,174,125,.13),rgba(22,25,35,.7));}
  .history-cta.license-history-cta{background:linear-gradient(125deg,rgba(210,116,174,.18),rgba(22,25,35,.7));}
  .grouped-history-panel{margin-bottom:24px;}
  .grouped-history-intro{margin-top:5px; color:var(--muted); font-size:12px; line-height:1.5;}
  @media (max-width:980px){ .history-cta-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:620px){ .history-cta-grid{grid-template-columns:1fr;} }
  .creation-section{margin:0 0 18px; padding:22px; border:1px solid var(--glass-border); border-radius:22px; background:rgba(255,255,255,.035);}
  .creation-section-header{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:16px;}
  .creation-section-header h2{font-family:'Inter',sans-serif; font-size:18px; letter-spacing:-.02em;}
  .creation-section-header p{max-width:620px; margin-top:5px; color:var(--muted); font-size:12px; line-height:1.5;}
  .id-card-cta-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  .id-card-cta{display:flex; align-items:center; gap:12px; min-width:0; min-height:92px; padding:15px; border:1px solid var(--glass-border); border-radius:16px; color:var(--ink); background:rgba(255,255,255,.035); transition:transform .25s var(--ease),border-color .25s var(--ease),background .25s var(--ease);}
  .id-card-cta:hover{transform:translateY(-3px); border-color:rgba(212,175,90,.62); background:rgba(212,175,90,.08);}
  .id-card-cta .cta-icon{width:38px; height:38px; flex:0 0 38px; display:flex; align-items:center; justify-content:center; border-radius:12px; color:#1a1204; background:linear-gradient(145deg,var(--primary),var(--primary-dark));}
  .id-card-cta .cta-icon svg{width:19px; height:19px;}
  .id-card-cta .cta-copy{min-width:0;}
  .id-card-cta .cta-kicker{display:block; color:var(--muted); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:5px; font-weight:600;}
  .id-card-cta .cta-title{display:block; font-family:'Inter',sans-serif; font-size:12px; line-height:1.35; font-weight:800; letter-spacing:.02em;}
  .id-card-cta .cta-arrow{margin-left:auto; color:var(--primary); flex:0 0 auto;}
  .id-card-cta .cta-arrow svg{width:16px; height:16px;}
  .creation-placeholder{text-align:center; max-width:760px; margin:0 auto;}
  .creation-placeholder .cta-icon{width:58px; height:58px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; border-radius:18px; color:#1a1204; background:linear-gradient(145deg,var(--primary),var(--primary-dark));}
  .creation-placeholder .cta-icon svg{width:27px; height:27px;}
  .creation-placeholder h2{font-family:'Inter',sans-serif; font-size:22px; margin-bottom:8px;}
  .creation-placeholder p{max-width:560px; margin:0 auto 22px; color:var(--muted); font-size:13px; line-height:1.65;}
  @media (max-width:720px){ .creation-cta-grid{grid-template-columns:1fr;} .id-card-cta-grid{grid-template-columns:1fr;} .creation-section{padding:16px;} .creation-section-header{align-items:flex-start; flex-direction:column;} }
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px;}
  .stat-card{padding:22px; display:flex; flex-direction:column; gap:10px;}
  .stat-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift);}
  .stat-card .top{display:flex; justify-content:space-between; align-items:flex-start;}
  .stat-icon{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; transition:transform .35s var(--ease);}
  .stat-card:hover .stat-icon{transform:scale(1.12) rotate(-6deg);}
  .stat-icon svg{width:18px; height:18px;}
  .stat-val{font-family:'Playfair Display',serif; font-size:32px; font-weight:700; background:linear-gradient(120deg,var(--ink),var(--primary) 60%,var(--ink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; background-size:200% auto;}
  .stat-label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}

  .section-title-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .section-title-row h3{font-size:18px; font-family:'Inter',sans-serif; font-weight:700;}

  .shipment-table{width:100%; border-collapse:collapse;}
  .shipment-table th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:0 16px 10px; font-weight:600;}
  .shipment-table td{padding:14px 16px; border-top:1px solid var(--border); font-size:14px; vertical-align:middle;}
  .shipment-table tr:hover td{background:rgba(255,255,255,0.02);}
  .prod-cell{display:flex; align-items:center; gap:12px;}
  .prod-thumb{width:42px; height:42px; border-radius:13px; object-fit:cover; background:rgba(255,255,255,0.05); flex-shrink:0; border:1px solid var(--glass-border);}
  .prod-thumb-fallback{width:42px; height:42px; border-radius:13px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0;}
  .prod-thumb-fallback svg{width:18px; height:18px;}
  .badge{display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; text-transform:uppercase; letter-spacing:.05em; border:1px solid rgba(255,255,255,0.08);}
  .badge svg{width:11px; height:11px;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .empty-state{text-align:center; padding:64px 24px; color:var(--muted);}
  .empty-state svg{width:40px; height:40px; margin-bottom:14px; color:#3D4356;}
  .empty-state h4{color:var(--ink); font-size:16px; margin-bottom:6px; font-family:'Inter',sans-serif;}
  .empty-state p{font-size:14px; margin-bottom:20px; font-weight:300;}

  .cards-mobile{display:none; flex-direction:column; gap:12px;}
  .ship-card{padding:16px; display:flex; flex-direction:column; gap:12px;}
  .ship-card .top{display:flex; gap:12px; align-items:center;}
  .ship-card .meta{flex:1; min-width:0;}
  .ship-card .meta h4{font-size:14.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:'Inter',sans-serif;}
  .ship-card .meta .tn{font-size:12px; color:var(--muted);}
  .ship-card .rows{display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--border); padding-top:12px;}
  .ship-card .rows b{color:var(--ink); font-weight:600; display:block; font-size:13px;}

  /* Wizard */
  .wizard-wrap{max-width:760px; margin:40px auto 80px;}
  .wizard-steps{display:flex; justify-content:space-between; margin-bottom:32px; position:relative;}
  .wizard-steps::before{content:''; position:absolute; top:17px; left:0; right:0; height:2px; background:var(--border); z-index:0;}
  .wstep{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; flex:1;}
  .wstep .dot{width:34px; height:34px; border-radius:50%; background:var(--bg); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:13px; color:var(--muted); transition:.15s;}
  .wstep.done .dot{background:var(--success); border-color:var(--success); color:#fff;}
  .wstep.active .dot{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 0 0 5px var(--primary-light);}
  .wstep span.lbl{font-size:11px; color:var(--muted); font-weight:600; text-align:center; text-transform:uppercase; letter-spacing:.03em;}
  .wstep.active span.lbl{color:var(--ink);}
  .wizard-card{padding:32px;}
  .wizard-card h3{font-size:20px; margin-bottom:4px; font-style:italic;}
  .wizard-card .desc{color:var(--muted); font-size:14px; margin-bottom:24px; font-weight:300;}
  .wizard-nav{display:flex; justify-content:space-between; margin-top:28px; padding-top:24px; border-top:1px solid var(--border);}

  .upload-zone{
    border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:28px; text-align:center;
    cursor:pointer; transition:.15s; background:rgba(255,255,255,0.02);
  }
  .upload-zone:hover{border-color:var(--primary); background:var(--primary-light);}
  .upload-zone svg{width:26px; height:26px; color:var(--muted); margin-bottom:10px;}
  .upload-zone p{font-size:13.5px; color:var(--muted); font-weight:300;}
  .upload-zone p b{color:var(--ink);}
  .preview-wrap{position:relative; display:inline-block;}
  .preview-wrap img{width:100%; max-width:280px; border-radius:var(--radius-md); border:1px solid var(--border); display:block;}
  .preview-remove{position:absolute; top:-8px; right:-8px; width:28px; height:28px; border-radius:50%; background:var(--error); color:#fff; border:2px solid var(--bg); display:flex; align-items:center; justify-content:center;}
  .preview-remove svg{width:14px; height:14px;}

  .review-block{margin-bottom:20px;}
  .review-block h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--primary); margin-bottom:10px; display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .review-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; font-size:14px;}
  .review-grid .k{color:var(--muted); font-size:12px;}
  .review-grid .v{font-weight:500;}

  /* Confirmation */
  .confirm-wrap{max-width:520px; margin:56px auto 80px; text-align:center;}
  .confirm-check{width:66px; height:66px; border-radius:50%; background:var(--success-light); color:var(--success); display:flex; align-items:center; justify-content:center; margin:0 auto 20px;}
  .confirm-check svg{width:32px; height:32px;}
  .confirm-wrap h2{font-size:26px; margin-bottom:8px; font-style:italic;}
  .confirm-wrap p.sub{color:var(--muted); margin-bottom:32px; font-weight:300;}
  .stub{background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-lift); overflow:hidden; text-align:left;}
  .stub-top{padding:24px 26px; display:flex; gap:14px; align-items:center;}
  .stub-top img{width:56px; height:56px; border-radius:12px; object-fit:cover; border:1px solid var(--border);}
  .stub-top .fallback{width:56px; height:56px; border-radius:12px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .stub-top h4{font-size:16px; margin-bottom:4px; font-family:'Inter',sans-serif;}
  .stub-top .tn{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--primary); font-weight:600;}
  .stub-perf{
    position:relative; height:0; border-top:2px dashed var(--border); margin:0 0;
  }
  .stub-perf::before, .stub-perf::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%; background:var(--bg);
  }
  .stub-perf::before{left:-11px;}
  .stub-perf::after{right:-11px;}
  .stub-bottom{padding:22px 26px 26px;}
  .stub-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .stub-actions .btn{width:100%;}
  .stub-actions-full{margin-top:10px;}
  .link-row{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:16px;}
  .link-row .lk{flex:1; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .share-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}

  /* Tracking page */
  .track-hero{background:var(--dark); color:#fff; padding:48px 0 44px;}
  .track-search-inline{max-width:480px; margin:0 auto;}
  .track-summary{max-width:820px; width:100%; min-width:0; box-sizing:border-box; margin:-40px auto 0; padding:0 24px 60px;}
  .track-summary > *{min-width:0;}
  .summary-card{padding:28px; margin-bottom:24px;}
  .summary-top{display:flex; gap:18px; align-items:center; margin-bottom:22px; flex-wrap:wrap;}
  .summary-top img{width:72px; height:72px; border-radius:14px; object-fit:cover; border:1px solid var(--border);}
  .summary-top .fallback{width:72px; height:72px; border-radius:14px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .summary-top h2{font-size:21px; margin-bottom:6px; font-style:italic;}
  .summary-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding-top:20px; border-top:1px solid var(--border);}
  .summary-grid .item .k{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:5px; display:flex; align-items:center; gap:5px;}
  .summary-grid .item .k svg{width:12px; height:12px;}
  .summary-grid .item .v{font-size:14px; font-weight:600;}
  .tracking-map-card{margin-bottom:24px;}
  .tracking-map{height:320px; width:100%; border-radius:14px; overflow:hidden; border:1px solid var(--border); background:#dbe5ef;}
  .tracking-map .leaflet-control-attribution{font-size:10px;}
  .tracking-map-note{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; color:var(--muted); font-size:13px;}
  .tracking-map-note strong{color:var(--ink); font-weight:600;}
  .tracking-map-empty{padding:34px 20px; border:1px dashed var(--border); border-radius:14px; color:var(--muted); text-align:center; font-size:13px;}
  .route-map-layout{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:18px; align-items:stretch;}
  .route-map{height:340px;}
  .route-stop-list{border:1px solid var(--border); border-radius:14px; padding:8px; background:rgba(255,255,255,0.025); overflow:auto; max-height:340px;}
  .route-stop-row{display:flex; gap:10px; align-items:flex-start; padding:11px 10px; border-radius:10px; color:var(--muted); font-size:12px; line-height:1.35;}
  .route-stop-row.current{background:var(--primary-light); color:var(--ink);}
  .route-stop-marker{width:22px; height:22px; flex:0 0 22px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font:600 10px 'IBM Plex Mono',monospace; color:var(--muted);}
  .route-stop-row.current .route-stop-marker{background:var(--primary); border-color:var(--primary); color:#191207;}
  .route-stop-name{font-weight:600; color:inherit;}
  .route-stop-kind{display:block; margin-top:2px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.72;}
  .automation-panel{margin-top:22px; padding:18px; border:1px solid rgba(212,175,90,.25); border-radius:14px; background:linear-gradient(135deg,rgba(212,175,90,.08),rgba(255,255,255,.025));}
  .automation-panel h4{display:flex; align-items:center; gap:8px; margin:0 0 5px; font-size:14px;}
  .automation-panel h4 svg{width:16px; height:16px; color:var(--primary);}
  .automation-intro{margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.5;}
  .automation-summary{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px;}
  .automation-stat{padding:10px 11px; border:1px solid var(--border); border-radius:10px; background:rgba(0,0,0,.12);}
  .automation-stat .k{display:block; margin-bottom:4px; color:var(--muted); font:600 9px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase;}
  .automation-stat .v{display:block; color:var(--ink); font-size:12px; font-weight:600; line-height:1.35;}
  .automation-status{display:flex; align-items:flex-start; gap:8px; margin-top:12px; color:var(--muted); font-size:12px; line-height:1.45;}
  .automation-status svg{width:15px; height:15px; flex:0 0 15px; margin-top:1px; color:var(--primary);}
  .automation-status.is-ready{color:var(--success);}
  .automation-status.is-error{color:var(--error);}
  .automation-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .automation-actions .btn{margin-top:0;}
  .automation-paused{display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border:1px solid var(--warning); border-radius:999px; color:var(--warning); font:600 10px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.04em;}
  @media (max-width:680px){ .automation-summary{grid-template-columns:1fr;} }
  .tracking-standalone-header{height:62px; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:0 24px; background:rgba(10,11,18,0.9); border-bottom:1px solid var(--glass-border);}
  .tracking-standalone-header .brand{font-size:18px;}
  .tracking-standalone-header .brand svg{width:16px; height:16px; color:var(--primary);}
  .tracking-standalone-label{font:600 10px 'IBM Plex Mono',monospace; color:var(--muted); text-transform:uppercase; letter-spacing:.12em;}
  .tracking-standalone-nav{display:flex; align-items:center; gap:22px;}
  .tracking-standalone-nav a{color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; transition:color .2s;}
  .tracking-standalone-nav a:hover{color:var(--ink);}
  .tracking-standalone-footer{margin-top:10px; padding:44px 24px 24px; background:#090A10; border-top:1px solid var(--glass-border);}
  .tracking-standalone-footer-inner{max-width:820px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,360px); gap:34px; align-items:start;}
  .tracking-standalone-footer h3{font-size:19px; margin-bottom:9px;}
  .tracking-standalone-footer p{color:var(--muted); font-size:13px; line-height:1.65; margin:0;}
  .tracking-standalone-search{padding:18px; border:1px solid var(--glass-border); border-radius:14px; background:rgba(255,255,255,0.03);}
  .tracking-standalone-search label{display:block; margin-bottom:9px; color:var(--ink); font-size:12px; font-weight:700;}
  .tracking-standalone-search-form{display:flex; gap:8px;}
  .tracking-standalone-search-form input{min-width:0; flex:1; padding:11px 12px; border:1px solid var(--border); border-radius:9px; background:rgba(0,0,0,.18); color:var(--ink); font:600 12px 'IBM Plex Mono',monospace;}
  .tracking-standalone-search-form input:focus{outline:none; border-color:var(--primary);}
  .tracking-standalone-search-form button{white-space:nowrap;}
  .tracking-standalone-footer-bottom{max-width:820px; margin:32px auto 0; padding-top:16px; border-top:1px solid var(--glass-border); display:flex; justify-content:space-between; gap:12px; color:var(--muted); font:10px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.04em;}
  @media (max-width:680px){ .tracking-standalone-footer-inner{grid-template-columns:1fr;} .tracking-standalone-footer-bottom{flex-direction:column;} }
  .flight-overview-card{margin-bottom:24px;}
  .flight-overview-card .summary-top{margin-bottom:0;}
  .flight-overview-card .summary-top h2{font-style:normal;}
  .flight-airline{font:600 12px 'IBM Plex Mono',monospace; color:var(--primary); text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px;}
  @media (max-width:760px){ .route-map-layout{grid-template-columns:1fr;} .route-stop-list{max-height:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:520px){ .tracking-map{height:260px;} .route-map{height:260px;} .tracking-map-note{align-items:flex-start; flex-direction:column; gap:4px;} .route-stop-list{grid-template-columns:1fr;} }

  .timeline-rail{display:flex; justify-content:space-between; position:relative; padding:10px 6px 0; margin-bottom:8px;}
  .timeline-rail::before{content:''; position:absolute; top:23px; left:24px; right:24px; height:3px; background:var(--border); border-radius:2px; z-index:0;}
  .timeline-rail .fill{position:absolute; top:23px; left:24px; height:3px; background:var(--success); border-radius:2px; z-index:1; transition:width .4s ease;}
  .tstep{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:8px; flex:1;}
  .tstep .dot{width:26px; height:26px; border-radius:50%; background:var(--bg); border:2.5px solid var(--border); display:flex; align-items:center; justify-content:center; color:transparent;}
  .tstep .dot svg{width:13px; height:13px; color:#fff;}
  .tstep.complete .dot{background:var(--success); border-color:var(--success);}
  .tstep.active .dot{background:var(--primary); border-color:var(--primary); box-shadow:0 0 0 5px var(--primary-light);}
  .tstep.active .dot .pulse{width:8px; height:8px; border-radius:50%; background:#fff;}
  .tstep span.lbl{font-size:10.5px; text-align:center; color:var(--muted); font-weight:600; max-width:76px; line-height:1.3; text-transform:uppercase; letter-spacing:.02em;}
  .tstep.complete span.lbl, .tstep.active span.lbl{color:var(--ink);}

  .exception-banner{display:flex; gap:10px; align-items:flex-start; background:var(--error-light); color:var(--error); padding:14px 16px; border-radius:var(--radius-sm); font-size:13.5px; margin-top:18px;}
  .exception-banner svg{width:18px; height:18px; flex-shrink:0; margin-top:1px;}

  .events-list{display:flex; flex-direction:column;}
  .event-item{display:flex; gap:16px; padding:16px 0; position:relative;}
  .event-item:not(:last-child){border-bottom:1px solid var(--border);}
  .event-dot-col{display:flex; flex-direction:column; align-items:center; padding-top:3px;}
  .event-dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
  .event-content{flex:1;}
  .event-status{font-size:14.5px; font-weight:600; margin-bottom:3px; font-family:'Inter',sans-serif;}
  .event-loc{font-size:13px; color:var(--muted); margin-bottom:3px; display:flex; align-items:center; gap:5px;}
  .event-loc svg{width:12px; height:12px;}
  .event-time{font-size:11.5px; color:#6E7789; font-family:'IBM Plex Mono',monospace;}
  .event-note{font-size:13px; color:var(--muted); margin-top:4px; font-style:italic;}

  .update-panel{padding:22px 26px;}
  .not-found{text-align:center; padding:70px 24px;}
  .not-found svg{width:44px; height:44px; color:#3D4356; margin-bottom:16px;}

  /* Modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(5,6,9,0.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; animation:softPop .25s var(--ease) both;}
  .modal-box{
    background:rgba(24,26,38,0.75);
    -webkit-backdrop-filter:blur(28px) saturate(160%); backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--glass-border); border-radius:var(--radius-xl); max-width:440px; width:100%; padding:28px;
    box-shadow:var(--shadow-lift); animation:softPop .35s var(--ease) both;
  }
  .modal-box h3{font-size:18px; margin-bottom:10px; font-style:italic;}
  .modal-box p{color:var(--muted); font-size:14px; margin-bottom:20px; line-height:1.5; font-weight:300;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(8px); background:rgba(24,26,38,0.8); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%); border:1px solid var(--glass-border); color:var(--ink); padding:13px 22px; border-radius:999px; font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:8px; z-index:200; box-shadow:var(--shadow-lift); opacity:0; transition:opacity .35s var(--ease), transform .35s var(--ease);}
  .toast svg{width:15px; height:15px; color:var(--success);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Admin */
  .admin-tabs{display:flex; gap:6px; margin-bottom:24px; border-bottom:1px solid var(--border);}
  .admin-tab{padding:11px 16px; font-size:13px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; text-transform:uppercase; letter-spacing:.03em;}
  .admin-tab.active{color:var(--primary); border-color:var(--primary);}
  .search-input-wrap{position:relative; max-width:340px; margin-bottom:18px;}
  .search-input-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted);}
  .search-input-wrap input{padding-left:38px;}

  /* Accent dot on headings, Geuz-style "Title." */
  .page-head h1::after, .auth-head h2::after, .confirm-wrap h2::after, .wizard-card h3::after{content:'.'; color:var(--primary);}

  /* Split / color-block section — mirrors the template's table-box about layout */
  .split-box{display:flex; min-height:420px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .split-cell{position:relative; flex:1; overflow:hidden; display:flex; flex-direction:column; justify-content:center; padding:52px 44px;}
  .split-cell + .split-cell{border-left:1px solid var(--border);}
  .split-cell.icon-panel{flex:0 0 18%; background:var(--dark); align-items:center; justify-content:center;}
  .split-cell.icon-panel svg{width:46px; height:46px; color:var(--primary); stroke-width:1.2;}
  .split-cell.indigo-panel{flex:0 0 36%; background:transparent; display:flex; align-items:center; justify-content:center; padding:28px;}
  .split-cell.indigo-panel .lux-card{position:relative; width:100%; max-width:440px; padding:42px 38px; border-radius:28px; overflow:hidden; background:linear-gradient(160deg, rgba(212,175,90,0.16), rgba(255,255,255,0.03)); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); border:1px solid rgba(212,175,90,0.32); box-shadow:0 32px 90px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12), 0 0 60px rgba(212,175,90,0.14); color:var(--ink);}
  .split-cell.indigo-panel .lux-card::before{content:''; position:absolute; inset:0; border-radius:28px; padding:1px; background:linear-gradient(160deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.02) 50%, rgba(212,175,90,0.25) 100%); -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;}
  .split-cell.indigo-panel .lux-card .sub{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--primary); margin-bottom:18px; display:block;}
  .split-cell.indigo-panel .lux-card h3{font-family:'Playfair Display',serif; font-size:30px; line-height:1.18; margin-bottom:18px; color:var(--ink); font-weight:700;}
  .split-cell.indigo-panel .lux-card p{font-size:15px; line-height:1.75; color:rgba(243,241,234,0.78); font-weight:500;}
  .split-cell.dark-panel{flex:1; background:var(--card); align-items:flex-start;}
  .split-cell.dark-panel .sub{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--primary); margin-bottom:14px;}
  .split-cell.dark-panel h2{font-size:32px; line-height:1.2; max-width:380px;}
  .split-cell.dark-panel h2 em{color:var(--primary); font-style:italic;}
  .big-icon-bg{position:absolute; right:-20px; bottom:-40px; font-size:220px; line-height:1; opacity:0.05; pointer-events:none;}
  .big-icon-bg svg{width:220px; height:220px;}

  @media (max-width:860px){
    .split-box{flex-direction:column; min-height:0;}
    .split-cell.icon-panel{flex:0 0 100px;}
    .split-cell.indigo-panel, .split-cell.dark-panel{flex:auto; padding:28px 22px;}
    .split-cell.indigo-panel .lux-card{padding:34px 26px; border-radius:24px;}
    .split-cell.indigo-panel .lux-card h3{font-size:26px;}
    .split-cell.indigo-panel .lux-card p{font-size:14.5px;}
    .split-cell + .split-cell{border-left:none; border-top:1px solid var(--border);}
  }

  /* Portfolio-style hover tiles — mirrors the template's works grid */
  .tile-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  .tile{position:relative; background:var(--bg); aspect-ratio:1; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .tile-num{position:absolute; top:16px; left:18px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:.05em; z-index:2;}
  .tile-icon{color:var(--ink); transition:transform .35s ease, opacity .35s ease; z-index:1;}
  .tile-icon svg{width:34px; height:34px; stroke-width:1.4;}
  .tile-mask{position:absolute; inset:0; background:var(--primary); transform:translateY(100%); transition:transform .4s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; justify-content:flex-end; padding:22px; z-index:2;}
  .tile-mask h4{color:#fff; font-family:'Inter',sans-serif; font-size:15px; margin-bottom:6px;}
  .tile-mask p{color:rgba(255,255,255,0.85); font-size:12.5px; line-height:1.5; font-weight:300;}
  .tile:hover .tile-icon{opacity:0; transform:scale(.7);}
  .tile:hover .tile-mask{transform:translateY(0);}
  @media (max-width:860px){ .tile-grid{grid-template-columns:repeat(2,1fr);} }

  /* Footer — multi-column, mirrors the template's dark footer treatment */
  .site-footer{background:var(--dark); border-top:1px solid var(--border); padding:64px 0 0; margin-top:auto; position:relative;}
  .footer-grid{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:32px; padding-bottom:44px;}
  .footer-col .brand{font-size:18px; margin-bottom:14px;}
  .footer-col p.blurb{font-size:13.5px; color:var(--muted); line-height:1.7; max-width:280px; font-weight:300;}
  .footer-col h5{position:relative; display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:18px; font-weight:600; padding-bottom:9px;}
  .footer-col h5::after{content:''; position:absolute; left:0; bottom:0; height:1.5px; width:22px; background:linear-gradient(90deg,var(--primary),transparent); transition:width .6s cubic-bezier(.22,1,.36,1) .1s;}
  .footer-col.reveal.in h5::after{width:100%;}
  .footer-col a{position:relative; display:block; width:fit-content; font-size:13.5px; color:#B8BFCF; margin-bottom:11px; transition:color .3s var(--ease), transform .3s var(--ease);}
  .footer-col a::after{content:''; position:absolute; left:0; right:100%; bottom:-1px; height:1px; background:var(--primary); transition:right .3s cubic-bezier(.4,0,.2,1);}
  .footer-col a:hover{color:var(--primary); transform:translateX(4px);}
  .footer-col a:hover::after{right:0;}
  .footer-social{display:flex; align-items:center; gap:10px; margin-top:18px;}
  .footer-social a{display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:var(--glass); border:1px solid var(--border); color:var(--ink); margin-bottom:0; transition:background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);}
  .footer-social a::after{display:none;}
  .footer-social a:hover{background:var(--primary); color:#1a1204; border-color:var(--primary); transform:translateY(-3px) scale(1.06); box-shadow:0 8px 20px rgba(212,175,90,0.3);}
  .footer-social a svg{width:15px; height:15px;}
  .footer-contact-line{display:flex; align-items:flex-start; gap:9px; font-size:13.5px; color:#B8BFCF; line-height:1.6; margin-bottom:13px; transition:transform .3s var(--ease), color .3s var(--ease);}
  .footer-contact-line:hover{color:var(--ink); transform:translateX(3px);}
  .footer-contact-line svg{width:15px; height:15px; flex-shrink:0; margin-top:2px; color:var(--primary); transition:transform .3s var(--ease);}
  .footer-contact-line:hover svg{transform:scale(1.15);}
  .footer-bottom{display:flex; justify-content:space-between; align-items:center; text-align:center; flex-wrap:wrap; gap:6px 12px; border-top:1px solid var(--border); padding:20px 0; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);}
  .footer-bottom a{color:var(--muted); transition:color .3s var(--ease);}
  .footer-bottom a:hover{color:var(--primary);}
  .footer-scroll-top{
    position:absolute; right:24px; bottom:20px; width:42px; height:42px; border-radius:50%;
    background:var(--card-solid); border:1px solid var(--primary); color:var(--primary);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s;
  }
  .footer-scroll-top svg{width:17px; height:17px;}
  .footer-scroll-top:hover{background:var(--primary); color:#1a1204; transform:translateY(-3px); box-shadow:0 8px 22px rgba(212,175,90,0.35);}

  /* Premium text entrance — footer columns slide in from the left, line by line */
  .reveal-up{transform:translateY(22px);}
  .footer-col.reveal{opacity:1 !important; transform:none !important; transition:none !important;}
  .footer-col.reveal > *{opacity:0; transform:translateX(-34px); transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);}
  .footer-col.reveal.in > *{opacity:1; transform:none;}
  .footer-col.reveal > *:nth-child(1){transition-delay:.05s;}
  .footer-col.reveal > *:nth-child(2){transition-delay:.12s;}
  .footer-col.reveal > *:nth-child(3){transition-delay:.19s;}
  .footer-col.reveal > *:nth-child(4){transition-delay:.26s;}
  .footer-col.reveal > *:nth-child(5){transition-delay:.33s;}
  .footer-col.reveal > *:nth-child(6){transition-delay:.40s;}
  .footer-col.reveal.in .footer-social{transition-delay:.26s;}
  .footer-col.reveal .footer-social > a{opacity:0; transform:translateX(-24px);}
  .footer-col.reveal.in .footer-social > a{opacity:1; transform:none;}
  .footer-col.reveal .footer-social > a:nth-child(1){transition-delay:.30s;}
  .footer-col.reveal .footer-social > a:nth-child(2){transition-delay:.37s;}
  .footer-col.reveal .footer-social > a:nth-child(3){transition-delay:.44s;}

  @media (max-width:680px){ .footer-bottom{flex-direction:column; gap:6px;} .footer-scroll-top{right:16px; bottom:16px;} }
  @media (max-width:860px){ .footer-grid{grid-template-columns:1fr 1fr; row-gap:32px;} .footer-col-about{grid-column:1 / -1;} }
  @media (max-width:560px){ .footer-grid{grid-template-columns:1fr;} }

  @keyframes fadeUp{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);}}

  @media (max-width:860px){
    .hero{padding:64px 0 90px;}
    .hero h1{font-size:38px;}
    .hero p.sub{font-size:16px;}
    .steps-rail{grid-template-columns:1fr 1fr; row-gap:32px;}
    .steps-rail::before{display:none;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .field-row{grid-template-columns:1fr;}
    .review-grid{grid-template-columns:1fr;}
    .shipment-table{display:none;}
    .cards-mobile{display:flex;}
    .summary-grid{grid-template-columns:1fr 1fr;}
    .tstep span.lbl{display:none;}
    .wstep span.lbl{display:none;}
    .stub-actions{grid-template-columns:1fr;}
  }
  @media (max-width:520px){
    .stat-grid{grid-template-columns:1fr 1fr;}
    .hero h1{font-size:32px;}
  }

  /* ================= PREMIUM LANDING ADDITIONS ================= */

  /* Feature rows — "We are the analytics minds" */
  .feature-row{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; padding:64px 0;}
  .feature-row + .feature-row{border-top:1px solid var(--border);}
  .feature-row.rev .f-copy{order:2;}
  .feature-row.rev .f-visual{order:1;}
  .f-icon{width:46px; height:46px; border-radius:12px; background:var(--primary-light); border:1px solid rgba(203,161,53,0.35); display:flex; align-items:center; justify-content:center; margin-bottom:20px;}
  .f-icon svg{width:20px; height:20px; stroke:var(--primary);}
  .f-copy h3{font-size:26px; margin-bottom:12px; font-style:italic;}
  .f-copy p{color:var(--muted); font-size:15px; line-height:1.7; margin-bottom:20px; font-weight:300;}
  .f-link{display:inline-flex; align-items:center; gap:7px; color:var(--primary); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; font-family:'IBM Plex Mono',monospace;}
  .f-link svg{width:14px; height:14px; transition:transform .2s;}
  .f-link:hover svg{transform:translateX(4px);}
  .f-visual.card{padding:24px;}
  .f-visual .mockup-title{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:16px;}
  .f-bars{display:flex; align-items:flex-end; gap:9px; height:110px;}
  .f-bars .bar{flex:1; background:linear-gradient(180deg,var(--primary),var(--primary-dark)); border-radius:5px 5px 0 0; position:relative;}
  .f-bars .bar span{position:absolute; top:-20px; left:0; right:0; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);}
  .f-lb-row{display:flex; align-items:center; gap:12px; padding:10px 0; font-size:13px;}
  .f-lb-row + .f-lb-row{border-top:1px solid var(--border);}
  .f-lb-rank{width:20px; font-family:'Playfair Display',serif; font-weight:700; color:var(--muted); font-size:14px;}
  .f-lb-name{flex:1; font-weight:500;}
  .f-lb-val{font-family:'IBM Plex Mono',monospace; color:var(--primary); font-weight:600;}
  @media (max-width:860px){
    .feature-row, .feature-row.rev{grid-template-columns:1fr; gap:28px; padding:44px 0;}
    .feature-row.rev .f-copy, .feature-row.rev .f-visual{order:0;}
  }

  /* Tool gallery — 6-up variant of the existing tile grid */
  .tile-grid-6{grid-template-columns:repeat(3,1fr);}
  @media (max-width:860px){ .tile-grid-6{grid-template-columns:repeat(2,1fr);} }

  /* Testimonial */
  .testimonial-wrap{max-width:680px; margin:0 auto; text-align:center;}
  .testimonial-wrap .quote-mark{font-family:'Playfair Display',serif; font-size:64px; color:var(--primary); line-height:.4; margin-bottom:18px; display:block;}
  .testimonial-wrap blockquote{font-family:'Playfair Display',serif; font-style:italic; font-size:clamp(20px,3vw,28px); line-height:1.4; font-weight:400; margin-bottom:26px;}
  .testimonial-wrap blockquote[data-typewriter]{display:block; text-align:left;}
  .testimonial-who{display:flex; align-items:center; justify-content:center; gap:12px;}
  .testimonial-who .av{width:42px; height:42px; border-radius:50%; background:var(--primary); color:#0D0F17; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; font-size:14px;}
  .testimonial-who .name{font-weight:600; font-size:13.5px;}
  .testimonial-who .role{font-size:12px; color:var(--muted); font-weight:300;}

  /* Community stat band (Big Family) */
  .community-copy{max-width:640px; margin:0 auto; text-align:center;}
  .community-copy p{color:var(--muted); font-size:15.5px; line-height:1.75; font-weight:300;}

  /* CTA band — Visit Us / Join */
  .cta-band{position:relative; background:var(--dark); border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:80px 0; overflow:hidden; text-align:center;}
  .cta-band::before{content:''; position:absolute; inset:0; background:radial-gradient(560px 300px at 50% 0%, rgba(203,161,53,0.16), transparent 70%); pointer-events:none;}
  .cta-band-inner{position:relative; max-width:560px; margin:0 auto;}
  .cta-band h2{color:#fff; font-size:clamp(28px,4vw,40px); margin-bottom:14px;}

function icon(name, cls){ return `<i data-feather="${ICONS[name]||name}" class="${cls||''}"></i>`; }
function renderIcons(root){
  if(!window.feather) return;
  const scope = root || document.getElementById('app') || document;
  feather.replace({ 'stroke-width': 2 }, scope);
}
function initScrollReveal(){
  const els = document.querySelectorAll('.reveal:not(.in)');
  const typeEls = document.querySelectorAll('[data-typewriter]:not(.typed)');
  if(!els.length && !typeEls.length) return;
  if(!('IntersectionObserver' in window)){
    els.forEach(el=>el.classList.add('in'));
    typeEls.forEach(el=>runTypewriter(el));
    return;
  }
  if(window.__tpRevealObserver) window.__tpRevealObserver.disconnect();
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        if(entry.target.classList.contains('reveal')){
          entry.target.classList.add('in');
        }
        if(entry.target.hasAttribute('data-typewriter')){
          runTypewriter(entry.target);
        }
        observer.unobserve(entry.target);
      }
    });
  }, {threshold:0.15, rootMargin:'0px 0px -10% 0px'});
  els.forEach(el=>observer.observe(el));
  typeEls.forEach(el=>observer.observe(el));
  window.__tpRevealObserver = observer;
}
function runTypewriter(el){
  if(el.classList.contains('typed')) return;
  el.classList.add('typed','typing');
  const full = el.getAttribute('data-typewriter') || el.textContent;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){ el.textContent = full; el.classList.remove('typing'); return; }
  el.textContent = '';
  let i = 0;
  const speed = Number(el.getAttribute('data-typewriter-speed')) || 32;
  const timer = setInterval(()=>{
    i++;
    el.textContent = full.slice(0, i);
    if(i >= full.length){
      clearInterval(timer);
      el.classList.remove('typing');
    }
  }, speed);
}

function findCarrier(id){ return CARRIERS.find(c=>c.id===id) || null; }
function carrierHashColor(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
  return `hsl(${Math.abs(hash)%360},55%,40%)`;
}
function carrierInitials(name){
  const words = name.replace(/\.[a-z]{2,4}$/i,'').replace(/[()]/g,'').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return '?';
  if(words.length===1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0]+words[1][0]).toUpperCase();
}
function carrierOptionsHtml(selectedId){
  return `<option value="">Select a carrier…</option>` +
    CARRIERS.map(c=>`<option value="${c.id}"${selectedId===c.id?' selected':''}>${esc(c.name)}</option>`).join('');
}
function carrierBadgeHtml(id, opts){
  const c = findCarrier(id);
  if(!c) return '';
  opts = opts || {};
  const size = opts.size || 26;
  const color = c.color || carrierHashColor(c.name);
  return `<span class="carrier-badge" style="display:inline-flex;align-items:center;gap:8px;">
    <span style="width:${size}px;height:${size}px;min-width:${size}px;border-radius:8px;background:${color};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.max(10,Math.round(size*0.4))}px;letter-spacing:.02em;">${esc(carrierInitials(c.name))}</span>

  </span>`;
}

function routeText(value){ return String(value||'').toLowerCase().replace(/[·,()/.-]+/g,' ').replace(/\s+/g,' ').trim(); }
function routeStopId(value){ return routeText(value).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'location'; }
function routeStopWithId(stop){ return { ...stop, id:stop.id||routeStopId(stop.name) }; }
function buildRouteStops(origin, destination){
  const from = routeText(origin), to = routeText(destination);
  const combined = `${from} ${to}`;
  const stops = [routeStopWithId({id:`origin-${routeStopId(origin)}`, name:origin||'Origin', kind:'Origin'})];
  ROUTE_STOP_CATALOG.forEach(route=>{
    if(route.match.every(token=>combined.includes(routeText(token)))) route.stops.forEach(stop=>stops.push(routeStopWithId(stop)));
  });
  CITY_STOP_CATALOG.forEach(city=>{
    if(city.match.some(token=>combined.includes(routeText(token)))) city.stops.forEach(stop=>stops.push(routeStopWithId(stop)));
  });
  stops.push(routeStopWithId({id:`destination-${routeStopId(destination)}`, name:destination||'Destination', kind:'Destination'}));
  const seen = new Set();
  return stops.filter(stop=>{
    const key = routeText(stop.name);
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function routeStopOptionsHtml(stops, selectedId){
  const options = stops.map(stop=>{
    const coords = Number.isFinite(Number(stop.latitude)) && Number.isFinite(Number(stop.longitude))

    return `<option value="${esc(stop.id)}" data-location="${esc(stop.name)}"${stop.id===selectedId?' selected':''}${coords}>${esc(stop.name)} · ${esc(stop.kind)}</option>`;
  }).join('');
  return `${options}<option value="custom"${selectedId==='custom'?' selected':''}>Custom location · type below</option>`;
}

/* ---------- timestamp-driven progression ---------- */
const AUTOMATION_TICK_MS = 15000;
let automationTimer = null;

function parseAutomationDate(value){
  const date = new Date(value || '');
  return Number.isNaN(date.getTime()) ? null : date;
}
function automationLocalValue(iso){
  const date = parseAutomationDate(iso);
  if(!date) return '';
  const offsetDate = new Date(date.getTime() - date.getTimezoneOffset()*60000);
  return offsetDate.toISOString().slice(0,16);
}
function automationDateValue(value){
  const date = parseAutomationDate(value);
  return date ? date.toISOString() : '';
}
function formatTransitDuration(milliseconds){
  if(!Number.isFinite(milliseconds) || milliseconds<=0) return '—';
  const totalMinutes = Math.round(milliseconds/60000);
  const days = Math.floor(totalMinutes/1440);
  const hours = Math.floor((totalMinutes%1440)/60);
  const minutes = totalMinutes%60;
  const parts = [];
  if(days) parts.push(`${days}d`);
  if(hours) parts.push(`${hours}h`);
  if(minutes || !parts.length) parts.push(`${minutes}m`);
  return parts.join(' ');
}
function recordAutomation(record){
  return record && record.trackingAutomation ? record.trackingAutomation : {};
}
function automationRouteStops(record, kind){
  if(kind==='flight'){
    return Array.isArray(record.routeStops)&&record.routeStops.length
      ? record.routeStops : buildRouteStops(record.origin, record.destination);
  }
  return shipmentRouteStops(record);
}
function calculateAutomationProgress(record, kind, originAt, destinationAt, now=Date.now()){
  const origin = parseAutomationDate(originAt);
  const destination = parseAutomationDate(destinationAt);
  if(!origin || !destination || destination.getTime()<=origin.getTime()) return null;
  const duration = destination.getTime()-origin.getTime();
  const ratio = Math.max(0, Math.min(1, (now-origin.getTime())/duration));
  const flow = kind==='flight' ? FLIGHT_STATUS_FLOW : STATUS_FLOW;
  const statusIndex = Math.min(flow.length-1, Math.floor(ratio*(flow.length-1)));
  const stops = automationRouteStops(record, kind);
  const stopIndex = Math.min(Math.max(stops.length-1, 0), Math.floor(ratio*Math.max(stops.length-1, 0)));
  const stop = stops[stopIndex] || null;
  const stageAt = origin.getTime() + duration*(statusIndex/Math.max(flow.length-1,1));
  return {
    ratio,
    duration,
    status:flow[statusIndex],
    statusIndex,
    stop,
    stopIndex,
    stageAt:new Date(stageAt).toISOString(),
    location:stop?.name || (kind==='flight' ? record.destination : record.recipient?.city) || 'Destination',
    stopId:stop?.id || ''
  };
}
function automationProgressMessage(record, kind, originValue, destinationValue){
  const origin = parseAutomationDate(originValue);
  const destination = parseAutomationDate(destinationValue);
  if(!origin || !destination || destination<=origin) return 'Choose an origin and destination timestamp to calculate the transit time.';
  if(Date.now()<origin.getTime()) return `Schedule ready — automatic updates begin at ${fmtDateTime(origin.toISOString())}.`;
  return `Automatic ${kind==='flight'?'flight':'shipping'} updates use the elapsed time between these two timestamps. Manual updates remain available while this schedule is active.`;
}

  const progress = calculateAutomationProgress(record, kind, originValue, destinationValue);
  const invalid = originValue && destinationValue && (!origin || !destination || destination<=origin);
  let message = automationProgressMessage(record, kind, originValue, destinationValue);
  let cls = '';
  if(invalid){

async function applyAutomaticUpdate(record, kind, now=Date.now()){
  const config = recordAutomation(record);
  if(config.mode!=='auto' || config.paused) return false;
  const progress = calculateAutomationProgress(record, kind, config.originAt, config.destinationAt, now);
  if(!progress) return false;
  const signature = `${progress.status}|${progress.stopId}`;
  if(config.lastAppliedSignature===signature && record.status===progress.status) return false;
  const timestamp = new Date().toISOString();
  const event = {
    id:genId(), status:progress.status, location:progress.location,
    routeStopId:progress.stopId, timestamp:progress.stageAt,
    description:'Automatic timestamp-based update'
  };
  if(Number.isFinite(Number(progress.stop?.latitude)) && Number.isFinite(Number(progress.stop?.longitude))){
    event.latitude = Number(progress.stop.latitude);
    event.longitude = Number(progress.stop.longitude);
  }
  record.events = record.events||[];
  record.events.push(event);
  record.status = progress.status;
  record.updatedAt = timestamp;
  if(kind==='flight'){
    record.routeStops = automationRouteStops(record, kind);
    record.currentLocationId = progress.stopId;
  }else if(event.latitude!==undefined){
    record.shipping = record.shipping||{};
    record.shipping.latitude = event.latitude;
    record.shipping.longitude = event.longitude;
  }
  record.trackingAutomation = {...config, lastAppliedSignature:signature, lastAutoUpdatedAt:timestamp};
  return true;
}
async function runAutomaticUpdates(shouldRerender=false){
  if(automationRunActive) return false;
  automationRunActive = true;
  let shipmentsChanged = false, flightsChanged = false;
  try{
    for(const shipment of Object.values(shipmentsDB)) shipmentsChanged = await applyAutomaticUpdate(shipment,'shipment') || shipmentsChanged;
    for(const flight of Object.values(flightsDB)) flightsChanged = await applyAutomaticUpdate(flight,'flight') || flightsChanged;
    if(shipmentsChanged) await saveShipments();
    if(flightsChanged) await saveFlights();
    if(shouldRerender && (shipmentsChanged||flightsChanged) && !document.querySelector('[data-automation-panel] input:focus, [data-automation-panel] select:focus, [data-automation-panel] textarea:focus')) rerenderCurrentPage();
    return shipmentsChanged||flightsChanged;
  }finally{
    automationRunActive = false;
  }
}
function startAutomationTicker(){
  if(automationTimer) clearInterval(automationTimer);
  automationTimer = setInterval(()=>runAutomaticUpdates(true), AUTOMATION_TICK_MS);
  runAutomaticUpdates(false);
}
async function saveAutomationSettings(kind, id, prefix){
  const record = kind==='flight' ? flightsDB[id] : shipmentsDB[id];
  if(!record) return;
  if(!currentUser || (record.userId && currentUser.email!==record.userId && !currentUser.isAdmin)){
    showToast('Only the creator can change automatic updates', true); return;
  }
  const mode = $(`#${prefix}_automation_mode`)?.value || 'manual';
  const originAt = automationDateValue($(`#${prefix}_origin_at`)?.value);
  const destinationAt = automationDateValue($(`#${prefix}_destination_at`)?.value);
  if(mode==='auto' && (!originAt || !destinationAt || new Date(destinationAt)<=new Date(originAt))){
    showToast('Choose valid timestamps with the destination after the origin', true); return;
  }
  const previous = JSON.stringify(record);
  const current = recordAutomation(record);
  record.trackingAutomation = {
    ...current, mode, originAt, destinationAt,
    paused:mode==='auto' && current.mode==='auto' ? !!current.paused : false,
    lastAppliedSignature:''
  };
  const changed = mode==='auto' ? await applyAutomaticUpdate(record, kind) : false;
  record.updatedAt = new Date().toISOString();
  const saved = kind==='flight' ? await saveFlights() : await saveShipments();
  if(!saved){
    Object.assign(record, JSON.parse(previous));
    return;
  }
  showToast(mode==='auto' ? (changed?'Automatic updates enabled':'Automatic schedule saved') : 'Manual updates enabled');
  rerenderCurrentPage();
}
async function toggleAutomation(kind, id){
  const record = kind==='flight' ? flightsDB[id] : shipmentsDB[id];
  if(!record || !record.trackingAutomation || record.trackingAutomation.mode!=='auto') return;
  if(!currentUser || (record.userId && currentUser.email!==record.userId && !currentUser.isAdmin)){
    showToast('Only the creator can pause automatic updates', true); return;
  }
  record.trackingAutomation.paused = !record.trackingAutomation.paused;
  record.trackingAutomation.lastAppliedSignature = '';
  if(!record.trackingAutomation.paused) await applyAutomaticUpdate(record, kind);
  record.updatedAt = new Date().toISOString();
  const saved = kind==='flight' ? await saveFlights() : await saveShipments();
  if(!saved) return;
  showToast(record.trackingAutomation.paused ? 'Automatic updates paused — manual updates are available' : 'Automatic updates resumed');
  rerenderCurrentPage();
}

async function getLegacyStorage(key, shared){
  if(window.storage && typeof window.storage.get==='function') return window.storage.get(key, shared);
  const value = localStorage.getItem(`${shared?'shared:':''}${key}`);
  return value===null ? null : { value };
}
async function setLegacyStorage(key, value, shared){
  if(window.storage && typeof window.storage.set==='function') return window.storage.set(key, value, shared);
  localStorage.setItem(`${shared?'shared:':''}${key}`, value);
}
const storageAPI = {
  async get(key, shared){
    const cloudKey = `${shared?'shared:':''}${key}`;
    if(window.firebaseCloud && window.firebaseCloud.isReady){
      try{
        const cloudValue = await window.firebaseCloud.getState(cloudKey);
        if(cloudValue) return cloudValue;
        const legacyValue = await getLegacyStorage(key, shared);
        if(legacyValue && legacyValue.value){
          await window.firebaseCloud.setState(cloudKey, legacyValue.value);
        }
        return legacyValue;
      }catch(error){
        console.warn('Firebase read failed; using fallback storage.', error);
      }
    }
    return getLegacyStorage(key, shared);
  },
  async set(key, value, shared){
    const cloudKey = `${shared?'shared:':''}${key}`;
    if(window.firebaseCloud && window.firebaseCloud.isReady){
      try{
        await window.firebaseCloud.setState(cloudKey, value);
        return;
      }catch(error){
        console.warn('Firebase write failed; using fallback storage.', error);
        showToast('Firebase save failed — saved locally instead', true);
      }
    }
    return setLegacyStorage(key, value, shared);
  }
};

/* ---------- storage helpers ---------- */
async function loadDB(){
  const readJson = async key => {
    try{
      const value = await storageAPI.get(key, true);
      return value && value.value ? JSON.parse(value.value) : {};
    }catch(e){ return {}; }
  };
  const [users, shipments, flights] = await Promise.all([
    readJson('nbatools-users'),
    readJson('nbatools-shipments'),
    readJson('nbatools-flights')
  ]);
  usersDB = users;
  shipmentsDB = shipments;
  flightsDB = flights;
  if(!usersDB['admin@trackport.io']){
    usersDB['admin@trackport.io'] = { fullName:'Admin', email:'admin@trackport.io', phone:'', password:'admin123', isAdmin:true, createdAt:new Date().toISOString() };
    await saveUsers();
  }
  restoreAuthSession();
  dbReady = true;
  if(!currentUser && window.firebaseAuthHelpers && window.firebaseAuthHelpers.isReady){
    try{
      const googleUser = await window.firebaseAuthHelpers.getRedirectResult();
      if(googleUser) await completeSocialLogin(googleUser);
    }catch(error){
