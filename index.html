<style id="tp-premium-layer">
  :root{
    --ease-lux: cubic-bezier(.16,1,.3,1);
    --ease-soft: cubic-bezier(.33,1,.68,1);
    --dur-fast: .28s;
    --dur-mid: .55s;
    --dur-slow: .9s;
    --glass-glow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 1px 0 rgba(255,255,255,.10) inset,
                  0 18px 50px rgba(0,0,0,.45), 0 0 60px -18px var(--primary-glow);
  }

  /* ---------- 1. Luxury soft scrolling ---------- */
  html{scroll-behavior:smooth; scroll-padding-top:104px;}
  html.tp-smooth, html.tp-smooth body{overscroll-behavior-y:none;}
  body{scrollbar-gutter:stable;}
  ::-webkit-scrollbar-thumb{transition:background .4s var(--ease-lux);}

  /* Ambient scroll progress ribbon */
  #tp-progress{
    position:fixed; top:0; left:0; height:2px; width:100%; z-index:9999;
    transform:scaleX(0); transform-origin:0 50%;
    background:linear-gradient(90deg, rgba(212,175,90,0), var(--primary), #8f7ce8, rgba(212,175,90,0));
    box-shadow:0 0 18px var(--primary-glow);
    pointer-events:none; will-change:transform;
  }

  /* ---------- 2. Glowing glass background ---------- */
  #tp-aura{position:fixed; inset:0; z-index:-3; pointer-events:none; overflow:hidden;}
  #tp-aura .orb{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:.55;
    will-change:transform; mix-blend-mode:screen;
    animation:tpDrift 26s var(--ease-soft) infinite alternate;
  }
  #tp-aura .orb.a{width:46vw; height:46vw; left:-8vw; top:-10vh;
    background:radial-gradient(circle at 30% 30%, rgba(212,175,90,.55), transparent 70%); animation-duration:24s;}
  #tp-aura .orb.b{width:52vw; height:52vw; right:-12vw; top:12vh;
    background:radial-gradient(circle at 60% 40%, rgba(110,96,235,.48), transparent 70%); animation-duration:31s; animation-delay:-6s;}
  #tp-aura .orb.c{width:44vw; height:44vw; left:26vw; bottom:-18vh;
    background:radial-gradient(circle at 50% 50%, rgba(36,174,168,.40), transparent 70%); animation-duration:37s; animation-delay:-13s;}
  #tp-aura .veil{
    position:absolute; inset:-10%;
    background:
      radial-gradient(1200px 700px at var(--mx,50%) var(--my,30%), rgba(255,255,255,.07), transparent 62%),
      linear-gradient(180deg, rgba(6,7,12,.35), rgba(6,7,12,.72));
    transition:background-position .6s var(--ease-lux);
  }
  #tp-grain{
    position:fixed; inset:0; z-index:-2; pointer-events:none; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  }
  @keyframes tpDrift{
    0%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(4vw,-3vh,0) scale(1.12);}
    100%{transform:translate3d(-3vw,4vh,0) scale(1.05);}
  }

  /* ---------- 3. Premium glass surfaces ---------- */
  .glass, .card, .panel, .modal, .sheet, .navbar, .stat, .tile, .box{
    transition:transform var(--dur-mid) var(--ease-lux),
               box-shadow var(--dur-mid) var(--ease-lux),
               border-color var(--dur-mid) var(--ease-lux),
               background var(--dur-mid) var(--ease-lux);
  }
  .glass, .card, .panel{
    -webkit-backdrop-filter:blur(26px) saturate(165%);
    backdrop-filter:blur(26px) saturate(165%);
    box-shadow:var(--glass-glow);
  }
  .glass:hover, .card:hover, .panel:hover{
    border-color:rgba(255,255,255,.22);
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 26px 70px rgba(0,0,0,.5), 0 0 80px -18px var(--primary-glow);
  }
  /* Specular sheen that follows the pointer */
  .tp-sheen{position:relative; overflow:hidden;}
  .tp-sheen::after{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(320px circle at var(--px,50%) var(--py,50%), rgba(255,255,255,.14), transparent 60%);
    transition:opacity .45s var(--ease-lux);
  }
  .tp-sheen:hover::after{opacity:1;}

  /* ---------- 4. Touch / press micro-interactions ---------- */
  button, .btn, a.btn, .nav-link, [role="button"], .tab, .chip{
    -webkit-tap-highlight-color:transparent;
    transition:transform var(--dur-fast) var(--ease-lux), box-shadow var(--dur-fast) var(--ease-lux),
               background var(--dur-fast) var(--ease-lux), color var(--dur-fast) var(--ease-lux),
               opacity var(--dur-fast) var(--ease-lux);
  }
  .btn:hover, button:hover{transform:translateY(-1.5px);}
  .btn:active, button:active, [role="button"]:active{transform:translateY(0) scale(.975);}
  .tp-press{transform:scale(.97) !important;}
  .tp-ripple{
    position:absolute; border-radius:50%; transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle, rgba(255,255,255,.55), rgba(212,175,90,.25) 45%, transparent 70%);
    pointer-events:none; animation:tpRipple .65s var(--ease-lux) forwards; mix-blend-mode:screen;
  }
  @keyframes tpRipple{to{transform:translate(-50%,-50%) scale(1); opacity:0;}}
  input, select, textarea{transition:box-shadow var(--dur-fast) var(--ease-lux), border-color var(--dur-fast) var(--ease-lux), background var(--dur-fast) var(--ease-lux);}
  input:focus, select:focus, textarea:focus{
    box-shadow:0 0 0 3px var(--primary-light), 0 0 30px -8px var(--primary-glow); outline:none;
  }
  :focus-visible{outline:2px solid var(--primary); outline-offset:3px; border-radius:8px;}

  /* ---------- 5. Reveal-on-scroll choreography ---------- */
  .tp-reveal{opacity:0; transform:translate3d(0,22px,0) scale(.985); filter:blur(6px); will-change:opacity, transform;}
  .tp-reveal.tp-in{
    opacity:1 !important; transform:none !important; filter:blur(0) !important;
    transition:opacity var(--dur-slow) var(--ease-lux), transform var(--dur-slow) var(--ease-lux), filter var(--dur-slow) var(--ease-lux);
    transition-delay:var(--tp-delay, 0ms);
  }
  .tp-fade-page{animation:tpPageIn .7s var(--ease-lux) both;}
  @keyframes tpPageIn{from{opacity:0; transform:translate3d(0,14px,0) scale(.995); filter:blur(4px);} to{opacity:1; transform:none; filter:none;}}

  /* ---------- 6. Performance hints ---------- */
  img, video{content-visibility:auto;}
  .card, .panel, section{contain:paint;}
  #tp-aura, #tp-progress, .tp-reveal{backface-visibility:hidden;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
    .tp-reveal{opacity:1; transform:none; filter:none;}
  }
</style>

<div id="tp-progress"></div>
<div id="tp-aura" aria-hidden="true">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="veil"></div>
</div>
<div id="tp-grain" aria-hidden="true"></div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const raf = requestAnimationFrame;

  /* ---- Luxury inertia scrolling (wheel-driven, touch stays native) ---- */
  if(!reduce && matchMedia('(pointer:fine)').matches){
    document.documentElement.classList.add('tp-smooth');
    let target = window.scrollY, current = window.scrollY, running = false;
    const ease = 0.11;
    const max = () => document.documentElement.scrollHeight - window.innerHeight;
    const loop = () => {
      current += (target - current) * ease;
      if(Math.abs(target - current) < .4){ current = target; running = false; }
      window.scrollTo(0, current);
      if(running) raf(loop);
    };
    addEventListener('wheel', e => {
      if(e.ctrlKey) return;
      const path = e.composedPath?.() || [];
      for(const el of path){
        if(el instanceof HTMLElement){
          const st = getComputedStyle(el).overflowY;
          if((st === 'auto' || st === 'scroll') && el.scrollHeight > el.clientHeight + 2) return;
        }
      }
      e.preventDefault();
      target = Math.min(max(), Math.max(0, target + e.deltaY * 1.05));
      if(!running){ running = true; current = window.scrollY; raf(loop); }
    }, { passive:false });
    addEventListener('scroll', () => { if(!running) target = current = window.scrollY; }, { passive:true });
    addEventListener('resize', () => { target = current = window.scrollY; }, { passive:true });
  }

  /* ---- Scroll progress ribbon ---- */
  const bar = document.getElementById('tp-progress');
  let ticking = false;
  const drawProgress = () => {
    const h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`;
    ticking = false;
  };
  addEventListener('scroll', () => { if(!ticking){ ticking = true; raf(drawProgress); } }, { passive:true });
  drawProgress();

  /* ---- Aura follows the pointer (throttled to one frame) ---- */
  const veil = document.querySelector('#tp-aura .veil');
  let pending = false, px = 50, py = 30;
  const movePointer = (x, y) => {
    px = (x / innerWidth) * 100; py = (y / innerHeight) * 100;
    if(!pending){ pending = true; raf(() => { veil.style.setProperty('--mx', px + '%'); veil.style.setProperty('--my', py + '%'); pending = false; }); }
  };
  if(!reduce){
    addEventListener('pointermove', e => movePointer(e.clientX, e.clientY), { passive:true });
  }

  /* ---- Reveal on scroll (works with dynamically rendered views) ---- */
  const SELECTOR = '.card, .panel, .glass, section, .stat, .tile, .hero, .feature, .step, .row-item, table, .box';
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
    entries.forEach((en, i) => {
      if(en.isIntersecting){
        en.target.style.setProperty('--tp-delay', Math.min(i * 55, 260) + 'ms');
        en.target.classList.add('tp-in');
        io.unobserve(en.target);
      }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 }) : null;

  const enhance = (root) => {
    if(reduce || !io) return;
    root.querySelectorAll?.(SELECTOR).forEach(el => {
      if(el.dataset.tpSeen) return;
      el.dataset.tpSeen = '1';
      el.classList.add('tp-reveal');
      if(el.matches('.card, .panel, .glass, .tile, .stat')) el.classList.add('tp-sheen');
      io.observe(el);
    });
  };

  const app = document.getElementById('app') || document.body;
  enhance(document);
  let mo_t;
  new MutationObserver(() => { clearTimeout(mo_t); mo_t = setTimeout(() => {
    enhance(app);
    app.firstElementChild?.classList.add('tp-fade-page');
  }, 60); }).observe(app, { childList:true, subtree:true });

  /* ---- Pointer sheen coordinates ---- */
  document.addEventListener('pointermove', e => {
    const card = e.target.closest?.('.tp-sheen');
    if(!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--px', ((e.clientX - r.left) / r.width * 100) + '%');
    card.style.setProperty('--py', ((e.clientY - r.top) / r.height * 100) + '%');
  }, { passive:true });

  /* ---- Touch / click ripple + press feedback ---- */
  const RIPPLE_SEL = 'button, .btn, [role="button"], .nav-link, .chip, .tab, .addr-gen-btn';
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest?.(RIPPLE_SEL);
    if(!el || reduce) return;
    el.classList.add('tp-press');
    const cs = getComputedStyle(el);
    if(cs.position === 'static') el.style.position = 'relative';
    if(cs.overflow === 'visible') el.style.overflow = 'hidden';
    const r = el.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2.2;
    const s = document.createElement('span');
    s.className = 'tp-ripple';
    s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;`;
    el.appendChild(s);
    setTimeout(() => s.remove(), 680);
  }, { passive:true });
  const unpress = () => document.querySelectorAll('.tp-press').forEach(el => el.classList.remove('tp-press'));
  addEventListener('pointerup', unpress, { passive:true });
  addEventListener('pointercancel', unpress, { passive:true });

  /* ---- Haptic tap on supported touch devices ---- */
  addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch' && navigator.vibrate && e.target.closest?.(RIPPLE_SEL)) navigator.vibrate(8);
  }, { passive:true });

  /* ---- Performance: lazy-load + async decode every image ---- */
  const lazify = (root) => root.querySelectorAll?.('img').forEach(img => {
    if(!img.loading) img.loading = 'lazy';
    img.decoding = 'async';
  });
  lazify(document);
  new MutationObserver(() => lazify(document)).observe(document.body, { childList:true, subtree:true });

  /* ---- Pause heavy background work when the tab is hidden ---- */
  document.addEventListener('visibilitychange', () => {
    const aura = document.getElementById('tp-aura');
    aura.style.animationPlayState = document.hidden ? 'paused' : 'running';
    aura.querySelectorAll('.orb').forEach(o => o.style.animationPlayState = document.hidden ? 'paused' : 'running');
  });
})();
</script>

<script id="trackport-pwa">
/* ---------- installable PWA experience ---------- */
(function(){
  'use strict';

  let deferredInstallPrompt = null;
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  function installButtons(){
    return Array.from(document.querySelectorAll('[data-action="install-app"]'));
  }

  function updateInstallButtons(){
    const installed = isStandalone();
    installButtons().forEach(button => {
      button.hidden = installed;
      button.setAttribute('aria-hidden', installed ? 'true' : 'false');
      if(deferredInstallPrompt){
        button.title = 'Install TrackPort on this device';
      }
    });
  }

  function explainInstall(){
    const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    const message = isIos
      ? 'To install TrackPort, tap Share in Safari, then choose “Add to Home Screen”.'
      : 'Use your browser menu and choose “Install app” or “Add to Home screen”.';
    if(typeof window.showToast === 'function') window.showToast(message);
    else window.alert(message);
  }

  async function requestInstall(){
    if(!deferredInstallPrompt){
      explainInstall();
      return;
    }
    const promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;
    updateInstallButtons();
    try{
      await promptEvent.prompt();
      const choice = await promptEvent.userChoice;
      if(choice && choice.outcome === 'accepted'){
        if(typeof window.showToast === 'function') window.showToast('TrackPort is being installed');
      }
    }catch(error){
      console.warn('TrackPort install prompt was not completed.', error);
      explainInstall();
    }
  }

  /* ---- Floating install banner ---- */
  const bannerEl = () => document.getElementById('tp-install-banner');
  const bannerDismissed = () => { try{ return sessionStorage.getItem('tp-install-banner-dismissed') === '1'; }catch(_e){ return false; } };

  function showInstallBanner(){
    const banner = bannerEl();
    if(!banner || isStandalone() || bannerDismissed()) return;
    banner.classList.add('tp-banner-show');
    banner.setAttribute('aria-hidden', 'false');
  }

  function hideInstallBanner(){
    const banner = bannerEl();
    if(!banner) return;
    banner.classList.remove('tp-banner-show');
    banner.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('tp-banner-dismiss')?.addEventListener('click', () => {
    try{ sessionStorage.setItem('tp-install-banner-dismissed', '1'); }catch(_e){}
    hideInstallBanner();
  });

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    updateInstallButtons();
    showInstallBanner();
  });

  // iOS/Safari never fires beforeinstallprompt — show the banner anyway;
  // requestInstall() falls back to "Add to Home Screen" instructions there.
  setTimeout(showInstallBanner, 2500);

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    updateInstallButtons();
    hideInstallBanner();
    if(typeof window.showToast === 'function') window.showToast('TrackPort installed successfully');
  });

  document.addEventListener('click', event => {
    const button = event.target.closest?.('[data-action="install-app"]');
    if(button){
      event.preventDefault();
      requestInstall();
    }
  });

  function registerServiceWorker(){
    if(!('serviceWorker' in navigator) || !/^https?:$/.test(window.location.protocol)) return;
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(error => {
      console.warn('TrackPort offline support could not be enabled.', error);
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => {
      updateInstallButtons();
      registerServiceWorker();
    }, {once:true});
  }else{
    updateInstallButtons();
    registerServiceWorker();
  }
})();
</script>
